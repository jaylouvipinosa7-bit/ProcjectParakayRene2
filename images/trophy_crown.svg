<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sparkles -->
  <polygon points="100,20 102,28 110,30 102,32 100,40 98,32 90,30 98,28" fill="#fef08a" opacity="0.9" />
  <circle cx="35" cy="55" r="3" fill="#fde68a" opacity="0.8" />
  <circle cx="165" cy="55" r="3" fill="#fde68a" opacity="0.8" />

  <!-- Crown Body -->
  <path d="M 35 140 L 40 75 L 75 110 L 100 50 L 125 110 L 160 75 L 165 140 Z" fill="url(#crownGold)" stroke="#b45309" stroke-width="3" filter="url(#crownGlow)" />

  <!-- Crown Base Band -->
  <path d="M 30 140 L 170 140 L 165 160 L 35 160 Z" fill="url(#crownGold)" stroke="#92400e" stroke-width="2.5" />

  <!-- Pearls / Jewels on Crown Peaks -->
  <circle cx="40" cy="73" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="100" cy="48" r="11" fill="url(#rubyGrad)" stroke="#ffe4e6" stroke-width="2" />
  <circle cx="160" cy="73" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="75" cy="108" r="6" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5" />
  <circle cx="125" cy="108" r="6" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5" />

  <!-- Base Jewels -->
  <circle cx="60" cy="150" r="5" fill="url(#rubyGrad)" stroke="#ffe4e6" stroke-width="1" />
  <circle cx="100" cy="150" r="6" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5" />
  <circle cx="140" cy="150" r="5" fill="url(#rubyGrad)" stroke="#ffe4e6" stroke-width="1" />

  <!-- Inner Shine highlight -->
  <path d="M 45 136 L 50 88 L 75 116 L 100 68 L 125 116 L 150 88 L 155 136 Z" fill="#ffffff" opacity="0.2" />
</svg>
