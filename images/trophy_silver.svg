<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="silverShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="silverBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sparkles -->
  <circle cx="35" cy="50" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="165" cy="45" r="3.5" fill="#e2e8f0" opacity="0.95" />
  <circle cx="170" cy="95" r="2.5" fill="#cbd5e1" opacity="0.8" />
  <circle cx="30" cy="110" r="2" fill="#ffffff" opacity="0.7" />
  <polygon points="160,35 162,42 169,44 162,46 160,53 158,46 151,44 158,42" fill="#ffffff" opacity="0.9" />
  <polygon points="40,40 41.5,45 46.5,46.5 41.5,48 40,53 38.5,48 33.5,46.5 38.5,45" fill="#f8fafc" opacity="0.85" />

  <!-- Left Handle -->
  <path d="M 65 55 C 30 55, 25 105, 68 115 C 62 102, 58 85, 65 72 Z" fill="url(#silverGrad)" stroke="#64748b" stroke-width="2.5" />
  <!-- Right Handle -->
  <path d="M 135 55 C 170 55, 175 105, 132 115 C 138 102, 142 85, 135 72 Z" fill="url(#silverGrad)" stroke="#64748b" stroke-width="2.5" />

  <!-- Main Trophy Cup -->
  <path d="M 60 40 L 140 40 C 140 75, 130 120, 100 135 C 70 120, 60 75, 60 40 Z" fill="url(#silverGrad)" stroke="#64748b" stroke-width="3" filter="url(#silverGlow)" />
  
  <!-- Cup Rim -->
  <ellipse cx="100" cy="40" rx="40" ry="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  
  <!-- Cup Inner Depth Highlight -->
  <path d="M 70 48 Q 100 62 130 48 Q 125 110 100 125 Q 75 110 70 48 Z" fill="url(#silverShine)" opacity="0.45" />

  <!-- Center Winged Emblem -->
  <polygon points="100,68 104,80 116,81 107,89 110,101 100,94 90,101 93,89 84,81 96,80" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Stem -->
  <path d="M 90 135 L 110 135 L 114 158 L 86 158 Z" fill="url(#silverGrad)" stroke="#475569" stroke-width="2" />
  <ellipse cx="100" cy="158" rx="18" ry="4" fill="#cbd5e1" />

  <!-- Pedestal Base -->
  <rect x="62" y="162" width="76" height="18" rx="4" fill="url(#silverBase)" stroke="#64748b" stroke-width="2" />
  <rect x="74" y="166" width="52" height="10" rx="2" fill="#ffffff" opacity="0.85" />
</svg>
