<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="neon-wheel-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Rim -->
  <circle cx="50" cy="50" r="46" fill="#0d1117" stroke="#38bdf8" stroke-width="3" filter="url(#neon-wheel-glow)"/>
  
  <!-- Colored Wheel Segments -->
  <!-- 1: Red/Pink -->
  <path d="M50 50 L50 6 A44 44 0 0 1 81.1 18.9 Z" fill="#ec4899" opacity="0.95"/>
  <!-- 2: Purple -->
  <path d="M50 50 L81.1 18.9 A44 44 0 0 1 94 50 Z" fill="#8b5cf6" opacity="0.95"/>
  <!-- 3: Blue/Cyan -->
  <path d="M50 50 L94 50 A44 44 0 0 1 81.1 81.1 Z" fill="#06b6d4" opacity="0.95"/>
  <!-- 4: Green -->
  <path d="M50 50 L81.1 81.1 A44 44 0 0 1 50 94 Z" fill="#10b981" opacity="0.95"/>
  <!-- 5: Yellow/Gold -->
  <path d="M50 50 L50 94 A44 44 0 0 1 18.9 81.1 Z" fill="#f59e0b" opacity="0.95"/>
  <!-- 6: Orange -->
  <path d="M50 50 L18.9 81.1 A44 44 0 0 1 6 50 Z" fill="#f97316" opacity="0.95"/>
  <!-- 7: Crimson -->
  <path d="M50 50 L6 50 A44 44 0 0 1 18.9 18.9 Z" fill="#ef4444" opacity="0.95"/>
  <!-- 8: Rose -->
  <path d="M50 50 L18.9 18.9 A44 44 0 0 1 50 6 Z" fill="#f43f5e" opacity="0.95"/>

  <!-- Segment Dividers -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M50 6 L50 94 M6 50 L94 50 M18.9 18.9 L81.1 81.1 M18.9 81.1 L81.1 18.9" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Inner Center Ring -->
  <circle cx="50" cy="50" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="12" fill="#fbbf24"/>
  <circle cx="50" cy="50" r="6" fill="#78350f"/>
</svg>
