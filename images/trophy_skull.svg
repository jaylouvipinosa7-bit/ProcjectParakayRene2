<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="skullPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#9333ea" />
      <stop offset="80%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="skullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Crossbones Behind -->
  <path d="M 40 40 L 160 140 M 160 40 L 40 140" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" opacity="0.75" />
  <circle cx="36" cy="36" r="8" fill="#a5f3fc" opacity="0.8" />
  <circle cx="164" cy="36" r="8" fill="#a5f3fc" opacity="0.8" />
  <circle cx="36" cy="144" r="8" fill="#a5f3fc" opacity="0.8" />
  <circle cx="164" cy="144" r="8" fill="#a5f3fc" opacity="0.8" />

  <!-- Handles -->
  <path d="M 60 65 C 20 60, 20 110, 65 118 C 55 105, 52 85, 60 75 Z" fill="url(#skullPurple)" stroke="#a855f7" stroke-width="2.5" />
  <path d="M 140 65 C 180 60, 180 110, 135 118 C 145 105, 148 85, 140 75 Z" fill="url(#skullPurple)" stroke="#a855f7" stroke-width="2.5" />

  <!-- Center Trophy Head / Skull Shape -->
  <path d="M 65 50 C 65 25, 135 25, 135 50 C 135 75, 128 95, 120 102 L 120 118 L 80 118 L 80 102 C 72 95, 65 75, 65 50 Z" fill="url(#skullPurple)" stroke="#c084fc" stroke-width="3" filter="url(#skullGlow)" />

  <!-- Glowing Neon Eyes -->
  <ellipse cx="84" cy="62" rx="9" ry="12" fill="#06b6d4" filter="drop-shadow(0 0 6px #22d3ee)" />
  <ellipse cx="116" cy="62" rx="9" ry="12" fill="#06b6d4" filter="drop-shadow(0 0 6px #22d3ee)" />
  <ellipse cx="85" cy="60" rx="3" ry="5" fill="#ffffff" />
  <ellipse cx="117" cy="60" rx="3" ry="5" fill="#ffffff" />

  <!-- Nose Cavity -->
  <polygon points="100,78 95,88 105,88" fill="#3b0764" />

  <!-- Teeth Grid -->
  <line x1="88" y1="108" x2="88" y2="118" stroke="#a5f3fc" stroke-width="2.5" />
  <line x1="96" y1="108" x2="96" y2="118" stroke="#a5f3fc" stroke-width="2.5" />
  <line x1="104" y1="108" x2="104" y2="118" stroke="#a5f3fc" stroke-width="2.5" />
  <line x1="112" y1="108" x2="112" y2="118" stroke="#a5f3fc" stroke-width="2.5" />

  <!-- Crown on Skull Head -->
  <polygon points="75,34 85,42 100,26 115,42 125,34 122,46 78,46" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />

  <!-- Stem & Base -->
  <path d="M 90 120 L 110 120 L 114 156 L 86 156 Z" fill="url(#skullPurple)" stroke="#9333ea" stroke-width="2" />
  <rect x="60" y="156" width="80" height="20" rx="4" fill="#1e1035" stroke="#a855f7" stroke-width="2" />
  <rect x="70" y="161" width="60" height="10" rx="2" fill="#06b6d4" opacity="0.85" />
</svg>
