<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Heavy 3D Neon Glow -->
    <filter id="neonGlow_25_false" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Base Bevel Gradient -->
    <linearGradient id="bevelRim_25_false" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#fda4af" />
      <stop offset="70%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Deep Carbon Metallic Shield Body -->
    <radialGradient id="bodyPlate_25_false" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#200609" />
      <stop offset="75%" stop-color="#0d0204" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- 3D Face Extrusion Gradient -->
    <linearGradient id="numFaceGrad_25_false" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Glass Specular Glare -->
    <linearGradient id="glassGlare_25_false" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="18" y="24" width="204" height="198" rx="38" ry="38" fill="#000000" opacity="0.75" filter="blur(8px)" />

  <!-- Heavy Outer 3D Rim -->
  <rect x="16" y="16" width="208" height="202" rx="38" ry="38" fill="url(#bevelRim_25_false)" filter="url(#neonGlow_25_false)" opacity="0.9" />

  <!-- Inner Metallic Carbon Shield -->
  <rect x="20" y="20" width="200" height="194" rx="34" ry="34" fill="url(#bodyPlate_25_false)" stroke="#111827" stroke-width="2" />

  <!-- Inner Neon Pinstripe -->
  <rect x="25" y="25" width="190" height="184" rx="30" ry="30" fill="none" stroke="#fda4af" stroke-width="2.5" opacity="0.65" />

  <!-- Curved Top Specular Glass Glare -->
  <path d="M 28,32 C 60,32 180,32 212,32 C 215,65 195,100 120,105 C 45,100 25,65 28,32 Z" fill="url(#glassGlare_25_false)" />

  <!-- Small Top Header Pill Badge -->
  <rect x="70" y="32" width="100" height="18" rx="9" fill="rgba(0,0,0,0.6)" stroke="#fda4af" stroke-width="1.2" />
  <text x="120" y="44" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#fecdd3" letter-spacing="1">POINTS PENALTY</text>

  <!-- Decorative Vegas Stars Flanking -->
  <polygon points="46,134 49,141 57,142 51,147 53,155 46,151 39,155 41,147 35,142 43,141" fill="#fecdd3" opacity="0.8" />
  <polygon points="194,134 197,141 205,142 199,147 201,155 194,151 187,155 189,147 183,142 191,141" fill="#fecdd3" opacity="0.8" />

  <!-- ================= 3D EXTRUDED NUMBER TYPOGRAPHY ================= -->
  <!-- Layer 6: Deep Cast Shadow -->
  <text x="120" y="154" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="84" fill="#000000" opacity="0.85" filter="blur(4px)">-25</text>

  <!-- Layer 5: Darkest Extrusion Back -->
  <text x="120" y="152" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="84" fill="#4c0519">-25</text>

  <!-- Layer 4: Deep Mid Extrusion -->
  <text x="120" y="150" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="84" fill="#4c0519">-25</text>

  <!-- Layer 3: Mid Extrusion -->
  <text x="120" y="148" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="84" fill="#881337">-25</text>

  <!-- Layer 2: Upper Extrusion -->
  <text x="120" y="145" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="84" fill="#881337">-25</text>

  <!-- Layer 1: Thick Chrome / White Bevel Outline -->
  <text x="120" y="142" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="84" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" opacity="0.95">-25</text>

  <!-- Top Layer: 3D Radiant Gradient Face -->
  <text x="120" y="142" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="84" fill="url(#numFaceGrad_25_false)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">-25</text>

  <!-- Subtle Bottom Inset Shadow Line -->
  <line x1="45" y1="190" x2="195" y2="190" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round" />
</svg>