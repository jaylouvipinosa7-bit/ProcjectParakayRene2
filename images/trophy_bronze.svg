<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="bronzeShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bronzeBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#2d0a04" />
    </linearGradient>
    <filter id="bronzeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sparkles -->
  <circle cx="35" cy="50" r="3" fill="#fdba74" opacity="0.8" />
  <circle cx="165" cy="45" r="3.5" fill="#ffedd5" opacity="0.9" />
  <circle cx="170" cy="95" r="2.5" fill="#f97316" opacity="0.7" />
  <polygon points="160,35 162,42 169,44 162,46 160,53 158,46 151,44 158,42" fill="#ffedd5" opacity="0.85" />

  <!-- Handles -->
  <path d="M 65 55 C 30 55, 25 105, 68 115 C 62 102, 58 85, 65 72 Z" fill="url(#bronzeGrad)" stroke="#7c2d12" stroke-width="2.5" />
  <path d="M 135 55 C 170 55, 175 105, 132 115 C 138 102, 142 85, 135 72 Z" fill="url(#bronzeGrad)" stroke="#7c2d12" stroke-width="2.5" />

  <!-- Main Trophy Cup -->
  <path d="M 60 40 L 140 40 C 140 75, 130 120, 100 135 C 70 120, 60 75, 60 40 Z" fill="url(#bronzeGrad)" stroke="#7c2d12" stroke-width="3" filter="url(#bronzeGlow)" />
  
  <!-- Rim -->
  <ellipse cx="100" cy="40" rx="40" ry="7" fill="#fed7aa" stroke="#c2410c" stroke-width="2" />
  
  <!-- Highlight -->
  <path d="M 70 48 Q 100 62 130 48 Q 125 110 100 125 Q 75 110 70 48 Z" fill="url(#bronzeShine)" opacity="0.35" />

  <!-- Center Shield Emblem -->
  <path d="M 92 72 L 108 72 L 108 88 Q 108 98 100 103 Q 92 98 92 88 Z" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5" />

  <!-- Stem -->
  <path d="M 90 135 L 110 135 L 114 158 L 86 158 Z" fill="url(#bronzeGrad)" stroke="#7c2d12" stroke-width="2" />
  <ellipse cx="100" cy="158" rx="18" ry="4" fill="#ea580c" />

  <!-- Pedestal Base -->
  <rect x="62" y="162" width="76" height="18" rx="4" fill="url(#bronzeBase)" stroke="#c2410c" stroke-width="2" />
  <rect x="74" y="166" width="52" height="10" rx="2" fill="#fdba74" opacity="0.8" />
</svg>
