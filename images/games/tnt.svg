<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tntBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#140404"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="url(#tntBg)" stroke="#ef4444" stroke-width="2"/>
  <!-- 3D TNT block -->
  <g transform="translate(14, 14) scale(0.72)">
    <!-- Top face -->
    <polygon points="50,10 90,25 50,40 10,25" fill="#991b1b"/>
    <polygon points="50,15 80,26 50,37 20,26" fill="#7f1d1d"/>
    <!-- Left face -->
    <polygon points="10,25 50,40 50,85 10,70" fill="#dc2626"/>
    <!-- Right face -->
    <polygon points="50,40 90,25 90,70 50,85" fill="#b91c1c"/>
    <!-- White band across -->
    <polygon points="10,42 50,57 50,68 10,53" fill="#ffffff"/>
    <polygon points="50,57 90,42 90,53 50,68" fill="#e5e5e5"/>
    <!-- TNT Text -->
    <text x="32" y="63" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#18181b" transform="skewY(20)">TNT</text>
    <text x="68" y="42" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#18181b" transform="skewY(-20)">TNT</text>
  </g>
</svg>
