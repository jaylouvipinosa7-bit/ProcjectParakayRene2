<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="sunRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="pvzStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="sunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sparkles -->
  <circle cx="35" cy="45" r="3.5" fill="#fef08a" opacity="0.9" />
  <circle cx="165" cy="45" r="3.5" fill="#fef08a" opacity="0.9" />
  <circle cx="170" cy="95" r="2.5" fill="#facc15" opacity="0.8" />
  <circle cx="30" cy="100" r="2.5" fill="#facc15" opacity="0.8" />

  <!-- Sun Rays (12 rotating rays) -->
  <g fill="url(#sunRay)" stroke="#ca8a04" stroke-width="1.5" filter="url(#sunGlow)">
    <polygon points="100,20 106,38 94,38" />
    <polygon points="100,140 106,122 94,122" />
    <polygon points="40,80 58,86 58,74" />
    <polygon points="160,80 142,86 142,74" />
    
    <polygon points="58,38 74,48 66,57" />
    <polygon points="142,38 134,57 126,48" />
    <polygon points="58,122 66,103 74,112" />
    <polygon points="142,122 126,112 134,103" />

    <polygon points="76,26 86,43 75,46" />
    <polygon points="124,26 125,46 114,43" />
    <polygon points="46,98 64,96 60,86" />
    <polygon points="154,98 140,86 136,96" />
  </g>

  <!-- Sun Center Face Disc -->
  <circle cx="100" cy="80" r="38" fill="url(#sunGold)" stroke="#ca8a04" stroke-width="3" />
  
  <!-- Sun Eyes (PvZ Cute Cartoon Style) -->
  <ellipse cx="88" cy="74" rx="4.5" ry="7" fill="#1c1917" />
  <ellipse cx="112" cy="74" rx="4.5" ry="7" fill="#1c1917" />
  <!-- Eye Sparkles -->
  <circle cx="89.5" cy="71" r="2" fill="#ffffff" />
  <circle cx="113.5" cy="71" r="2" fill="#ffffff" />

  <!-- Cute Smile -->
  <path d="M 88 86 Q 100 96 112 86" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cheeks Blush -->
  <ellipse cx="80" cy="84" rx="5" ry="3" fill="#f87171" opacity="0.6" />
  <ellipse cx="120" cy="84" rx="5" ry="3" fill="#f87171" opacity="0.6" />

  <!-- Leaf Pedestal & Trophy Stem -->
  <!-- Left Leaf -->
  <path d="M 100 145 Q 60 145 65 130 Q 75 155 100 152 Z" fill="url(#pvzStem)" stroke="#15803d" stroke-width="2" />
  <!-- Right Leaf -->
  <path d="M 100 145 Q 140 145 135 130 Q 125 155 100 152 Z" fill="url(#pvzStem)" stroke="#15803d" stroke-width="2" />
  
  <!-- Green Stem -->
  <path d="M 94 116 L 106 116 L 108 162 L 92 162 Z" fill="url(#pvzStem)" stroke="#15803d" stroke-width="2" />

  <!-- Golden Plant Pot Base -->
  <polygon points="70,162 130,162 122,182 78,182" fill="url(#sunGold)" stroke="#ca8a04" stroke-width="2.5" />
  <rect x="66" y="159" width="68" height="6" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
</svg>
