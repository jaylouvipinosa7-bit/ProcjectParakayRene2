<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvZ Fusion - Spinner History Overlay</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* OBS TRANSPARENT BACKGROUND */
        html, body {
            background: transparent !important;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 20px;
        }

        .spinner-history-widget {
            width: 320px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .spinner-history-widget.is-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
        }

        /* HEADER: MATCHES USER'S SCREENSHOT */
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-wheel-icon {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
            animation: slowRotate 20s linear infinite;
        }

        @keyframes slowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header-title-text {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 14px rgba(56, 189, 248, 0.4);
        }

        .header-checkbox {
            width: 20px;
            height: 20px;
            background: #2563eb;
            border: 2px solid #3b82f6;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
            cursor: pointer;
        }

        /* HISTORY CARDS LIST */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* SINGLE HISTORY CARD: LUXURY GLOWING TIER CARD */
        @keyframes steadyTierGlowOverlay {
            0%, 100% {
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7), 0 0 12px var(--card-glow, rgba(56, 189, 248, 0.3));
            }
            50% {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.75), 0 0 18px var(--card-glow, rgba(56, 189, 248, 0.5));
            }
        }

        .history-card {
            background: linear-gradient(135deg, rgba(18, 24, 38, 0.95) 0%, rgba(11, 15, 25, 0.98) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7), 0 0 12px var(--card-glow, rgba(56, 189, 248, 0.3));
            animation: steadyTierGlowOverlay 4s ease-in-out infinite;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            opacity: 1 !important;
        }

        /* TIER THEMES FOR OVERLAY CARDS */
        .history-card.tier-mythic {
            --card-glow: rgba(255, 45, 85, 0.65);
            border-color: #ff2d55;
        }
        .history-card.tier-legendary {
            --card-glow: rgba(245, 158, 11, 0.65);
            border-color: #f59e0b;
        }
        .history-card.tier-epic {
            --card-glow: rgba(168, 85, 247, 0.6);
            border-color: #a855f7;
        }
        .history-card.tier-rare {
            --card-glow: rgba(56, 189, 248, 0.55);
            border-color: #38bdf8;
        }
        .history-card.tier-uncommon {
            --card-glow: rgba(16, 185, 129, 0.5);
            border-color: #10b981;
        }
        .history-card.tier-normal {
            --card-glow: rgba(148, 163, 184, 0.3);
            border-color: #64748b;
        }
        .history-card.tier-penalty {
            --card-glow: rgba(239, 68, 68, 0.65);
            border-color: #ef4444;
        }
        .history-card.tier-score {
            --card-glow: rgba(52, 211, 153, 0.55);
            border-color: #10b981;
        }

        /* CURVED LEFT ACCENT BAR */
        .card-left-accent {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(180deg, #f59e0b 0%, #eab308 100%);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
        }

        .history-card.tier-mythic .card-left-accent {
            background: linear-gradient(180deg, #ff2d55 0%, #be123c 100%);
            box-shadow: 0 0 14px rgba(255, 45, 85, 0.7);
        }
        .history-card.tier-legendary .card-left-accent {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.7);
        }
        .history-card.tier-epic .card-left-accent {
            background: linear-gradient(180deg, #c084fc 0%, #7e22ce 100%);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
        }
        .history-card.tier-rare .card-left-accent {
            background: linear-gradient(180deg, #38bdf8 0%, #2563eb 100%);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }
        .history-card.tier-uncommon .card-left-accent {
            background: linear-gradient(180deg, #34d399 0%, #059669 100%);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }
        .history-card.tier-penalty .card-left-accent {
            background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.7);
        }
        .history-card.tier-score .card-left-accent {
            background: linear-gradient(180deg, #34d399 0%, #047857 100%);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.6);
        }

        /* RARITY BADGE IN OVERLAY */
        .card-rarity-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 8.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 1px 5px;
            border-radius: 4px;
            line-height: 1.2;
            border: 1px solid;
            white-space: nowrap;
        }

        .badge-mythic { background: rgba(255, 45, 85, 0.25); color: #fecdd3; border-color: #ff2d55; }
        .badge-legendary { background: rgba(245, 158, 11, 0.25); color: #fef08a; border-color: #f59e0b; }
        .badge-epic { background: rgba(168, 85, 247, 0.25); color: #f3e8ff; border-color: #a855f7; }
        .badge-rare { background: rgba(56, 189, 248, 0.22); color: #e0f2fe; border-color: #38bdf8; }
        .badge-uncommon { background: rgba(16, 185, 129, 0.22); color: #d1fae5; border-color: #10b981; }
        .badge-normal { background: rgba(148, 163, 184, 0.16); color: #e2e8f0; border-color: #64748b; }
        .badge-penalty { background: rgba(239, 68, 68, 0.25); color: #fee2e2; border-color: #ef4444; }
        .badge-score { background: rgba(16, 185, 129, 0.25); color: #ecfdf5; border-color: #34d399; }

        .card-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            padding-left: 4px;
        }

        .card-avatar-wrap {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            background: #0d1117;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .card-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-username {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* RIGHT SIDE WON PRIZE BADGE */
        .card-prize-badge {
            width: 44px;
            height: 44px;
            border-radius: 9px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            padding: 2px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
        }

        .prize-text-num {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .prize-unit-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .empty-history-notice {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            padding: 14px 10px;
            text-align: center;
            background: rgba(18, 22, 34, 0.6);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="spinner-history-widget" id="spinnerHistoryWidget">
        <!-- HEADER (MATCHES USER PHOTO) -->
        <div class="history-header" id="historyHeader">
            <div class="header-title-wrap">
                <img src="images/spinner_wheel_icon.svg" class="header-wheel-icon" alt="Wheel" onerror="this.src='favicon.ico'">
                <span class="header-title-text">Spinner History</span>
            </div>
            <div class="header-checkbox" id="headerCheckbox" onclick="toggleVisibility()" title="Toggle Spinner History Overlay">✓</div>
        </div>

        <!-- CARDS CONTAINER -->
        <div class="history-list" id="historyList">
            <div class="empty-history-notice">Waiting for spins...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const maxLimit = parseInt(urlParams.get('limit')) || 6;
        if (urlParams.get('header') === 'false') {
            const h = document.getElementById('historyHeader');
            if (h) h.style.display = 'none';
        }

        let isWidgetEnabled = true;
        let lastServerTime = 0;
        let currentHistory = [];

        function toggleVisibility() {
            isWidgetEnabled = !isWidgetEnabled;
            updateVisibilityUI();
            fetch('/api/spinner-history/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: isWidgetEnabled })
            }).catch(() => {});
        }

        function updateVisibilityUI() {
            const widget = document.getElementById('spinnerHistoryWidget');
            const chk = document.getElementById('headerCheckbox');
            if (widget) {
                if (isWidgetEnabled) widget.classList.remove('is-hidden');
                else widget.classList.add('is-hidden');
            }
            if (chk) {
                chk.innerText = isWidgetEnabled ? '✓' : '';
                chk.style.background = isWidgetEnabled ? '#2563eb' : '#1e293b';
            }
        }

        function resolveSpinnerItemTier(item) {
            let rawRarity = (item && item.rarity ? String(item.rarity).trim() : '');
            const isNumber = (item.isNumber === true || item.actionType === 'score' || item.delta !== null || /^[+-]?\s*\d+$/.test(item.label || ''));
            let delta = (item.delta !== undefined && item.delta !== null) ? Number(item.delta) : null;
            if (delta === null && isNumber) {
                const m = (item.label || '').match(/^([+-]?)\s*(\d+)$/);
                if (m) delta = (m[1] === '-' ? -1 : 1) * parseInt(m[2], 10);
            }

            if (isNumber) {
                if (delta !== null && delta < 0) {
                    const isMega = delta <= -100;
                    return {
                        key: 'penalty',
                        badgeText: isMega ? 'MEGA PENALTY' : 'PENALTY',
                        badgeIcon: '💀',
                        color: '#ef4444'
                    };
                } else {
                    if (delta !== null && delta >= 500) return { key: 'mythic', badgeText: 'MYTHIC', badgeIcon: '🔥', color: '#ff2d55' };
                    if (delta !== null && delta >= 50) return { key: 'legendary', badgeText: 'LEGENDARY', badgeIcon: '👑', color: '#f59e0b' };
                    if (delta !== null && delta >= 20) return { key: 'epic', badgeText: 'EPIC', badgeIcon: '⚡', color: '#a855f7' };
                    if (delta !== null && delta >= 10) return { key: 'rare', badgeText: 'RARE', badgeIcon: '💎', color: '#38bdf8' };
                    return { key: 'score', badgeText: '+POINTS', badgeIcon: '⭐', color: '#10b981' };
                }
            }

            const norm = (rawRarity || 'Normal').toLowerCase();
            switch (norm) {
                case 'mythic': return { key: 'mythic', badgeText: 'MYTHIC', badgeIcon: '🔥', color: '#ff2d55' };
                case 'legendary': return { key: 'legendary', badgeText: 'LEGENDARY', badgeIcon: '👑', color: '#f59e0b' };
                case 'epic': return { key: 'epic', badgeText: 'EPIC', badgeIcon: '⚡', color: '#a855f7' };
                case 'rare': return { key: 'rare', badgeText: 'RARE', badgeIcon: '💎', color: '#38bdf8' };
                case 'uncommon': return { key: 'uncommon', badgeText: 'UNCOMMON', badgeIcon: '☘️', color: '#10b981' };
                default: return { key: 'normal', badgeText: 'NORMAL', badgeIcon: '✨', color: '#94a3b8' };
            }
        }

        function renderHistory(list) {
            const container = document.getElementById('historyList');
            if (!container) return;

            if (!Array.isArray(list) || list.length === 0) {
                container.innerHTML = '<div class="empty-history-notice">Waiting for spins...</div>';
                return;
            }

            const visibleItems = list.slice(0, maxLimit);
            const renderSig = visibleItems.map(it => `${it.id || ''}:${it.username || ''}:${it.label || ''}:${it.timeStr || ''}:${it.delta || ''}`).join(';;');
            if (container._lastRenderSig === renderSig) return;
            container._lastRenderSig = renderSig;

            let html = '';

            visibleItems.forEach((item) => {
                const username = escapeHtml(item.username || 'User');
                const avatar = item.avatar || 'images/default_avatar.svg';
                const isNumber = (item.isNumber === true || item.actionType === 'score' || item.delta !== null || /^[+-]?\s*\d+$/.test(item.label || ''));
                const tier = resolveSpinnerItemTier(item);
                
                let prizeHtml = '';
                if (isNumber) {
                    const rawLabel = (item.label || '10').trim();
                    const color = item.color || tier.color;
                    prizeHtml = `<div class="prize-text-num" style="color: ${color}; text-shadow: 0 0 12px ${color};">${rawLabel}</div>`;
                } else {
                    const icon = item.icon || 'images/func_2.png';
                    prizeHtml = `<img src="${icon}" class="prize-unit-img" alt="${escapeHtml(item.label)}" onerror="this.src='images/func_2.png'">`;
                }

                html += `
                    <div class="history-card tier-${tier.key}">
                        <div class="card-left-accent"></div>
                        <div class="card-user-info">
                            <div class="card-avatar-wrap">
                                <img src="${avatar}" class="card-avatar-img" alt="${username}" onerror="this.src='images/default_avatar.svg'">
                            </div>
                            <div style="min-width: 0;">
                                <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 2px;">
                                    <span class="card-rarity-badge badge-${tier.key}">${tier.badgeIcon} ${tier.badgeText}</span>
                                </div>
                                <div class="card-username" title="${username}">${username}</div>
                            </div>
                        </div>
                        <div class="card-prize-badge">
                            ${prizeHtml}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        async function fetchInitialHistory() {
            try {
                const res = await fetch('/api/spinner-history?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.enabled !== undefined) {
                        isWidgetEnabled = (data.enabled !== false);
                        updateVisibilityUI();
                    }
                    if (Array.isArray(data.history)) {
                        currentHistory = data.history;
                        renderHistory(currentHistory);
                    }
                }
            } catch (err) {}
        }

        // Live Event polling for real-time spin history entries
        function startEventStream() {
            setInterval(async () => {
                try {
                    const res = await fetch(`/api/events?since=${lastServerTime}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.serverTime) lastServerTime = data.serverTime;

                    if (Array.isArray(data.events)) {
                        for (const ev of data.events) {
                            if (ev.type === 'spinner_history_update') {
                                if (ev.enabled !== undefined) {
                                    isWidgetEnabled = (ev.enabled !== false);
                                    updateVisibilityUI();
                                }
                                if (Array.isArray(ev.history)) {
                                    currentHistory = ev.history;
                                    renderHistory(currentHistory);
                                } else if (ev.item) {
                                    currentHistory = [ev.item, ...currentHistory].slice(0, 40);
                                    renderHistory(currentHistory);
                                }
                            } else if (ev.type === 'spin_result') {
                                // Refresh history on spin completion
                                fetchInitialHistory();
                            }
                        }
                    }
                } catch (err) {}
            }, 300);
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchInitialHistory();
            startEventStream();
        });
    </script>
</body>
</html>
