<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvZ Fusion 4.0 - Live Stream Grid Overlay</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/app_icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <script src="cards-data.js"></script>
    <script src="stream-keepalive.js"></script>
    <style>
        :root {
            --cell-width: 90px;
            --cell-height: 58px;
            --grid-cols: 10;
            --scale-factor: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px;
        }

        /* Top control bar (Hideable in OBS via ?standalone=true or toggle button) */
        .overlay-control-bar {
            width: 100%;
            max-width: 1200px;
            background: #11141a;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .overlay-control-bar.hidden {
            display: none !important;
        }

        .dropdown-badge {
            background: #1a1e26;
            border: 1px solid #30363d;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .url-display-box {
            flex: 1;
            background: #090c10;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            color: #8b949e;
            font-size: 12px;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-obs {
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            transition: all 0.15s ease;
        }

        .btn-copy-url {
            background: #0969da;
        }

        .btn-copy-url:hover {
            background: #218bff;
        }

        .btn-split {
            background: #238636;
        }

        .btn-split:hover {
            background: #2ea043;
        }

        .btn-settings {
            background: #30363d;
        }

        .btn-settings:hover {
            background: #484f58;
        }

        .btn-toggle-bar {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 14px;
            cursor: pointer;
            padding: 4px;
        }

        /* The Authentic StreamToEarn Grid Strip */
        .s2e-panoramic-container {
            width: fit-content;
            background: #000000;
            border: 2px solid #2d333b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.85);
            position: relative;
            transform-origin: top center;
        }

        /* Continuous Color Bands Background matching Photo 2 */
        .color-zones-layer {
            position: absolute;
            inset: 0;
            display: flex;
            pointer-events: none;
            z-index: 1;
        }

        .zone-pink {
            width: 30%;
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.6) 0%, rgba(236, 72, 153, 0.4) 100%);
        }

        .zone-purple {
            width: 10%;
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.6) 0%, rgba(168, 85, 247, 0.4) 100%);
        }

        .zone-yellow {
            width: 40%;
            background: linear-gradient(135deg, rgba(250, 204, 21, 0.6) 0%, rgba(234, 179, 8, 0.4) 100%);
        }

        .zone-blue {
            width: 20%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.6) 0%, rgba(14, 165, 233, 0.4) 100%);
        }

        /* ==================== PHOTO 2 THEMES SUPPORT ==================== */
        /* 1. Black Hole Monochrome */
        .s2e-panoramic-container.theme-blackhole {
            background: #000 url('images/backgrounds/wide_monochrome_blackhole.jpg') center/cover no-repeat !important;
            border: 2px solid rgba(255, 255, 255, 0.45) !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.25), 0 10px 40px rgba(0, 0, 0, 0.95) !important;
        }

        /* 2. Blue Starry Galaxy / Nebula */
        .s2e-panoramic-container.theme-bluegalaxy {
            background: #020617 url('images/backgrounds/wide_blue_nebula_galaxy.jpg') center/cover no-repeat !important;
            border: 2px solid rgba(56, 189, 248, 0.55) !important;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.45), 0 10px 40px rgba(2, 6, 23, 0.95) !important;
        }

        /* 3. Golden Gargantua Black Hole (Photo 2 Highlighted) */
        .s2e-panoramic-container.theme-gargantua {
            background: #000 url('images/backgrounds/wide_gargantua_blackhole.jpg') center/cover no-repeat !important;
            border: 2px solid rgba(245, 158, 11, 0.55) !important;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.45), 0 10px 40px rgba(0, 0, 0, 0.95) !important;
        }

        /* 4. Purple Supernova Galaxy */
        .s2e-panoramic-container.theme-purplesupernova {
            background: #0b0217 url('images/backgrounds/purple_supernova_galaxy.jpg') center/cover no-repeat !important;
            border: 2px solid rgba(168, 85, 247, 0.55) !important;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.45), 0 10px 40px rgba(11, 2, 23, 0.95) !important;
        }

        /* 5. Cyber Neon Cosmos */
        .s2e-panoramic-container.theme-cybercosmos {
            background: #040814 url('images/backgrounds/cyber_neon_cosmos.jpg') center/cover no-repeat !important;
            border: 2px solid rgba(6, 182, 212, 0.55) !important;
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.4), 0 10px 40px rgba(6, 182, 212, 0.4) !important;
        }

        /* 6. Golden Solar Nebula */
        .s2e-panoramic-container.theme-goldennebula {
            background: #080501 url('images/backgrounds/golden_solar_nebula.jpg') center/cover no-repeat !important;
            border: 2px solid rgba(234, 179, 8, 0.55) !important;
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.45), 0 10px 40px rgba(0, 0, 0, 0.95) !important;
        }

        /* 7. Dark Glass (Sleek) */
        .s2e-panoramic-container.theme-glass-dark {
            background: rgba(13, 17, 23, 0.92) !important;
            backdrop-filter: blur(16px);
            border: 1.5px solid #30363d !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9) !important;
        }

        /* 8. Cyber Neon */
        .s2e-panoramic-container.theme-cyber-neon {
            background: rgba(10, 10, 18, 0.95) !important;
            border: 2px solid #00f0ff !important;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.2) !important;
        }

        /* 9. Transparent OBS Clean */
        .s2e-panoramic-container.theme-transparent {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Translucent glass cards for cosmic themes */
        .theme-blackhole .grid-cell,
        .theme-bluegalaxy .grid-cell,
        .theme-gargantua .grid-cell,
        .theme-purplesupernova .grid-cell,
        .theme-cybercosmos .grid-cell,
        .theme-goldennebula .grid-cell,
        .theme-glass-dark .grid-cell,
        .theme-cyber-neon .grid-cell {
            background: rgba(12, 16, 26, 0.72) !important;
            backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
        }

        .theme-blackhole .grid-cell:hover,
        .theme-bluegalaxy .grid-cell:hover,
        .theme-gargantua .grid-cell:hover,
        .theme-purplesupernova .grid-cell:hover,
        .theme-cybercosmos .grid-cell:hover,
        .theme-goldennebula .grid-cell:hover,
        .theme-glass-dark .grid-cell:hover,
        .theme-cyber-neon .grid-cell:hover {
            background: rgba(22, 28, 44, 0.88) !important;
            border-color: rgba(255, 255, 255, 0.45) !important;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25) !important;
        }

        /* Hide static color bands when a custom theme is active */
        .theme-blackhole .color-zones-layer,
        .theme-bluegalaxy .color-zones-layer,
        .theme-gargantua .color-zones-layer,
        .theme-purplesupernova .color-zones-layer,
        .theme-cybercosmos .color-zones-layer,
        .theme-goldennebula .color-zones-layer,
        .theme-glass-dark .color-zones-layer,
        .theme-cyber-neon .color-zones-layer,
        .theme-transparent .color-zones-layer {
            display: none !important;
        }

        /* Grid of cells */
        .grid-cells-table {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(var(--grid-cols, 10), var(--cell-width, 90px));
            gap: 1px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .grid-cell {
            height: var(--cell-height, 58px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 3px 4px 2px 4px;
            background: rgba(18, 22, 28, 0.52);
            backdrop-filter: blur(4px);
            position: relative;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            border-radius: 3px;
        }

        .grid-cell.active-trigger {
            animation: cellGlowPulse 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.45) 0%, rgba(168, 85, 247, 0.45) 100%) !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 35px #38bdf8, 0 0 65px rgba(168, 85, 247, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.8) !important;
            z-index: 100 !important;
            outline: 2px solid rgba(56, 189, 248, 0.95);
            outline-offset: 1px;
        }

        .grid-cell.active-trigger .cell-unit-img {
            animation: unitBounceGlow 2.6s ease;
            filter: drop-shadow(0 0 12px #38bdf8) brightness(1.35) !important;
        }

        .grid-cell.active-trigger .cell-trig-wrap {
            animation: triggerIconPop 2.6s ease;
            filter: drop-shadow(0 0 14px #fde047) brightness(1.35) !important;
        }

        .grid-cell.active-trigger .cell-label {
            color: #ffffff !important;
            text-shadow: 0 0 10px #38bdf8, 0 0 16px #a855f7, 0 1px 3px rgba(0, 0, 0, 1) !important;
            font-weight: 900 !important;
            letter-spacing: 0.2px;
        }

        @keyframes cellGlowPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(56, 189, 248, 0);
                filter: brightness(1);
            }

            15% {
                transform: scale(1.22);
                box-shadow: 0 0 45px #38bdf8, 0 0 80px rgba(168, 85, 247, 0.9), inset 0 0 25px rgba(255, 255, 255, 0.9);
                filter: brightness(1.6);
            }

            35% {
                transform: scale(1.10);
                box-shadow: 0 0 30px #38bdf8, 0 0 55px rgba(56, 189, 248, 0.75), inset 0 0 18px rgba(56, 189, 248, 0.6);
                filter: brightness(1.35);
            }

            55% {
                transform: scale(1.15);
                box-shadow: 0 0 38px #a855f7, 0 0 70px rgba(56, 189, 248, 0.85), inset 0 0 22px rgba(255, 255, 255, 0.85);
                filter: brightness(1.45);
            }

            75% {
                transform: scale(1.05);
                box-shadow: 0 0 22px rgba(56, 189, 248, 0.7), 0 0 40px rgba(168, 85, 247, 0.55), inset 0 0 14px rgba(56, 189, 248, 0.4);
                filter: brightness(1.2);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
                filter: brightness(1);
            }
        }

        @keyframes unitBounceGlow {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.28) rotate(-6deg);
            }

            35% {
                transform: scale(1.12) rotate(4deg);
            }

            55% {
                transform: scale(1.20) rotate(-3deg);
            }

            75% {
                transform: scale(1.06);
            }
        }

        @keyframes triggerIconPop {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.38) rotate(12deg);
            }

            35% {
                transform: scale(1.15) rotate(-6deg);
            }

            55% {
                transform: scale(1.24) rotate(6deg);
            }

            75% {
                transform: scale(1.08);
            }
        }

        .cell-top-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .cell-label {
            font-size: 9.5px;
            font-weight: 800;
            color: #ef4444;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            line-height: 1.1;
            margin-top: 1px;
            letter-spacing: -0.2px;
        }

        /* Left: In-game Unit Icon */
        .cell-unit-img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .grid-cell:hover .cell-unit-img {
            transform: scale(1.1);
        }

        /* Right: Trigger Badge */
        .cell-trig-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            min-width: 28px;
        }

        .cell-trig-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        /* Numeric Like Pill */
        .pill-badge {
            font-size: 11px;
            font-weight: 900;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 12px;
            border: 1.5px solid #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        .pill-likes-100 {
            background: #ef4444;
            border-color: #fecaca;
        }

        .pill-likes-50k {
            background: #0284c7;
            border-color: #bae6fd;
        }

        .pill-follow {
            background: #10b981;
            border-color: #a7f3d0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        /* Split Mode Layout */
        .s2e-panoramic-container.split-mode .grid-cells-table {
            grid-template-columns: repeat(7, calc(var(--cell-width) * 2));
        }

        /* Modal for settings */
        .settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            width: 360px;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- TOP OBS CONTROLS BAR (Exact match to Photo 2) -->
    <div class="overlay-control-bar" id="controlBar">
        <div class="dropdown-badge" onclick="toggleSettingsModal()">
            <span>Overlay</span>
            <span style="font-size: 9px;">▼</span>
        </div>
        <div class="url-display-box" id="urlDisplay">http://localhost:8080/overlay-grid.html</div>
        <button type="button" class="btn-obs btn-copy-url" onclick="copyOverlayUrl()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy URL
        </button>
        <button type="button" class="btn-obs btn-split" onclick="toggleSplitMode()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            Split
        </button>
        <button type="button" class="btn-obs btn-settings" onclick="toggleSettingsModal()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
            Overlay Settings
        </button>
        <button type="button" class="btn-toggle-bar" onclick="hideControlBar()"
            title="Hide toolbar (for OBS)">▲</button>
    </div>

    <!-- THE AUTHENTIC STREAMTOEARN PANORAMIC GRID OVERLAY -->
    <div class="s2e-panoramic-container" id="gridContainer">
        <!-- 4 Continuous Color Zones -->
        <div class="color-zones-layer">
            <div class="zone-pink"></div>
            <div class="zone-purple"></div>
            <div class="zone-yellow"></div>
            <div class="zone-blue"></div>
        </div>

        <!-- Multi-Column Grid Cells -->
        <div class="grid-cells-table" id="cellsGrid">
            <!-- Dynamically populated from cards.json -->
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="font-size:15px; font-weight:800;">Overlay Settings</h3>
                <button type="button" onclick="toggleSettingsModal()"
                    style="background:none; border:none; color:#fff; cursor:pointer;">✕</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <div>
                    <label style="font-size:12px; color:#8b949e; display:block; margin-bottom:4px;">Scale Size</label>
                    <input type="range" min="0.5" max="1.5" step="0.05" value="1" oninput="setScale(this.value)"
                        style="width:100%;">
                </div>
                <div>
                    <label style="font-size:12px; color:#8b949e; display:block; margin-bottom:4px;">Grid Columns
                        (Default: 14)</label>
                    <input type="number" id="colsInput" min="6" max="20" value="14" onchange="setCols(this.value)"
                        style="width:100%; background:#0d1117; border:1px solid #30363d; border-radius:4px; padding:6px; color:#fff;">
                </div>
                <button type="button" class="btn-obs btn-copy-url" onclick="toggleSettingsModal()"
                    style="margin-top:8px; justify-content:center;">Done</button>
            </div>
        </div>
    </div>

    <script>
        let cards = [];
        let lastEventTime = 0;
        let isSplit = false;

        // Initialize URL display
        document.getElementById('urlDisplay').innerText = window.location.href;

        // Check standalone / OBS query parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('standalone') === 'true' || urlParams.get('obs') === 'true' || urlParams.get('inapp') === 'true') {
            document.getElementById('controlBar').classList.add('hidden');
        }
        if (urlParams.get('cols')) {
            setCols(parseInt(urlParams.get('cols')));
        }

        async function loadCards(force = false) {
            try {
                const res = await fetch(`/cards.json?t=${Date.now()}`);
                if (res.ok) {
                    const text = await res.text();
                    const clean = text.replace(/^\uFEFF/, '').trim();
                    const data = JSON.parse(clean);
                    if (Array.isArray(data) && data.length > 0) {
                        cards = data;
                        renderGrid();
                        return;
                    }
                }
            } catch (err) { }

            try {
                const res2 = await fetch(`/api/config?t=${Date.now()}`);
                if (res2.ok) {
                    const conf = await res2.json();
                    if (conf && conf.gifts && Array.isArray(conf.gifts)) {
                        cards = conf.gifts.map(g => ({
                            id: String(g.id),
                            action: g.action || (g.triggerType === 'likes_all' ? 'LikeAmount' : (g.triggerType === 'likes_person' ? 'LikeForEach' : (g.triggerType === 'follow' ? 'Follow' : (g.triggerType === 'share' ? 'Share' : 'SelectedGift')))),
                            giftId: g.giftId || '',
                            giftName: g.giftName || 'Gift',
                            funcName: (g.label && g.label !== 'Custom') ? g.label : ((g.functionName && g.functionName !== 'Custom') ? g.functionName : (g.command || 'Action')),
                            funcImg: (g.unitIcon && !g.unitIcon.includes('func_2')) ? g.unitIcon : (g.command ? `images/game-icons/pvz/${g.command}.webp` : 'images/func_2.png'),
                            trigImg: g.icon || 'images/tiktok-gifts/5655_rose.webp',
                            triggerValue: g.triggerValue || (g.likeThreshold ? String(g.likeThreshold) : ''),
                            commands: g.command || '',
                            hideInOverlay: (g.hideInOverlay === true || g.triggerType === 'custom' || g.actionType === 'custom'),
                            triggerType: g.triggerType || 'gift',
                            actionType: g.actionType || 'zombie'
                        }));
                        renderGrid();
                        return;
                    }
                }
            } catch (e2) { }

            // Final fallback to static cardsData only if network fails
            if (typeof cardsData !== 'undefined' && Array.isArray(cardsData) && cardsData.length > 0) {
                cards = cardsData;
                renderGrid();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('cellsGrid');
            if (!grid || !cards) return;
            grid.innerHTML = '';

            const validCards = (cards || []).filter(c => {
                if (!c) return false;
                // Exclude any card explicitly hidden in overlay
                if (c.hideInOverlay === true || c.hideInOverlay === 'true') return false;
                // Exclude all custom commands, custom triggers, and internal game triggers
                if (c.triggerType === 'custom' || c.actionType === 'custom' || c.action === 'Custom' || c.action === 'custom' || String(c.id) === '59') {
                    return false;
                }
                return true;
            });

            validCards.forEach(card => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.id = `cell_${card.id}`;
                cell.title = `${card.giftName || ''} -> ${card.funcName || ''}`;

                const topRow = document.createElement('div');
                topRow.className = 'cell-top-row';

                // Left: Unit Image
                const unitImg = document.createElement('img');
                unitImg.className = 'cell-unit-img';
                unitImg.src = card.funcImg || card.unitIcon || 'images/func_2.png';
                unitImg.onerror = () => { unitImg.src = 'images/func_2.png'; };

                // Right: Trigger Image or Pill Badge
                const trigWrap = document.createElement('div');
                trigWrap.className = 'cell-trig-wrap';

                const trigVal = String(card.triggerValue || '').toLowerCase();
                const cardAct = String(card.action || '');

                if (card.id === '1' || trigVal === '50' || trigVal === '100') {
                    // Likes pill
                    const pill = document.createElement('span');
                    pill.className = 'pill-badge pill-likes-100';
                    pill.innerText = card.triggerValue || '100';
                    trigWrap.appendChild(pill);
                } else if (card.id === '3' || trigVal === '50000' || trigVal === '50k') {
                    // Stream goal pill
                    const pill = document.createElement('span');
                    pill.className = 'pill-badge pill-likes-50k';
                    pill.innerText = '50k';
                    trigWrap.appendChild(pill);
                } else if (card.id === '4' || cardAct === 'Follow') {
                    // Follower green icon
                    const pill = document.createElement('div');
                    pill.className = 'pill-follow';
                    pill.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>`;
                    trigWrap.appendChild(pill);
                } else if (cardAct === 'Custom' || cardAct === 'Share' || card.triggerType === 'custom' || trigVal === 'event' || trigVal === 'custom') {
                    // Custom Event
                    const trigImg = document.createElement('img');
                    trigImg.className = 'cell-trig-img';
                    trigImg.src = card.trigImg || card.icon || 'images/game-icons/stream/custom_action.webp';
                    trigImg.onerror = () => { trigImg.src = 'images/game-icons/stream/custom_action.webp'; };
                    trigWrap.appendChild(trigImg);
                } else {
                    // TikTok Gift Icon
                    const trigImg = document.createElement('img');
                    trigImg.className = 'cell-trig-img';
                    trigImg.src = card.trigImg || card.icon || 'images/tiktok-gifts/5655_rose.webp';
                    trigImg.onerror = () => { trigImg.src = 'images/tiktok-gifts/5655_rose.webp'; };
                    trigWrap.appendChild(trigImg);
                }

                topRow.appendChild(unitImg);
                topRow.appendChild(trigWrap);
                cell.appendChild(topRow);

                // Bottom label (matching Photo 3)
                const labelEl = document.createElement('div');
                labelEl.className = 'cell-label';
                const displayName = card.label || card.subLabel || card.nickname || card.customName || card.giftName || card.funcName || 'Custom';
                labelEl.innerText = displayName;
                cell.appendChild(labelEl);

                grid.appendChild(cell);
            });
        }

        // Live Event Polling for pulse/glow animation (Unthrottled WorkerTicker)
        function startEventPolling() {
            let isPolling = false;
            async function poll() {
                if (isPolling) return;
                isPolling = true;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                try {
                    const res = await fetch(`/api/events?since=${lastEventTime}`, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.serverTime) lastEventTime = data.serverTime;

                    if (data.events && data.events.length > 0) {
                        data.events.forEach(ev => {
                            if (ev.type === 'config_updated' || ev.type === 'cards_updated' || ev.type === 'cards_refresh') {
                                loadCards(true);
                            }
                            if (ev.hideInOverlay) return;
                            highlightTrigger(ev);
                        });
                    }
                } catch (e) {
                } finally {
                    clearTimeout(timeoutId);
                    isPolling = false;
                }
            }

            if (typeof window.createWorkerTicker === 'function') {
                window.createWorkerTicker(poll, 150);
            } else {
                setInterval(poll, 200);
            }

            // Realtime BroadcastChannel for instantaneous cross-tab updates
            try {
                const bc = new BroadcastChannel('renearn_overlay_events');
                bc.onmessage = (e) => {
                    if (!e || !e.data) return;
                    if (e.data.type === 'cards_updated' || e.data.type === 'config_updated' || e.data.type === 'counts_reset') {
                        loadCards(true);
                    }
                };
            } catch (e) { }

            // Realtime Storage listener
            window.addEventListener('storage', (e) => {
                if (e.key === 'renearn_cards_updated' || e.key === 'renearn_cached_config') {
                    loadCards(true);
                }
            });

            // Periodic auto-sync fallback (ensures OBS is 100% synchronized)
            setInterval(() => {
                loadCards(true);
            }, 3000);
        }

        function highlightTrigger(ev) {
            let targetCardId = ev.cardId;
            if (!targetCardId && cards) {
                const match = cards.find(c => (c.giftName && ev.label && ev.label.toLowerCase().includes(c.giftName.toLowerCase())) || (c.commands && ev.command && ev.command.includes(c.commands)));
                if (match) targetCardId = match.id;
            }

            if (targetCardId) {
                const cell = document.getElementById(`cell_${targetCardId}`);
                if (cell) {
                    if (cell.__activeTimeout) clearTimeout(cell.__activeTimeout);
                    cell.classList.remove('active-trigger');
                    void cell.offsetWidth;
                    cell.classList.add('active-trigger');
                    cell.__activeTimeout = setTimeout(() => {
                        cell.classList.remove('active-trigger');
                        cell.__activeTimeout = null;
                    }, 2650);
                }
            }
        }

        function copyOverlayUrl() {
            const standaloneUrl = window.location.origin + window.location.pathname + '?standalone=true';
            navigator.clipboard.writeText(standaloneUrl).then(() => {
                alert("Copied OBS Browser Source URL to clipboard!\n\n" + standaloneUrl);
            });
        }

        function toggleSplitMode() {
            isSplit = !isSplit;
            const container = document.getElementById('gridContainer');
            if (isSplit) {
                container.classList.add('split-mode');
            } else {
                container.classList.remove('split-mode');
            }
        }

        function toggleSettingsModal() {
            document.getElementById('settingsModal').classList.toggle('active');
        }

        function hideControlBar() {
            document.getElementById('controlBar').classList.add('hidden');
        }

        function setScale(val) {
            const container = document.getElementById('gridContainer');
            container.style.transform = `scale(${val})`;
        }

        function setCols(cols) {
            document.documentElement.style.setProperty('--grid-cols', cols);
        }

        let currentTheme = 's2e-gradient';

        function setTheme(theme) {
            currentTheme = (theme && theme.trim()) ? theme.trim() : 's2e-gradient';
            const container = document.getElementById('gridContainer');
            if (!container) return;
            container.className = container.className.replace(/\btheme-[^\s]+\b/g, '').trim();
            container.classList.add(`theme-${currentTheme}`);
            const colorZones = document.querySelector('.color-zones-layer');
            if (colorZones) {
                if (currentTheme === 's2e-gradient' || currentTheme === 'classic') {
                    colorZones.style.display = 'flex';
                } else {
                    colorZones.style.display = 'none';
                }
            }
        }

        // Initialize Theme from URL, LocalStorage or Backend
        if (urlParams.get('theme')) {
            setTheme(urlParams.get('theme'));
        } else {
            try {
                const saved = localStorage.getItem('renearn_side_overlay_settings');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.common && parsed.common.theme) {
                        setTheme(parsed.common.theme);
                    }
                }
            } catch (e) { }
            // Also check server settings if not yet set
            fetch('/api/overlay-side/settings').then(r => r.json()).then(st => {
                if (st && st.common && st.common.theme && !urlParams.get('theme')) {
                    setTheme(st.common.theme);
                }
            }).catch(() => { });
        }

        // Realtime Theme Listener: BroadcastChannel 'renearn_side_overlay'
        try {
            const bcSide = new BroadcastChannel('renearn_side_overlay');
            bcSide.onmessage = (e) => {
                if (!e || !e.data) return;
                if (e.data.type === 'overlay_side_settings_updated' && e.data.settings) {
                    const th = e.data.settings.common?.theme;
                    if (th) setTheme(th);
                }
            };
        } catch (e) { }

        // Realtime Theme Listener: BroadcastChannel 'renearn_overlay_events'
        try {
            const bcEvents = new BroadcastChannel('renearn_overlay_events');
            bcEvents.onmessage = (e) => {
                if (!e || !e.data) return;
                if (e.data.type === 'overlay_side_settings_updated' && e.data.settings) {
                    const th = e.data.settings.common?.theme;
                    if (th) setTheme(th);
                }
            };
        } catch (e) { }

        // Realtime PostMessage listener from in-app preview iframe
        window.addEventListener('message', (e) => {
            if (!e || !e.data) return;
            if (e.data.type === 'live_customizer_update' && e.data.theme) {
                setTheme(e.data.theme);
            }
            if (e.data.cols) {
                setCols(e.data.cols);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadCards();
            startEventPolling();
        });
    </script>
</body>
