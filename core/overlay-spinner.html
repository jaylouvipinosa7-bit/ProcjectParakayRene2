<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvZ Fusion - Stream Gift Spinner Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="wheel-engine.js"></script>
    <style>
        :root {
            --card-width: 114px;
            --card-height: 128px;
            --card-gap: 12px;
            --accent-yellow: #f59e0b;
            --accent-blue: #0969da;
            --accent-green: #238636;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* 
           OBS / STREAM OVERLAY:
           100% TRANSPARENT BY DEFAULT.
           Zero elements visible when idle.
        */
        html, body {
            background: transparent !important;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
        }

        /* ==================== OPTIONAL DEBUG / CONTROLS BAR ==================== */
        /* HIDDEN BY DEFAULT: only shows if ?controls=true or user presses 'C' */
        .debug-controls-bar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 17, 23, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid #30363d;
            border-radius: 9999px;
            padding: 6px 16px;
            display: none;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            z-index: 999;
            font-size: 12px;
            color: #8b949e;
        }

        body.show-controls .debug-controls-bar {
            display: flex;
        }

        .btn-debug {
            background: #21262d;
            border: 1px solid #363b42;
            color: #ffffff;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-debug:hover {
            background: #388bfd;
            border-color: #58a6ff;
        }

        /* ==================== DYNAMIC SPINNER STAGE ==================== */
        /* 
           CRITICAL REQUIREMENT:
           COMPLETELY HIDDEN / INVISIBLE BY DEFAULT!
           Slides & fades in smoothly ONLY when an assigned gift is received.
        */
        .spinner-stage-container {
            width: 95%;
            max-width: 980px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* Hidden idle state */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-40px) scale(0.95);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        visibility 0.35s;
            z-index: 100;
        }

        /* ACTIVE: Shows up dynamically when someone gifts! */
        .spinner-stage-container.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        /* FADING OUT: Smooth exit after win celebration */
        .spinner-stage-container.fading-out {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-30px) scale(0.96);
            transition: opacity 0.45s ease-out, transform 0.45s ease-out, visibility 0.45s;
        }

        /* ==================== GIFTER ANNOUNCEMENT BADGE ==================== */
        .gifter-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.96), rgba(30, 41, 59, 0.96));
            backdrop-filter: blur(14px);
            border: 1.5px solid #388bfd;
            border-radius: 9999px;
            padding: 8px 24px 8px 12px;
            margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 139, 253, 0.4);
            animation: bounceIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .gifter-icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .gifter-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gifter-text-col {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .gifter-headline {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.2px;
        }

        .gifter-subtext {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 700;
        }

        /* ==================== REEL VIEWPORT & STAGE ==================== */
        .reel-viewport-wrap {
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .reel-viewport {
            width: 100%;
            height: 160px;
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(10, 14, 20, 0.92);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.95), 0 0 35px rgba(56, 139, 253, 0.15);
        }

        /* VIGNETTE GRADIENT EDGES */
        .reel-viewport::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 120px;
            background: linear-gradient(90deg, rgba(10, 14, 20, 0.98) 0%, transparent 100%);
            z-index: 15;
            pointer-events: none;
        }

        .reel-viewport::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 120px;
            background: linear-gradient(270deg, rgba(10, 14, 20, 0.98) 0%, transparent 100%);
            z-index: 15;
            pointer-events: none;
        }

        /* ==================== REEL TOP BAR: QUEUE & STOP SPINNER (EXACT MATCH TO PHOTO 2) ==================== */
        .reel-top-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 8px 4px;
        }

        .queue-status-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-stop-spinner {
            background: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.45);
            transition: all 0.15s ease;
        }

        .btn-stop-spinner:hover {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.55);
        }

        .btn-stop-spinner:active {
            transform: translateY(0);
        }

        /* ==================== YELLOW DOWNWARD POINTER TRIANGLE WITH AVATAR (EXACT MATCH TO PHOTO 2) ==================== */
        .reel-center-pointer {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 35;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            filter: drop-shadow(0 4px 14px rgba(245, 158, 11, 0.95));
        }

        .pointer-user-tag {
            display: none;
            background: rgba(13, 17, 23, 0.94);
            color: #fbbf24;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 999px;
            margin-bottom: 2px;
            white-space: nowrap;
            border: 1px solid rgba(245, 158, 11, 0.5);
            box-shadow: 0 2px 8px rgba(0,0,0,0.85);
        }

        .pointer-triangle-wrapper {
            position: relative;
            width: 48px;
            height: 54px;
            animation: pointerBounce 1.4s ease-in-out infinite;
        }

        .pointer-avatar-circle {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointer-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pointerBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }

        /* REEL HORIZONTAL TRACK */
        .reel-track {
            position: absolute;
            top: 16px;
            left: 0;
            height: 128px;
            display: flex;
            gap: var(--card-gap);
            padding: 0;
            will-change: transform;
            align-items: center;
        }

        /* ITEM CARDS */
        .spinner-card {
            width: var(--card-width);
            height: var(--card-height);
            background: #161b22;
            border: 1.5px solid #30363d;
            border-radius: 10px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, box-shadow 0.25s;
            overflow: hidden;
        }

        .spinner-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #3b82f6;
            border-radius: 0 0 10px 10px;
        }

        /* RARITY ACCENTS */
        .spinner-card.rarity-mythic::after { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .spinner-card.rarity-legendary::after { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
        .spinner-card.rarity-epic::after { background: #a855f7; box-shadow: 0 0 8px #a855f7; }
        .spinner-card.rarity-rare::after { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        .spinner-card.rarity-normal::after { background: #10b981; box-shadow: 0 0 8px #10b981; }

        /* LUXURY HORIZONTAL REEL THEMES */
        .spinner-card.theme-casino_felt,
        .reel-track.theme-casino_felt .spinner-card {
            background: radial-gradient(circle at 50% 18%, #2d0c15 0%, #17050a 65%, #090204 100%) !important;
            border: 2px solid #b45309 !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(254, 240, 138, 0.35), 0 0 12px rgba(245, 158, 11, 0.25) !important;
        }
        .spinner-card.theme-casino_felt::before,
        .reel-track.theme-casino_felt .spinner-card::before {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-radius: 8px;
            pointer-events: none;
        }
        .spinner-card.theme-neon_cyber,
        .reel-track.theme-neon_cyber .spinner-card {
            background: linear-gradient(180deg, #090d16 0%, #03060a 100%) !important;
            border: 2px solid #00f0ff !important;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.45), inset 0 0 10px rgba(0, 240, 255, 0.2) !important;
        }
        .spinner-card.theme-obsidian_luxury,
        .reel-track.theme-obsidian_luxury .spinner-card {
            background: linear-gradient(180deg, #1c1917 0%, #0c0a09 100%) !important;
            border: 2px solid #eab308 !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.95), 0 0 14px rgba(234, 179, 8, 0.3) !important;
        }

        .spinner-card.winner {
            transform: scale(1.12);
            border-color: #f59e0b !important;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.95), 0 0 10px #ffffff !important;
            z-index: 20;
            animation: winnerPulse 1.2s infinite alternate;
        }

        @keyframes winnerPulse {
            0% { transform: scale(1.08); filter: brightness(1); }
            100% { transform: scale(1.14); filter: brightness(1.25); }
        }

        .spinner-card.winner::after {
            background: #f59e0b;
            height: 6px;
        }

        .card-img-wrap {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
        }

        .card-img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.7));
        }

        .card-label {
            font-size: 11px;
            font-weight: 800;
            color: #e6edf3;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            padding: 0 2px;
            margin-bottom: 4px;
        }

        /* ==================== WINNER CELEBRATION BANNER ==================== */
        .winner-banner {
            margin-top: 14px;
            padding: 10px 32px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.28), rgba(239, 68, 68, 0.28));
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(245, 158, 11, 0.7);
            border-radius: 9999px;
            font-size: 15px;
            font-weight: 800;
            color: #fbbf24;
            display: none;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.45);
            animation: winnerPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes winnerPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ==================== 3D REALISTIC ROULETTE WHEEL STYLES ==================== */
        .wheel-viewport-wrap {
            position: relative;
            width: 440px;
            height: 440px;
            margin: 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #wheelCanvas {
            width: 420px;
            height: 420px;
            border-radius: 50%;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.95), 0 0 45px rgba(245, 158, 11, 0.45);
            transition: transform 4.5s cubic-bezier(0.12, 0.95, 0.22, 1);
        }

        .wheel-pointer-container {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: none;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.95));
        }

        .spinner-card .rarity-tag {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 8.5px;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.65);
            color: #94a3b8;
        }

        .spinner-card .card-amount {
            font-size: 10.5px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- OPTIONAL DEBUG BAR (Only visible if ?controls=true or pressing 'C') -->
    <div class="debug-controls-bar" id="debugBar">
        <span style="font-weight: 800; color: #fff;">Overlay Testing:</span>
        <button type="button" class="btn-debug" onclick="triggerTestSpin(1)">Test Plants (Perfume)</button>
        <button type="button" class="btn-debug" onclick="triggerTestSpin(2)">Test Zombies (Doughnut)</button>
        <button type="button" class="btn-debug" onclick="triggerTestSpin(3)">Test Points (+/-)</button>
        <span style="margin-left: 8px;">Keys: [T] Random • [1] Plants • [2] Zombies • [3] Points</span>
    </div>

    <!-- DYNAMIC SPINNER STAGE: 100% INVISIBLE UNTIL AN ASSIGNED GIFT ARRIVES! -->
    <div class="spinner-stage-container" id="spinnerStageContainer">
        
        <!-- GIFTER ANNOUNCEMENT BADGE -->
        <div class="gifter-banner" id="gifterBanner">
            <div class="gifter-icon-wrap">
                <img id="gifterGiftIcon" src="images/tiktok-gifts/perfume_gift.webp" onerror="this.src='images/func_2.png'" alt="Gift">
            </div>
            <div class="gifter-text-col">
                <div class="gifter-headline" id="gifterHeadline">@TopViewer sent Perfume!</div>
                <div class="gifter-subtext" id="gifterSubtext">Spinning Plants Spinner...</div>
            </div>
        </div>

        <!-- REEL TOP BAR: QUEUE COUNTER & STOP SPINNER (EXACT MATCH TO PHOTO 2) -->
        <div class="reel-top-bar" id="reelTopBar">
            <div class="queue-status-text" id="queueStatusText">Queue: <span id="queueCountNum">0</span></div>
            <button type="button" class="btn-stop-spinner" id="btnStopSpinner" onclick="stopSpinnerQueue()">Stop Spinner</button>
        </div>

        <!-- REEL VIEWPORT WRAP -->
        <div class="reel-viewport-wrap">
            <!-- CENTER YELLOW POINTER WITH SPINNER AVATAR BADGE (EXACT MATCH TO PHOTO 2) -->
            <div class="reel-center-pointer" id="reelCenterPointer">
                <div class="pointer-user-tag" id="pointerUserTag">@TopViewer</div>
                <div class="pointer-triangle-wrapper">
                    <svg width="48" height="54" viewBox="0 0 48 54" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="2,2 46,2 24,52" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" />
                    </svg>
                    <div class="pointer-avatar-circle">
                        <img id="pointerAvatarImg" src="images/default_avatar.svg" alt="Spinner" onerror="this.src='images/func_2.png'">
                    </div>
                </div>
            </div>

            <!-- REEL VIEWPORT -->
            <div class="reel-viewport" id="reelViewport">
                <div class="reel-track" id="reelTrack">
                    <!-- Cards populated dynamically based on assigned spinner -->
                </div>
            </div>
        </div>

        <!-- WHEEL VIEWPORT WRAP (Classic Canvas Roulette Wheel) -->
        <div class="wheel-viewport-wrap" id="wheelViewportWrap" style="display: none;">
            <div id="wheelPointerContainer" class="wheel-pointer-container"></div>
            <canvas id="wheelCanvas" width="800" height="800"></canvas>
        </div>

        <!-- WINNER CELEBRATION BANNER -->
        <div class="winner-banner" id="winnerBanner">
            <span>🎉 Won:</span>
            <span id="winnerItemName" style="color: #ffffff;">Ultimate Cattail</span>
            <span style="font-size: 12px; color: #34d399; margin-left: 4px;">[Summoned into PvZ Fusion!]</span>
        </div>
    </div>

    <script>
        const CARD_WIDTH = 114;
        const CARD_GAP = 12;
        const FULL_CARD_STEP = CARD_WIDTH + CARD_GAP; // 126px

        let config = null;
        let isSpinning = false;
        let spinQueue = [];
        let lastEventTimestamp = Date.now();
        let autoHideTimer = null;
        let totalReelCards = [];
        const processedEventIds = new Set();

        // Check if controls should be visible (?controls=true or ?debug=true)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('controls') === 'true' || urlParams.get('debug') === 'true') {
            document.body.classList.add('show-controls');
        }

        // Web Audio Synthesizer for Mechanical Reel Ticks & Victory Fanfare
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playTickSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(420 + Math.random() * 80, ctx.currentTime);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch (e) {}
        }

        function playWinFanfare() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const startTime = ctx.currentTime + (idx * 0.12);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.12, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.45);
                });
            } catch (e) {}
        }

        // Fetch current studio config from backend
        async function loadConfig() {
            try {
                const res = await fetch('/api/config?t=' + Date.now());
                if (res.ok) {
                    config = await res.json();
                }
            } catch (err) {
                console.warn('Failed to load config:', err);
            }
        }

        function isNumberSliceItem(item) {
            if (!item) return false;
            if (item.actionType === 'plant' || item.actionType === 'zombie' || item.actionType === 'power') return false;
            if (item.isNumber === true || item.actionType === 'score') return true;
            if (item.delta !== undefined && item.delta !== null && Number(item.delta) !== 0) return true;
            const cleanLabel = String(item.label || item.text || '').replace(/[\u2212\u2013\u2014]/g, '-').trim();
            return /^([+-]?\d+)$/.test(cleanLabel);
        }

        function parseSliceDelta(item) {
            if (!item) return 0;
            if (item.delta !== undefined && item.delta !== null) return Number(item.delta);
            if (item.value !== undefined && item.value !== null) return Number(item.value);
            const cleanLabel = String(item.label || item.text || '').replace(/[\u2212\u2013\u2014]/g, '-').trim();
            const val = parseInt(cleanLabel, 10);
            return isNaN(val) ? 0 : val;
        }

        // Match an incoming gift to its assigned spinner in config
        function findSpinnerForGift(giftName, giftId) {
            if (!config) return null;
            const rawSpinners = config.spinners || (config.spinner ? [config.spinner] : []);
            const spinners = Array.isArray(rawSpinners) ? rawSpinners : (rawSpinners && typeof rawSpinners === 'object' ? Object.values(rawSpinners) : []);
            const cleanGName = (giftName || '').toLowerCase().replace(/[^a-z0-9]/g, '');

            for (const sp of spinners) {
                if (sp.enabled === false) continue;
                
                // Match by giftId
                if (giftId && sp.giftId && String(sp.giftId).trim() === String(giftId).trim()) {
                    return sp;
                }
                
                // Match by giftName
                if (sp.giftName) {
                    const cleanSpName = sp.giftName.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (cleanGName === cleanSpName || cleanGName.includes(cleanSpName) || cleanSpName.includes(cleanGName)) {
                        return sp;
                    }
                }
            }

            // Also check if any card in config.gifts has actionType: 'spinner' matching this gift
            if (config.gifts) {
                const matchedGiftCard = config.gifts.find(g => {
                    if (!g.enabled) return false;
                    const cGName = (g.giftName || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    const gIdMatch = giftId && g.giftId && String(g.giftId).trim() === String(giftId).trim();
                    return (gIdMatch || cGName === cleanGName) && (g.actionType === 'spinner' || (g.command && g.command.includes('spin')));
                });
                if (matchedGiftCard && spinners.length > 0) {
                    const boundSp = spinners.find(s => s.id === matchedGiftCard.spinnerId || (matchedGiftCard.command && matchedGiftCard.command.includes(s.id)));
                    return boundSp || spinners[0];
                }
            }

            return null;
        }

        // Build the horizontal cards reel dynamically based on the assigned spinner's prizes
        function buildReelForSpinner(spinner, winner) {
            let slices = spinner.slices || [];
            
            // Fallback authentic items if slices empty
            if (!slices || slices.length === 0) {
                slices = [
                    { id: '1', label: 'Nuclear Doom Cherry', rarity: 'Mythic', unitIcon: 'images/game-icons/pvz/spawn_nucleardoomcherry.webp' },
                    { id: '2', label: 'Super Threepeater SP', rarity: 'Legendary', unitIcon: 'images/game-icons/pvz/spawn_superthreepeater_sp.webp' },
                    { id: '3', label: 'Ultimate Cattail', rarity: 'Legendary', unitIcon: 'images/game-icons/pvz/spawn_ultimatecattail.webp' },
                    { id: '4', label: 'Ultimate Sniper Gatling', rarity: 'Legendary', unitIcon: 'images/game-icons/pvz/spawn_ultimatesnipergatling.webp' },
                    { id: '5', label: 'Charm All Zombies', rarity: 'Epic', unitIcon: 'images/game-icons/pvz/charm_all_zombies.webp' },
                    { id: '6', label: 'Launch Lawnmowers', rarity: 'Epic', unitIcon: 'images/game-icons/pvz/lawnmower.webp' },
                    { id: '7', label: 'Big Sun Nut', rarity: 'Rare', unitIcon: 'images/game-icons/pvz/spawn_big_sun_nut.webp' },
                    { id: '8', label: 'Ultimate Corn', rarity: 'Normal', unitIcon: 'images/game-icons/pvz/spawn_ultimate_corn.webp' }
                ];
            }

            const track = document.getElementById('reelTrack');
            track.innerHTML = '';
            const reelTheme = (spinner && spinner.reelTheme) || 'casino_felt';
            track.className = `reel-track theme-${reelTheme}`;

            const actualWinner = winner || slices[0];
            const targetIndex = 40;
            totalReelCards = [];
            for (let i = 0; i < 52; i++) {
                if (i === targetIndex) {
                    totalReelCards.push({ ...actualWinner, uniqueIndex: i });
                } else {
                    const randSlice = slices[Math.floor(Math.random() * slices.length)];
                    totalReelCards.push({ ...randSlice, uniqueIndex: i });
                }
            }

            totalReelCards.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `spinner-card rarity-${(item.rarity || 'normal').toLowerCase()} theme-${reelTheme}`;
                card.id = `reelCard_${index}`;
                card.dataset.index = index;
                card.dataset.id = item.id;

                const isScore = isNumberSliceItem(item);
                const deltaVal = parseSliceDelta(item);
                const col = item.color || (deltaVal >= 0 ? '#10b981' : '#f43f5e');
                const imgSrc = item.unitIcon || item.image || item.icon || 'images/func_2.png';
                const labelText = item.label || item.text || item.name || 'Unit';

                const rarity = item.rarity || 'Normal';
                if (isScore) {
                    card.style.borderColor = col;
                    card.style.boxShadow = `0 0 18px ${col}40`;
                    const signText = deltaVal >= 0 ? 'WIN +' : 'LOSE -';
                    const displayNum = (deltaVal > 0 ? `+${deltaVal}` : `${deltaVal}`);
                    card.innerHTML = `
                        <span class="rarity-tag" style="border-color:${col}; color:${col};">${rarity}</span>
                        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; padding:8px;">
                            <div style="font-family:'Outfit', sans-serif; font-size:40px; font-weight:900; color:${col}; text-shadow:0 0 16px ${col}; line-height:1; letter-spacing:-1px;">
                                ${displayNum}
                            </div>
                            <div style="font-size:11px; font-weight:800; color:${deltaVal >= 0 ? '#34d399' : '#f87171'}; margin-top:6px; letter-spacing:0.5px;">
                                ${signText}
                            </div>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <span class="rarity-tag">${rarity}</span>
                        <div class="card-img-wrap">
                            <img src="${imgSrc}" onerror="this.src='images/func_2.png'" alt="${labelText}">
                        </div>
                        <div class="card-label" title="${labelText}">${labelText}</div>
                        <div class="card-amount">x${item.amount || 1}</div>
                    `;
                }
                track.appendChild(card);
            });

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
        }

        function updateQueueDisplay() {
            const countEl = document.getElementById('queueCountNum');
            if (countEl) {
                countEl.innerText = spinQueue.length;
            }
        }

        function stopSpinnerQueue() {
            spinQueue = [];
            updateQueueDisplay();
            if (autoHideTimer) clearTimeout(autoHideTimer);
            const track = document.getElementById('reelTrack');
            if (track) {
                track.style.transition = 'none';
            }
            const stage = document.getElementById('spinnerStageContainer');
            if (stage) {
                stage.classList.add('fading-out');
                setTimeout(() => {
                    stage.classList.remove('active');
                    stage.classList.remove('fading-out');
                    isSpinning = false;
                    updateQueueDisplay();
                }, 200);
            } else {
                isSpinning = false;
            }
        }

        let wheelRotation = 0;

        // DUAL-MODE SPINNER: SPINS EITHER 3D ROULETTE WHEEL OR HORIZONTAL REEL
        function showAndSpin(options) {
            const {
                spinner,
                winner,
                username = 'TopViewer',
                avatar = '',
                giftName = 'Gift',
                giftIcon = 'images/tiktok-gifts/perfume_gift.webp'
            } = options;

            if (isSpinning) {
                spinQueue.push(options);
                updateQueueDisplay();
                return;
            }

            isSpinning = true;
            updateQueueDisplay();
            if (autoHideTimer) clearTimeout(autoHideTimer);

            const mode = (spinner && spinner.mode) || 'wheel';

            // 1. Setup Mode Viewports
            const wheelWrap = document.getElementById('wheelViewportWrap');
            const reelWrap = document.querySelector('.reel-viewport-wrap');

            if (mode === 'wheel') {
                if (reelWrap) reelWrap.style.display = 'none';
                if (wheelWrap) wheelWrap.style.display = 'flex';

                const canvas = document.getElementById('wheelCanvas');
                const ptrContainer = document.getElementById('wheelPointerContainer');
                if (ptrContainer) {
                    ptrContainer.innerHTML = getWheelPointerHTML(spinner.pointerTheme || 'brass_chevron', spinner.pointerIcon || avatar || '');
                }
                drawRealisticWheel(canvas, spinner);
            } else {
                if (wheelWrap) wheelWrap.style.display = 'none';
                if (reelWrap) reelWrap.style.display = 'block';

                buildReelForSpinner(spinner, winner);

                const avatarUrl = avatar || (spinner && spinner.pointerIcon) || 'images/default_avatar.svg';
                const pointerImg = document.getElementById('pointerAvatarImg');
                if (pointerImg) pointerImg.src = avatarUrl;
                const pointerTag = document.getElementById('pointerUserTag');
                if (pointerTag) {
                    pointerTag.innerText = `@${username}`;
                    pointerTag.style.display = 'block';
                }
            }

            // 2. Update Gifter Announcement Badge
            const iconEl = document.getElementById('gifterGiftIcon');
            if (iconEl) iconEl.src = giftIcon || (spinner && spinner.giftIcon) || 'images/tiktok-gifts/perfume_gift.webp';

            const headlineEl = document.getElementById('gifterHeadline');
            if (headlineEl) headlineEl.innerText = `@${username} sent ${giftName}!`;

            const subtextEl = document.getElementById('gifterSubtext');
            if (subtextEl) subtextEl.innerText = `Spinning ${(spinner && spinner.name) || 'Gift Spinner'}...`;

            // Reset banner and winner states
            const winBanner = document.getElementById('winnerBanner');
            winBanner.style.display = 'none';
            document.querySelectorAll('.spinner-card.winner').forEach(el => el.classList.remove('winner'));

            // 3. SHOW UP THE OVERLAY (Slides & fades into view smoothly)
            const stage = document.getElementById('spinnerStageContainer');
            stage.classList.remove('fading-out');
            stage.classList.add('active');

            // 4. Trigger spin
            setTimeout(() => {
                const onComplete = (wonItem) => {
                    const holdTime = spinQueue.length > 0 ? 1200 : 4500;
                    autoHideTimer = setTimeout(() => {
                        if (spinQueue.length > 0) {
                            const next = spinQueue.shift();
                            updateQueueDisplay();
                            isSpinning = false;
                            showAndSpin(next);
                        } else {
                            stage.classList.add('fading-out');
                            setTimeout(() => {
                                stage.classList.remove('active');
                                stage.classList.remove('fading-out');
                                isSpinning = false;
                                updateQueueDisplay();
                            }, 450);
                        }
                    }, holdTime);
                };

                if (mode === 'wheel') {
                    executeWheelSpin(winner, spinner, onComplete);
                } else {
                    executeReelSpin(winner, spinner, onComplete);
                }
            }, 350);
        }

        // Real 3D Roulette physics deceleration spin
        function executeWheelSpin(targetWinner, spinner, onComplete) {
            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) {
                if (onComplete) onComplete(targetWinner);
                return;
            }

            const slices = (spinner && spinner.slices && spinner.slices.length > 0) ? spinner.slices : [];
            let winIdx = slices.findIndex(s => targetWinner && s.id === targetWinner.id);
            if (winIdx === -1) winIdx = 0;

            const durationMs = (spinner && spinner.duration) ? Number(spinner.duration) : 4500;
            const sliceAngle = 360 / (slices.length || 8);

            const targetNormalized = ((270 - (winIdx + 0.5) * sliceAngle) % 360 + 360) % 360;
            const currentMod = ((wheelRotation % 360) + 360) % 360;
            let delta = (targetNormalized - currentMod) % 360;
            if (delta <= 0) delta += 360;
            const totalRotation = wheelRotation + (360 * 5) + delta;
            wheelRotation = totalRotation;

            canvas.style.transition = `transform ${durationMs}ms cubic-bezier(0.12, 0.95, 0.22, 1)`;
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            // Ticking audio during wheel spin
            let ticks = 0;
            const totalTicks = 32;
            let tickDelay = 70;
            function scheduleWheelTick() {
                if (ticks >= totalTicks) return;
                playTickSound();
                ticks++;
                tickDelay = 70 + Math.pow(ticks / totalTicks, 3) * 360;
                setTimeout(scheduleWheelTick, tickDelay);
            }
            setTimeout(scheduleWheelTick, 100);

            setTimeout(() => {
                playWinFanfare();

                const actualWinner = targetWinner || slices[winIdx] || { label: 'Prize' };
                const isNum = isNumberSliceItem(actualWinner);
                const banner = document.getElementById('winnerBanner');
                const itemNameSpan = document.getElementById('winnerItemName');

                if (isNum) {
                    const deltaVal = parseSliceDelta(actualWinner);
                    const isPos = deltaVal >= 0;
                    if (itemNameSpan) {
                        itemNameSpan.innerHTML = `<span style="color:${isPos ? '#10b981' : '#f43f5e'}; font-weight:900;">${isPos ? '+' : ''}${deltaVal} ${isPos ? 'Score Added to WIN!' : 'Score Deducted!'}</span>`;
                    }
                } else {
                    if (itemNameSpan) {
                        itemNameSpan.innerHTML = `<span style="color:${actualWinner.color || '#f59e0b'}; font-weight:900;">${actualWinner.label || actualWinner.name || 'Prize'}</span> <span style="font-size:12px; color:#94a3b8;">(x${actualWinner.amount || 1})</span>`;
                    }
                }
                if (banner) banner.style.display = 'flex';

                if (onComplete) onComplete(actualWinner);
            }, durationMs);
        }

        // Real horizontal deceleration reel spin (DOM-measured exact stop)
        function executeReelSpin(targetWinner, spinner, onComplete) {
            const track = document.getElementById('reelTrack');
            const viewport = document.getElementById('reelViewport');
            const viewportWidth = viewport.offsetWidth || 980;
            const centerPos = viewportWidth / 2;
            const targetIndex = 40;

            const targetCardEl = document.getElementById(`reelCard_${targetIndex}`) || track.children[targetIndex];
            if (!targetCardEl) {
                if (onComplete) onComplete(targetWinner);
                return;
            }

            void track.offsetWidth; // Force layout reflow
            const cardCenterInTrack = targetCardEl.offsetLeft + (targetCardEl.offsetWidth / 2);
            const finalTranslateX = centerPos - cardCenterInTrack;

            const durationMs = (spinner && spinner.duration) ? Number(spinner.duration) : 2500;
            const spinDurationSec = durationMs / 1000;

            // Sound ticks loop during spin
            let tickInterval = 65;
            let currentTickTime = 0;
            const tickTimer = setInterval(() => {
                currentTickTime += tickInterval;
                playTickSound();
                if (currentTickTime > durationMs * 0.6) tickInterval = 140;
                if (currentTickTime > durationMs * 0.85) tickInterval = 280;
                if (currentTickTime >= durationMs - 150) {
                    clearInterval(tickTimer);
                }
            }, 75);

            track.style.transition = `transform ${spinDurationSec}s cubic-bezier(0.12, 0.95, 0.18, 1)`;
            track.style.transform = `translateX(${finalTranslateX}px)`;

            setTimeout(() => {
                clearInterval(tickTimer);

                // Highlight winning card under yellow pointer
                targetCardEl.classList.add('winner');

                // Play victory sound
                playWinFanfare();

                // Show Winner Celebration Banner
                const banner = document.getElementById('winnerBanner');
                const itemNameSpan = document.getElementById('winnerItemName');
                const isScoreWin = isNumberSliceItem(targetWinner);
                if (isScoreWin) {
                    const deltaVal = parseSliceDelta(targetWinner);
                    const isPos = deltaVal >= 0;
                    itemNameSpan.innerHTML = `<span style="color:${isPos ? '#10b981' : '#f43f5e'}; font-weight:900;">${isPos ? '+' : ''}${deltaVal} ${isPos ? 'Score Added to WIN!' : 'Score Deducted!'}</span>`;
                } else {
                    itemNameSpan.innerText = targetWinner.label || targetWinner.text || 'Prize';
                }
                banner.style.display = 'flex';

                if (onComplete) onComplete(targetWinner);
            }, durationMs);
        }

        // Test Spin Trigger
        function triggerTestSpin(spinnerNum = 1) {
            getAudioContext();
            const spinners = (config && config.spinners) || [];
            let targetId = '';

            if (spinnerNum === 3) {
                targetId = 'spinner_plusminus';
            } else if (spinnerNum === 2) {
                const zSp = spinners.find(s => s.id === 'spinner_2' || (s.name && s.name.toLowerCase().includes('zombie'))) || spinners[1] || spinners[0];
                targetId = zSp ? zSp.id : 'spinner_2';
            } else {
                const pSp = spinners.find(s => s.id === 'spinner_1' || (s.name && s.name.toLowerCase().includes('plant'))) || spinners[0];
                targetId = pSp ? pSp.id : 'spinner_1';
            }

            const testerName = 'Tester';
            fetch(`/api/spin?spinnerId=${encodeURIComponent(targetId)}&username=${encodeURIComponent(testerName)}&noGameTrigger=true`, { method: 'POST' }).catch(() => {});
        }

        // Real-time Event Polling from backend (/api/events)
        function initEventsListener() {
            // Periodic config reload every 3 seconds to keep prizes completely fresh
            setInterval(async () => {
                try { await loadConfig(); } catch (e) {}
            }, 3000);

            setInterval(async () => {
                try {
                    const res = await fetch(`/api/events?since=${lastEventTimestamp}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.serverTime) lastEventTimestamp = data.serverTime;
                    
                    if (Array.isArray(data.events) && data.events.length > 0) {
                        for (const ev of data.events) {
                            if (ev.id && processedEventIds.has(ev.id)) continue;
                            if (ev.id) processedEventIds.add(ev.id);

                            // Live config / spinner update from dashboard
                            if (ev.type === 'config_updated' || ev.type === 'spinner_updated') {
                                await loadConfig();
                                continue;
                            }

                            // 1. Direct Spin Result Event
                            if (ev.type === 'spin_result') {
                                let sp = null;
                                if (config && config.spinners) {
                                    sp = config.spinners.find(s => String(s.id) === String(ev.spinnerId)) || 
                                         config.spinners.find(s => s.name && s.name.toLowerCase() === (ev.spinnerName || '').toLowerCase()) ||
                                         (ev.groupId ? config.spinners.find(s => String(s.groupId) === String(ev.groupId)) : null);
                                }
                                if (!sp) {
                                    sp = {
                                        id: ev.spinnerId || '1',
                                        name: ev.spinnerName || 'Spinner',
                                        mode: ev.mode || 'wheel',
                                        wheelTheme: ev.wheelTheme || 'casino_royale',
                                        centerFinial: ev.centerFinial || 'turret_3d',
                                        pointerTheme: ev.pointerTheme || 'brass_chevron',
                                        wheelRarityStyle: ev.wheelRarityStyle || 'rarity_enamel',
                                        reelTheme: ev.reelTheme || 'casino_felt',
                                        duration: ev.duration || 4500,
                                        ticks: ev.ticks || 100,
                                        pointerIcon: ev.pointerIcon || ''
                                    };
                                }

                                // Use live slices from the event so newly added cards (like -500) ALWAYS appear immediately!
                                const liveSlices = (ev.slices && Array.isArray(ev.slices) && ev.slices.length > 0)
                                    ? ev.slices
                                    : (sp.slices || []);

                                const dynamicSpinner = {
                                    ...sp,
                                    name: ev.spinnerName || sp.name || 'Spinner',
                                    id: ev.spinnerId || sp.id || '1',
                                    mode: ev.mode || sp.mode || 'wheel',
                                    wheelTheme: ev.wheelTheme || sp.wheelTheme || 'casino_royale',
                                    centerFinial: ev.centerFinial || sp.centerFinial || 'turret_3d',
                                    pointerTheme: ev.pointerTheme || sp.pointerTheme || 'brass_chevron',
                                    wheelRarityStyle: ev.wheelRarityStyle || sp.wheelRarityStyle || 'rarity_enamel',
                                    reelTheme: ev.reelTheme || sp.reelTheme || 'casino_felt',
                                    duration: ev.duration || sp.duration || 4500,
                                    ticks: ev.ticks || sp.ticks || 100,
                                    pointerIcon: ev.pointerIcon || sp.pointerIcon,
                                    slices: liveSlices
                                };

                                showAndSpin({
                                    spinner: dynamicSpinner,
                                    winner: ev.slice,
                                    username: ev.username || 'Gifter',
                                    avatar: ev.avatar,
                                    giftName: ev.giftName || sp.giftName || 'Gift',
                                    giftIcon: ev.icon || sp.giftIcon
                                });
                            }
                        }
                    }
                } catch (err) {}
            }, 450);
        }

        function toggleLivePreview() {
            const stage = document.getElementById('spinnerStageContainer');
            if (!stage) return;
            const isAct = stage.classList.contains('active');
            if (isAct) {
                stage.classList.remove('active');
            } else {
                previewActiveSpinner();
            }
        }

        function previewActiveSpinner() {
            const rawSpinners = (config && config.spinners) || (config && config.spinner ? [config.spinner] : []);
            const sp = rawSpinners[0] || { mode: 'wheel', slices: [] };
            const stage = document.getElementById('spinnerStageContainer');
            const wheelWrap = document.getElementById('wheelViewportWrap');
            const reelWrap = document.querySelector('.reel-viewport-wrap');

            const mode = sp.mode || 'wheel';
            if (mode === 'wheel') {
                if (reelWrap) reelWrap.style.display = 'none';
                if (wheelWrap) wheelWrap.style.display = 'flex';
                const canvas = document.getElementById('wheelCanvas');
                const ptrContainer = document.getElementById('wheelPointerContainer');
                if (ptrContainer) {
                    ptrContainer.innerHTML = getWheelPointerHTML(sp.pointerTheme || 'brass_chevron', sp.pointerIcon || '');
                }
                drawRealisticWheel(canvas, sp);
            } else {
                if (wheelWrap) wheelWrap.style.display = 'none';
                if (reelWrap) reelWrap.style.display = 'block';
                buildReelForSpinner(sp, null);
            }

            stage.classList.remove('fading-out');
            stage.classList.add('active');
        }

        // Keyboard hotkeys for testing while overlay is loaded
        window.addEventListener('keydown', (e) => {
            if (e.key === 't' || e.key === 'T') {
                const choices = [1, 2, 3];
                triggerTestSpin(choices[Math.floor(Math.random() * choices.length)]);
            } else if (e.key === '1') {
                triggerTestSpin(1);
            } else if (e.key === '2') {
                triggerTestSpin(2);
            } else if (e.key === '3') {
                triggerTestSpin(3);
            } else if (e.key === 'p' || e.key === 'P') {
                toggleLivePreview();
            } else if (e.key === 'c' || e.key === 'C') {
                document.body.classList.toggle('show-controls');
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', async () => {
            await loadConfig();
            initEventsListener();
            if (urlParams.get('preview') === 'true' || urlParams.get('debug') === 'true') {
                previewActiveSpinner();
            }
        });
    </script>
