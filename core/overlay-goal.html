<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Goal Overlay - Game Style</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Lilita+One&family=Oxanium:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* ─── Default Color Palette (Follower/Heart Theme) ─── */
            --gold: #FFD35A;
            --gold-start: #FFD35A;
            --gold-end: #FF9A1F;
            --gold-stroke: #3b1402;
            --gold-bevel: #220800;
            --gold-shadow: rgba(0, 0, 0, 0.75);

            --pink: #FF4D8D;
            --pink-accent: #FF4D8D;
            --pink-accent-light: #FF75A8;
            --pink-accent-dark: #D81B60;
            --pink-glow: rgba(255, 77, 141, 0.65);
            --pink-glow-bright: rgba(255, 77, 141, 0.95);
            --pink-track-bg: rgba(255, 255, 255, 0.14);

            --amber: #FFB020;
            --amber-glow: rgba(255, 176, 32, 0.75);
            --amber-dark: #FF8A00;
            --amber-light: #FFE27A;

            --highlight-white: #ffffff;
            --vignette-bg: radial-gradient(ellipse at center, rgba(10, 14, 24, 0.45) 0%, rgba(10, 14, 24, 0.20) 55%, transparent 72%);

            /* ─── Typography & Font Sizes ─── */
            --font-display: 'Lilita One', 'Fredoka', 'Oxanium', -apple-system, BlinkMacSystemFont, sans-serif;
            --title-size: 40px;
            --counter-current-size: 48px;
            --counter-goal-size: 38px;

            /* ─── Layout & Mascot Dimensions ─── */
            --mascot-size: 140px;
            --progress-width: 240px;
            --progress-height: 8px;
            --overlay-scale: 1;

            /* ─── Swappable Mascot Icon Sources ─── */
            --follower-icon: url('images/follower_mascot.svg');
            --heart-icon: url('images/tiktok-gifts/7934_heart_me.webp');
            --coin-icon: url('images/gifts/tiktok-coin-3d.webp');

            /* ─── Animation Timings & Speeds ─── */
            --anim-speed: 1s;
            --bob-duration: 3s;
            --heartbeat-duration: 1.4s;
            --glow-breathe-duration: 2.5s;
            --title-shimmer-interval: 6s;
            --bar-shine-interval: 4s;
            --progress-ease: cubic-bezier(0.22, 1, 0.36, 1);

            /* ─── Legacy Compatibility Variables ─── */
            --goal-accent: var(--pink-accent);
            --goal-accent-light: var(--pink-accent-light);
            --goal-accent-glow: var(--pink-glow);
        }

        /* ─── THEME: GOLD TREASURE (Coin Goal Mode) ─── */
        body.theme-coin {
            --gold-start: #FFE27A;
            --gold-mid: #FFB020;
            --gold-end: #FF8A00;
            --glow: var(--amber-glow);
            --vignette-bg: radial-gradient(ellipse at center, rgba(18, 12, 6, 0.52) 0%, rgba(18, 12, 6, 0.22) 55%, transparent 72%);
        }

        body.theme-coin .game-title {
            background: linear-gradient(
                115deg,
                #FFFDE7 0%,
                #FFE27A 20%,
                #FFB020 42%,
                #FFF9C4 48%,
                #FFFFFF 52%,
                #FFB020 58%,
                #FF8A00 80%,
                #E65100 100%
            ) !important;
            background-size: 260% 100% !important;
            background-position: 190% 0 !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        body.theme-coin .game-counter-current,
        body.theme-coin .game-counter-slash,
        body.theme-coin .game-counter-target {
            background: linear-gradient(180deg, #FFF9C4 0%, #FFE27A 28%, #FFB020 75%, #FF8A00 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        body.theme-coin .mascot-glow-aura {
            background: radial-gradient(circle, rgba(255, 176, 32, 0.75) 0%, rgba(255, 138, 0, 0.38) 45%, rgba(255, 176, 32, 0.1) 65%, transparent 75%) !important;
            animation: coinAmberGlowBreathe var(--glow-breathe-duration) ease-in-out infinite alternate !important;
        }

        @keyframes coinAmberGlowBreathe {
            0% { transform: scale(1); opacity: 0.5; filter: blur(14px); }
            100% { transform: scale(1.08); opacity: 0.9; filter: blur(18px); }
        }

        body.theme-coin .mascot-glow-aura.flash-glow {
            transform: scale(1.3) !important;
            filter: blur(24px) brightness(2.2) !important;
            opacity: 1 !important;
        }

        body.theme-coin .game-progress-track {
            border-color: rgba(255, 176, 32, 0.45) !important;
            background: rgba(255, 255, 255, 0.12) !important;
        }

        body.theme-coin .game-progress-fill {
            background: linear-gradient(90deg, #FF8A00 0%, #FFB020 55%, #FFE27A 100%) !important;
            box-shadow: 0 0 14px rgba(255, 176, 32, 0.8) !important;
        }

        body.theme-coin .game-pct-badge {
            background: rgba(255, 176, 32, 0.22) !important;
            border-color: #FFB020 !important;
            box-shadow: 0 0 8px rgba(255, 176, 32, 0.5) !important;
            text-shadow: 0 0 6px rgba(255, 176, 32, 0.9) !important;
        }

        body.theme-coin .game-tick.active {
            background: #FFB020 !important;
            box-shadow: 0 0 6px rgba(255, 176, 32, 0.8) !important;
        }

        body.theme-coin .progress-spark-tip {
            box-shadow: 0 0 8px #ffffff, 0 0 14px #FFE27A !important;
        }

        /* 3D Coin Y-Axis Spin & Bobbing Animation */
        body.theme-coin .coin-flip-wrap {
            perspective: 800px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.theme-coin .coin-spin-disc {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            animation: coinYAxisFlip 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            will-change: transform;
        }

        @keyframes coinYAxisFlip {
            0%, 75% {
                transform: rotateY(0deg);
            }
            88% {
                transform: rotateY(180deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        /* Coin Bounce & Spin on Coins Received */
        @keyframes coinBounceSpin {
            0% { transform: scale(1) rotateY(0deg); }
            25% { transform: scale(0.85, 0.85) rotateY(90deg); }
            55% { transform: scale(1.22, 1.22) rotateY(270deg); filter: drop-shadow(0 0 24px #FFB020) brightness(1.3); }
            75% { transform: scale(1.05, 1.05) rotateY(360deg); }
            100% { transform: scale(1, 1) rotateY(360deg); }
        }

        body.theme-coin .coin-spin-disc.coin-bounce-spin {
            animation: coinBounceSpin 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        html, body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            user-select: none;
            -webkit-user-select: none;
        }

        /* ─── Transparent Stream Overlay Container ─── */
        .game-overlay-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 24px 36px;
            background: var(--vignette-bg);
            border-radius: 32px;
            transform-origin: center center;
            transform: scale(var(--overlay-scale));
            transition: transform 0.3s ease;
            user-select: none;
        }

        /* Canvas for confetti & celebration shower */
        #confettiCanvas {
            position: absolute;
            inset: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            pointer-events: none;
            z-index: 40;
        }

        /* ─── Title: Chunky Gold Display with Idle Shimmer ─── */
        .game-title-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: var(--title-size);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.1;
            margin: 0;
            padding: 0;

            background: linear-gradient(
                115deg,
                var(--gold-start) 0%,
                var(--gold-end) 22%,
                var(--gold-start) 40%,
                #FFFDE7 48%,
                #FFFFFF 52%,
                var(--gold-start) 58%,
                var(--gold-end) 80%,
                var(--gold-start) 100%
            );
            background-size: 260% 100%;
            background-position: 190% 0;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(2px 0 0 var(--gold-stroke))
                    drop-shadow(-2px 0 0 var(--gold-stroke))
                    drop-shadow(0 2px 0 var(--gold-stroke))
                    drop-shadow(0 -2px 0 var(--gold-stroke))
                    drop-shadow(0 4px 1px var(--gold-bevel))
                    drop-shadow(0 8px 14px var(--gold-shadow));

            animation: titleIdleShimmer var(--title-shimmer-interval) ease-in-out infinite;
            transition: filter 0.3s ease, transform 0.3s ease;
            user-select: none;
            will-change: background-position, transform;
        }

        @keyframes titleIdleShimmer {
            0%, 72% {
                background-position: 190% 0;
            }
            100% {
                background-position: -90% 0;
            }
        }

        .game-title.quick-shimmer {
            animation: titleQuickShimmer 1s ease-in-out forwards !important;
        }

        @keyframes titleQuickShimmer {
            0% { background-position: 190% 0; }
            100% { background-position: -90% 0; }
        }

        .game-title.goal-shimmer {
            background: linear-gradient(
                110deg,
                #FF8A00 0%,
                #FFE27A 25%,
                #FFFFFF 50%,
                #FFE27A 75%,
                #FF8A00 100%
            );
            background-size: 250% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShimmerContinuous 1.8s ease-in-out infinite !important;
        }

        @keyframes goldShimmerContinuous {
            0% { background-position: 180% 0; }
            100% { background-position: -80% 0; }
        }

        @keyframes bounceInText {
            0% { transform: scale(0.65); opacity: 0; }
            55% { transform: scale(1.15); opacity: 1; }
            75% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .anim-bounce-in {
            animation: bounceInText 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        /* ─── Mascot / Icon Middle Area ─── */
        .game-mascot-container {
            position: relative;
            width: var(--mascot-size);
            height: var(--mascot-size);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px 0 2px 0;
            z-index: 5;
        }

        .mascot-glow-aura {
            position: absolute;
            width: calc(var(--mascot-size) * 1.35);
            height: calc(var(--mascot-size) * 1.35);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 77, 141, 0.6) 0%, rgba(255, 45, 120, 0.32) 45%, rgba(255, 77, 141, 0.08) 65%, transparent 75%);
            filter: blur(14px);
            pointer-events: none;
            z-index: 1;
            animation: glowAuraBreathing var(--glow-breathe-duration) ease-in-out infinite alternate;
            transition: filter 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
            will-change: transform, opacity;
        }

        @keyframes glowAuraBreathing {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.08);
                opacity: 0.9;
            }
        }

        .mascot-glow-aura.flash-glow {
            animation: none;
            transform: scale(1.28) !important;
            filter: blur(24px) brightness(2.2) !important;
            opacity: 1 !important;
        }

        .mascot-bob-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: mascotFloatBob var(--bob-duration) ease-in-out infinite;
            will-change: transform;
        }

        @keyframes mascotFloatBob {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .mascot-pulse-wrap,
        .pulse-heartbeat,
        body.theme-heart #mascotPulseWrap {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: heartbeatDoubleBeat var(--heartbeat-duration) ease-in-out infinite;
            will-change: transform;
        }

        @keyframes heartbeatDoubleBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.05); }
            24% { transform: scale(1); }
            38% { transform: scale(1.035); }
            50% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* ─── Follower Mascot Soft Pop / Gentle Breathing Bounce ─── */
        .pulse-follower,
        body.theme-follower #mascotPulseWrap {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: followerSoftPopBounce 2.2s cubic-bezier(0.34, 1.3, 0.64, 1) infinite;
            will-change: transform;
        }

        @keyframes followerSoftPopBounce {
            0%, 100% {
                transform: scale(1) translateY(0);
            }
            35% {
                transform: scale(1.045, 0.985) translateY(-2px);
            }
            50% {
                transform: scale(0.99, 1.015) translateY(0);
            }
            70% {
                transform: scale(1.015, 0.995) translateY(-1px);
            }
        }

        /* Circular gold-rimmed badge frame */
        .mascot-badge-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(255, 211, 90, 0.45);
            box-shadow: 0 0 12px rgba(255, 211, 90, 0.3), inset 0 0 10px rgba(255, 176, 32, 0.2);
            pointer-events: none;
            z-index: 2;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .mascot-badge-ring.ring-flash {
            animation: ringFlash 0.5s ease-out;
        }

        @keyframes ringFlash {
            0% {
                border-color: rgba(255, 255, 255, 1);
                box-shadow: 0 0 24px rgba(255, 255, 255, 0.9), 0 0 35px var(--glow);
            }
            100% {
                border-color: rgba(255, 211, 90, 0.45);
                box-shadow: 0 0 12px rgba(255, 211, 90, 0.3), inset 0 0 10px rgba(255, 176, 32, 0.2);
            }
        }

        /* Twinkling sparkles */
        .badge-sparkle {
            position: absolute;
            color: #FFF59D;
            font-size: 14px;
            line-height: 1;
            pointer-events: none;
            z-index: 4;
            animation: sparkleTwinkle 2.4s ease-in-out infinite;
            will-change: transform, opacity;
        }

        .badge-sparkle-1 { top: 6px; left: 28px; animation-delay: 0s; }
        .badge-sparkle-2 { top: 22px; right: 10px; animation-delay: 0.8s; }
        .badge-sparkle-3 { bottom: 22px; left: 10px; animation-delay: 1.6s; }
        .badge-sparkle-4 { bottom: 10px; right: 28px; animation-delay: 2.2s; }

        @keyframes sparkleTwinkle {
            0%, 100% {
                transform: scale(0.6) rotate(0deg);
                opacity: 0.35;
                filter: drop-shadow(0 0 2px rgba(255, 211, 90, 0.4));
            }
            50% {
                transform: scale(1.2) rotate(45deg);
                opacity: 1;
                filter: drop-shadow(0 0 8px #FFF9C4) drop-shadow(0 0 12px var(--gold-start));
            }
        }

        .game-mascot-img {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 16px rgba(255, 176, 32, 0.4));
            transform-origin: center center;
            transition: transform 0.2s ease;
            will-change: transform;
        }

        @keyframes mascotSquishBounce {
            0% { transform: scale(1); }
            22% { transform: scale(0.9, 0.9); }
            55% { transform: scale(1.15, 1.15); filter: drop-shadow(0 0 24px var(--amber)) brightness(1.25); }
            100% { transform: scale(1); }
        }

        .game-mascot-img.anim-squish {
            animation: mascotSquishBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        @keyframes victorySpinPop {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.25) rotate(-10deg); }
            50% { transform: scale(1.25) rotate(10deg); }
            75% { transform: scale(1.18) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .game-mascot-img.victory-spin-pop {
            animation: victorySpinPop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .milestone-shockwave-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            box-shadow: 0 0 18px var(--gold), inset 0 0 12px var(--gold-end);
            pointer-events: none;
            z-index: 15;
            animation: milestoneRingExpand 0.75s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes milestoneRingExpand {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.85); opacity: 0; }
        }

        /* ─── Particles Layer ─── */
        .particles-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            overflow: visible;
        }

        .floating-heart-particle {
            position: absolute;
            pointer-events: none;
            user-select: none;
            line-height: 1;
            z-index: 25;
            animation: floatHeartRise var(--particle-duration, 1.6s) cubic-bezier(0.2, 0.8, 0.35, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes floatHeartRise {
            0% {
                transform: translate(0, 0) scale(0.4) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
                transform: translate(calc(var(--dx) * 0.3), -20px) scale(1.25) rotate(calc(var(--rot) * 0.4));
            }
            70% {
                opacity: 0.9;
                transform: translate(calc(var(--dx) * 0.8), -56px) scale(1.05) rotate(calc(var(--rot) * 0.8));
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), -90px) scale(0.35) rotate(var(--rot));
            }
        }

        /* ─── Floating Follower Particle (User Plus + Sparkles + Mini Hearts) ─── */
        .floating-follower-particle {
            position: absolute;
            pointer-events: none;
            user-select: none;
            line-height: 1;
            z-index: 25;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 8px rgba(255, 77, 141, 0.65));
            animation: floatFollowerRise var(--particle-duration, 1.8s) cubic-bezier(0.2, 0.8, 0.35, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes floatFollowerRise {
            0% {
                transform: translate(0, 0) scale(0.4) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
                transform: translate(calc(var(--dx) * 0.3), -22px) scale(1.2) rotate(calc(var(--rot) * 0.4));
            }
            70% {
                opacity: 0.95;
                transform: translate(calc(var(--dx) * 0.8), -62px) scale(1.05) rotate(calc(var(--rot) * 0.8));
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), -98px) scale(0.3) rotate(var(--rot));
            }
        }

        /* Mini Falling Coins Arc Particles */
        .mini-coin-particle {
            position: absolute;
            pointer-events: none;
            user-select: none;
            z-index: 26;
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 8px rgba(255, 176, 32, 0.8));
            animation: miniCoinArc 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            will-change: transform, opacity;
        }

        @keyframes miniCoinArc {
            0% {
                transform: translate(0, 0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            12% {
                opacity: 1;
                transform: translate(calc(var(--arc-x) * 0.3), -45px) scale(1.15) rotate(calc(var(--rot) * 0.3));
            }
            45% {
                transform: translate(calc(var(--arc-x) * 0.6), -20px) scale(1) rotate(calc(var(--rot) * 0.6));
            }
            100% {
                transform: translate(var(--arc-x), 80px) scale(0.7) rotate(var(--rot));
                opacity: 0;
            }
        }

        /* Floating +Amount Label near counter */
        .floating-amount-badge {
            position: absolute;
            top: -24px;
            right: -20px;
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(180deg, #FFFFFF 0%, #FFF59D 30%, #FFB020 75%, #FF8A00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 0 0 #3b1402) drop-shadow(-2px 0 0 #3b1402) drop-shadow(0 2px 0 #3b1402) drop-shadow(0 0 10px rgba(255, 176, 32, 0.9));
            pointer-events: none;
            z-index: 30;
            animation: floatAmountRise 1.3s cubic-bezier(0.2, 0.8, 0.35, 1) forwards;
            white-space: nowrap;
        }

        @keyframes floatAmountRise {
            0% { transform: translateY(8px) scale(0.6); opacity: 0; }
            20% { transform: translateY(-8px) scale(1.25); opacity: 1; }
            75% { transform: translateY(-28px) scale(1.05); opacity: 0.95; }
            100% { transform: translateY(-44px) scale(0.8); opacity: 0; }
        }

        /* ─── Counter: {current} / {goal} ─── */
        .game-counter-row {
            position: relative;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            line-height: 1;
            font-family: var(--font-display);
            font-variant-numeric: tabular-nums;
            z-index: 10;
            margin-top: 2px;
        }

        .game-counter-current,
        .game-counter-slash,
        .game-counter-target {
            font-family: var(--font-display);
            font-weight: 900;
            background: linear-gradient(180deg, #FFF67E 0%, var(--gold-start) 28%, var(--gold-end) 82%, #DF6A00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 0 0 var(--gold-stroke))
                    drop-shadow(-2px 0 0 var(--gold-stroke))
                    drop-shadow(0 2px 0 var(--gold-stroke))
                    drop-shadow(0 -2px 0 var(--gold-stroke))
                    drop-shadow(0 4px 1px var(--gold-bevel))
                    drop-shadow(0 7px 12px var(--gold-shadow));
            user-select: none;
        }

        .game-counter-current {
            font-size: var(--counter-current-size);
            display: inline-block;
            transform-origin: center center;
            will-change: transform, filter;
        }

        .game-counter-slash {
            font-size: calc(var(--counter-goal-size) * 0.95);
            opacity: 0.92;
        }

        .game-counter-target {
            font-size: var(--counter-goal-size);
        }

        @keyframes counterPopGlow {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.3);
                filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.95))
                        drop-shadow(0 0 26px var(--gold-start))
                        drop-shadow(0 4px 1px var(--gold-bevel));
            }
            100% {
                transform: scale(1);
            }
        }

        .anim-pts-pop {
            animation: counterPopGlow 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        /* ─── Slim Progress Bar & 10 Segment Ticks ─── */
        .game-progress-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: var(--progress-width);
            margin-top: 6px;
            z-index: 10;
        }

        .game-progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .game-progress-bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .game-progress-track {
            width: 100%;
            height: var(--progress-height);
            background: var(--pink-track-bg);
            border: 1px solid rgba(255, 77, 141, 0.4);
            border-radius: 999px;
            position: relative;
            overflow: visible;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .game-progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #FF4D8D 0%, #FF659C 60%, #FFA8CB 100%);
            box-shadow: 0 0 12px var(--pink-glow);
            transition: width 0.8s var(--progress-ease);
            position: relative;
            overflow: visible;
            will-change: width;
        }

        .game-progress-shimmer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.7) 50%, transparent 100%);
            animation: progressShineStreak var(--bar-shine-interval) ease-in-out infinite;
            pointer-events: none;
            overflow: hidden;
        }

        @keyframes progressShineStreak {
            0%, 65% {
                transform: translateX(-100%);
                opacity: 0;
            }
            70% {
                opacity: 0.85;
            }
            100% {
                transform: translateX(250%);
                opacity: 0;
            }
        }

        .progress-spark-tip {
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 7px;
            height: 13px;
            border-radius: 999px;
            background: #ffffff;
            box-shadow: 0 0 8px #ffffff, 0 0 14px var(--pink-accent-light);
            opacity: 0.95;
            pointer-events: none;
            z-index: 6;
            transition: opacity 0.3s ease;
        }

        .game-progress-fill.goal-gold-mode {
            background: linear-gradient(90deg, #FFD35A 0%, #FF9A1F 55%, #FFF9C4 100%) !important;
            box-shadow: 0 0 16px rgba(255, 211, 90, 0.95), 0 0 28px rgba(255, 154, 31, 0.75) !important;
            animation: goldBarPulse 1.4s ease-in-out infinite alternate !important;
        }

        @keyframes goldBarPulse {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.28); box-shadow: 0 0 24px rgba(255, 211, 90, 1), 0 0 40px rgba(255, 154, 31, 0.9); }
        }

        .game-pct-badge {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            background: rgba(255, 77, 141, 0.22);
            border: 1px solid var(--pink-accent);
            padding: 3px 8px;
            border-radius: 999px;
            box-shadow: 0 0 8px var(--pink-glow);
            text-shadow: 0 0 6px var(--pink-glow-bright);
            white-space: nowrap;
            line-height: 1.1;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            will-change: transform;
        }

        @keyframes pillBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); box-shadow: 0 0 14px var(--pink-glow-bright); }
            100% { transform: scale(1); }
        }

        .anim-pill-bounce {
            animation: pillBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .game-ticks-track {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .game-tick {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            transform-origin: center;
        }

        .game-tick.active {
            background: var(--pink-accent);
            box-shadow: 0 0 6px var(--pink-glow);
        }

        @keyframes tickFlash {
            0% {
                background: #ffffff;
                box-shadow: 0 0 12px #ffffff, 0 0 16px var(--gold-start);
                transform: scaleY(1.7);
            }
            100% {
                background: var(--pink-accent);
                box-shadow: 0 0 6px var(--pink-glow);
                transform: scaleY(1);
            }
        }

        .game-tick.just-reached {
            animation: tickFlash 0.65s ease-out;
        }

        /* ─── Goal Celebration Banner ─── */
        .goal-celebration-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.16, 1.4, 0.3, 1);
        }

        .goal-celebration-banner.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .celebration-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(20, 10, 16, 0.94), rgba(40, 15, 28, 0.96));
            border: 2px solid var(--gold-start);
            padding: 8px 22px;
            border-radius: 9999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 211, 90, 0.5);
            animation: badgeShine 1.5s ease-in-out infinite alternate;
        }

        @keyframes badgeShine {
            0% { box-shadow: 0 10px 30px rgba(0,0,0,0.85), 0 0 18px rgba(255, 211, 90, 0.4); }
            100% { box-shadow: 0 10px 30px rgba(0,0,0,0.85), 0 0 35px rgba(255, 211, 90, 0.75), inset 0 0 12px rgba(255, 176, 32, 0.4); }
        }

        .celebration-text {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--gold-start);
            white-space: nowrap;
        }

        .dev-test-trigger {
            position: absolute;
            bottom: 6px;
            right: 8px;
            opacity: 0;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 211, 90, 0.4);
            color: #FFD35A;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 60;
            transition: opacity 0.2s ease;
        }
        .game-overlay-container:hover .dev-test-trigger {
            opacity: 0.85;
        }
        .dev-test-trigger:hover {
            opacity: 1;
            background: rgba(255, 211, 90, 0.2);
        }

        @media (max-width: 800px), (max-height: 550px) {
            :root {
                --title-size: 32px;
                --mascot-size: 118px;

        @media (max-width: 500px), (max-height: 400px) {

                --mascot-size: 96px;

                --counter-goal-size: 26px;
                --progress-width: 175px;

            }
            .game-overlay-container {

            }
        }

        @media (prefers-reduced-motion: reduce) {
            .mascot-bob-wrap,
            .mascot-pulse-wrap,
            .coin-spin-disc,
            .mascot-glow-aura,
            .badge-sparkle,
            .game-title,
            .game-progress-shimmer,
            .game-progress-fill.goal-gold-mode {
                animation: none !important;
            }
            .particles-layer {
                display: none !important;
            }
            .game-progress-fill {
                transition: none !important;
            }
        }
    </style>
</head>
<body class="theme-coin">

    <script>
        const params = new URLSearchParams(window.location.search);
        const goalType = (params.get('type') || params.get('kind') || 'coins').toLowerCase();

        // Detect Theme Mode (Coins vs Followers vs Hearts)
        const isCoinGoal = goalType.includes('coin');
        const isFollowerGoal = goalType.includes('follow');
        const isHeartGoal = goalType.includes('heart');

        // ========================================================
        // DEDICATED GOAL CONFIGURATIONS (Decoupled & Isolated)
        // ========================================================
        const GOAL_CONFIGS = {
            follower: {
                type: 'follower',
                title: 'FOLLOWER GOAL',
                celebration: 'FOLLOWER GOAL REACHED!',
                defaultGoal: 200,
                defaultCurrent: 142,
                iconSrc: 'images/follower_mascot.svg',
                pulseClass: 'pulse-follower',
                themeClass: 'theme-follower'
            },
            heart_me: {
                type: 'heart_me',
                title: 'HEART ME',
                celebration: 'HEART GOAL COMPLETED!',
                defaultGoal: 100,
                defaultCurrent: 50,
                iconSrc: 'images/tiktok-gifts/7934_heart_me.webp',
                pulseClass: 'pulse-heartbeat',
                themeClass: 'theme-heart'
            },
            coin: {
                type: 'coin',
                title: 'COIN GOAL',
                celebration: 'COIN GOAL REACHED!',
                defaultGoal: 5000,
                defaultCurrent: 2840,
                iconSrc: 'images/gifts/tiktok-coin-3d.webp',
                pulseClass: 'pulse-coin',
                themeClass: 'theme-coin'
            }
        };

        const activeProfile = isFollowerGoal ? GOAL_CONFIGS.follower : (isHeartGoal ? GOAL_CONFIGS.heart_me : GOAL_CONFIGS.coin);

        document.body.classList.remove('theme-coin', 'theme-follower', 'theme-heart');
        document.body.classList.add(activeProfile.themeClass);

        const pulseWrap = document.getElementById('mascotPulseWrap');
        if (pulseWrap) {
            pulseWrap.className = isCoinGoal ? 'coin-flip-wrap' : (isFollowerGoal ? 'pulse-follower' : 'mascot-pulse-wrap');
        }

        // Custom Scaling if requested via ?scale=0.8 or ?scale=1.2
        const customScale = parseFloat(params.get('scale'));
        if (!isNaN(customScale) && customScale > 0) {
            document.documentElement.style.setProperty('--overlay-scale', customScale);
        }

        // Target and Current Defaults
        let defaultGoal = activeProfile.defaultGoal;
        let defaultCurrent = activeProfile.defaultCurrent;
        if (goalType.includes('share')) {
            defaultGoal = 500;
            defaultCurrent = 50;
        }

        let targetVal = parseInt(params.get('goal') || defaultGoal, 10);
        const storedGoalVal = sessionStorage.getItem('goal_current_' + goalType);
        let currentVal = parseInt(params.get('current') || (storedGoalVal !== null ? storedGoalVal : defaultCurrent), 10);
        const customTitle = params.get('title');
        const customAccent = params.get('accent');

        // Apply custom accent colors if requested
        if (customAccent) {
            document.documentElement.style.setProperty('--amber', customAccent);
            document.documentElement.style.setProperty('--amber-dark', customAccent);
            document.documentElement.style.setProperty('--pink-accent', customAccent);
            document.documentElement.style.setProperty('--pink-accent-light', customAccent);
            document.documentElement.style.setProperty('--pink-glow', customAccent + '88');
            document.documentElement.style.setProperty('--goal-accent', customAccent);
        }

        // Apply Mascot Image (Isolated per overlay profile + swappable via CSS variable or config)
        const mascotImg = document.getElementById('heartmeImg');
        const customIcon = params.get('icon') || params.get('img');
        const cssFollowerIcon = getComputedStyle(document.documentElement).getPropertyValue('--follower-icon').trim().replace(/^url\(["']?|["']?\)$/g, '');

        let targetIconSrc = activeProfile.iconSrc;
        if (customIcon) {
            targetIconSrc = customIcon;
        } else if (isFollowerGoal && cssFollowerIcon) {
            targetIconSrc = cssFollowerIcon;
        }

        if (mascotImg) {
            mascotImg.src = targetIconSrc;
            mascotImg.alt = activeProfile.title + ' Mascot';
            if (isFollowerGoal) {
                mascotImg.onerror = function() {
                    this.onerror = null;
                    this.src = '/images/follower_mascot.svg';
                };
            } else if (isHeartGoal) {
                mascotImg.onerror = function() {
                    this.onerror = null;
                    this.src = '/images/tiktok-gifts/7934_heart_me.webp';
                };
            } else if (isCoinGoal) {
                mascotImg.onerror = function() {
                    this.onerror = null;
                    this.src = '/images/gifts/tiktok-coin-3d.webp';
                    this.onerror = function() { this.src = 'images/jars/gold_coin.png'; };
                };
            }
        }

        // Apply Title & Celebration Banner text
        let displayLabel = customTitle || activeProfile.title;
        let celebrationText = customTitle ? (customTitle.toUpperCase() + ' REACHED!') : activeProfile.celebration;

        const goalLabelEl = document.getElementById('goalLabel');
        if (goalLabelEl) goalLabelEl.textContent = displayLabel.toUpperCase();
        const bannerTextEl = document.getElementById('celebrationBannerText');
        if (bannerTextEl) bannerTextEl.textContent = celebrationText;

        // Interactive click on mascot/overlay to test
        const testBtn = document.getElementById('devTestBtn');
        if (testBtn) {
            testBtn.textContent = isCoinGoal ? '+100 Coins' : (isFollowerGoal ? '+1 Follow' : '+1 Heart');
            testBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isCoinGoal) {
                    window.testCoins(100);
                } else if (isFollowerGoal) {
                    window.testFollow(1);
                } else {
                    window.testHearts(1);
                }
            });
        }

        const mascotWrap = document.getElementById('heartmeWrapper');
        if (mascotWrap) {
            mascotWrap.style.cursor = 'pointer';
            mascotWrap.title = 'Click to test increase';
            mascotWrap.addEventListener('click', (e) => {
                if (isCoinGoal) {
                    const add = e.shiftKey ? 500 : 100;
                    window.testCoins(add);
                } else if (isFollowerGoal) {
                    const add = e.shiftKey ? 5 : 1;
                    window.testFollow(add);
                } else {
                    const add = e.shiftKey ? 5 : 1;
                    window.testHearts(add);
                }
            });
        }

        // Synthesizer Audio Fanfare Chime on goal completion
        function playVictoryChime() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0, now + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.1 + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.7);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.75);
                });
            } catch (e) {}
        }

        // ========================================================
        // CONFETTI & 3-SECOND COIN SHOWER ENGINE
        // ========================================================
        let confettiRunning = false;
        let confettiParticles = [];

        function startCelebrationConfetti(durationMs = 3000) {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const canvas = document.getElementById('confettiCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth || 500;
            canvas.height = canvas.offsetHeight || 500;

            const colors = ['#FFE27A', '#FFB020', '#FF8A00', '#FFFFFF', '#FFF9C4', '#F59E0B'];
            confettiParticles = [];

            // 1. Radial burst from badge center
            for (let i = 0; i < 45; i++) {
                confettiParticles.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 40,
                    y: canvas.height * 0.44,
                    vx: (Math.random() - 0.5) * 12,
                    vy: -(Math.random() * 8 + 4),
                    size: Math.random() * 7 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.25,
                    isCoin: isCoinGoal ? (Math.random() > 0.3) : false,
                    isHeart: !isCoinGoal && Math.random() > 0.4,
                    alpha: 1,
                    decay: 1 / (durationMs / 16.6 * (0.8 + Math.random() * 0.4))
                });
            }

            // 2. Continuous 3-second rain across overlay width
            for (let i = 0; i < 40; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: -(Math.random() * 200 + 10),
                    vx: (Math.random() - 0.5) * 2.5,
                    vy: Math.random() * 3 + 2.5,
                    size: Math.random() * 6 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.2,
                    isCoin: isCoinGoal,
                    isHeart: !isCoinGoal && Math.random() > 0.4,
                    alpha: 1,
                    decay: 1 / (durationMs / 16.6 * 1.1)
                });
            }

            if (confettiRunning) return;
            confettiRunning = true;

            function renderConfetti() {
                if (!confettiRunning) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = 0;
                confettiParticles.forEach(p => {
                    if (p.alpha <= 0) return;
                    alive++;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.isCoin ? 0.22 : 0.18; // gravity
                    p.rot += p.rotSpeed;
                    p.alpha -= p.decay;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.globalAlpha = Math.max(0, p.alpha);

                    if (p.isCoin) {
                        // Glossy 3D Gold Coin Drawing
                        const r = p.size;
                        const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                        grad.addColorStop(0, '#FFFDE7');
                        grad.addColorStop(0.35, '#FFE27A');
                        grad.addColorStop(0.8, '#FFB020');
                        grad.addColorStop(1, '#FF8A00');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(0, 0, r, 0, Math.PI * 2);
                        ctx.fill();

                        // Coin Gold Rim
                        ctx.strokeStyle = '#D97706';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();

                        // Inner Coin Star
                        ctx.fillStyle = '#FFFFFF';
                        ctx.font = `bold ${Math.round(r * 1.1)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('★', 0, 1);
                    } else if (p.isHeart) {
                        // Mini Heart
                        const s = p.size * 0.85;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.moveTo(0, s * 0.3);
                        ctx.bezierCurveTo(-s * 0.6, -s * 0.3, -s * 0.9, s * 0.3, 0, s * 1.1);
                        ctx.bezierCurveTo(s * 0.9, s * 0.3, s * 0.6, -s * 0.3, 0, s * 0.3);
                        ctx.fill();
                    } else {
                        // Gold confetti ribbon
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                    }
                    ctx.restore();
                });

                if (alive > 0) {
                    requestAnimationFrame(renderConfetti);
                } else {
                    confettiRunning = false;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(renderConfetti);
        }

        // ========================================================
        // MINI COINS BURST & FLOATING +AMOUNT BADGES
        // ========================================================
        function emitMiniCoinsBurst(amount = 100) {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const layer = document.getElementById('particlesLayer');
            if (!layer) return;

            // Scale particle count with amount received: 3 (small), 8 (med), 15 (big)
            let count = 3;
            if (amount >= 100) count = 15;
            else if (amount >= 10) count = 8;

            for (let i = 0; i < count; i++) {
                const coin = document.createElement('img');
                coin.src = 'images/gifts/tiktok-coin-3d.webp';
                coin.onerror = function() { this.src = 'images/jars/gold_coin.png'; };
                coin.className = 'mini-coin-particle';

                // Random horizontal arc (-65px to +65px) and rotation
                const arcX = (Math.random() - 0.5) * 130;
                const rot = (Math.random() - 0.5) * 360;
                const size = Math.floor(Math.random() * 6 + 18); // 18px - 24px

                coin.style.setProperty('--arc-x', `${arcX}px`);
                coin.style.setProperty('--rot', `${rot}deg`);
                coin.style.width = `${size}px`;
                coin.style.height = `${size}px`;

                // Emerge from behind the badge
                const startX = 50 + (Math.random() - 0.5) * 20;
                const startY = 46 + (Math.random() - 0.5) * 16;
                coin.style.left = `${startX}%`;
                coin.style.top = `${startY}%`;

                layer.appendChild(coin);
                setTimeout(() => coin.remove(), 1600);
            }
        }

        // ========================================================
        // FOLLOWER PARTICLES & BURSTS (User Silhouette + Sparkles + Hearts)
        // ========================================================
        function emitFollowerParticles(count = 6) {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const layer = document.getElementById('particlesLayer');
            if (!layer) return;

            const userPlusSvg = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="#FFD35A" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="9" cy="7" r="4" fill="#FF4D8D" stroke="#FFE27A" stroke-width="1.8"/>
                <line x1="19" y1="8" x2="19" y2="14" stroke="#FFF9C4" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="22" y1="11" x2="16" y2="11" stroke="#FFF9C4" stroke-width="2.5" stroke-linecap="round"/>
            </svg>`;

            const sparkles = ['✦', '✨', '⭐', '★'];
            const hearts = ['💖', '💕'];

            for (let i = 0; i < count; i++) {
                const p = document.createElement('span');
                p.className = 'floating-follower-particle';

                // 50% user-plus, 35% sparkles, 15% cute pink hearts
                const rand = Math.random();
                if (rand < 0.50) {
                    p.innerHTML = userPlusSvg;
                } else if (rand < 0.85) {
                    p.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
                    p.style.color = '#FFF9C4';
                    p.style.fontSize = `${Math.floor(Math.random() * 8 + 14)}px`;
                    p.style.textShadow = '0 0 8px #FFD35A, 0 0 14px #FF9A1F';
                } else {
                    p.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    p.style.fontSize = `${Math.floor(Math.random() * 6 + 14)}px`;
                }

                const dx = (Math.random() - 0.5) * 100;
                const rot = (Math.random() - 0.5) * 60;
                const duration = 1.4 + Math.random() * 0.6;

                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--rot', `${rot}deg`);
                p.style.setProperty('--particle-duration', `${duration}s`);

                const startX = 50 + (Math.random() - 0.5) * 22;
                const startY = 44 + (Math.random() - 0.5) * 16;
                p.style.left = `${startX}%`;
                p.style.top = `${startY}%`;

                layer.appendChild(p);
                setTimeout(() => p.remove(), duration * 1000 + 100);
            }
        }

        // ========================================================
        // HEART PARTICLES BURST (Heart Me Mode)
        // ========================================================
        function emitHeartParticles(count = 5) {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const layer = document.getElementById('particlesLayer');
            if (!layer) return;

            const icons = ['💖', '💕', '❤️', '✨', '🌸', '⭐'];
            for (let i = 0; i < count; i++) {
                const p = document.createElement('span');
                p.className = 'floating-heart-particle';
                p.textContent = icons[Math.floor(Math.random() * icons.length)];

                const dx = (Math.random() - 0.5) * 100;
                const rot = (Math.random() - 0.5) * 60;
                const duration = 1.4 + Math.random() * 0.6;
                const size = Math.floor(Math.random() * 8 + 16);

                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--rot', `${rot}deg`);
                p.style.setProperty('--particle-duration', `${duration}s`);
                p.style.fontSize = `${size}px`;

                const startX = 50 + (Math.random() - 0.5) * 24;
                const startY = 44 + (Math.random() - 0.5) * 16;
                p.style.left = `${startX}%`;
                p.style.top = `${startY}%`;

                layer.appendChild(p);
                setTimeout(() => p.remove(), duration * 1000 + 100);
            }
        }

        function showFloatingAmount(amount) {
            if (!amount || amount <= 0) return;
            const counterRow = document.getElementById('counterRow');
            if (!counterRow) return;

            const badge = document.createElement('div');
            badge.className = 'floating-amount-badge';
            badge.textContent = `+${amount.toLocaleString()}`;
            counterRow.appendChild(badge);
            setTimeout(() => badge.remove(), 1400);
        }

        // Milestone Shockwave Effect (expanding gold ring + quick title shimmer)
        function triggerMilestoneEffect() {
            const wrapper = document.getElementById('heartmeWrapper');
            if (wrapper) {
                const ring = document.createElement('div');
                ring.className = 'milestone-shockwave-ring';
                wrapper.appendChild(ring);
                setTimeout(() => ring.remove(), 800);
            }

            const titleEl = document.getElementById('goalLabel');
            if (titleEl) {
                titleEl.classList.remove('quick-shimmer');
                void titleEl.offsetWidth;
                titleEl.classList.add('quick-shimmer');
                setTimeout(() => titleEl.classList.remove('quick-shimmer'), 1100);
            }
        }

        // ========================================================
        // GOAL REACHED CELEBRATION: onGoalReached()
        // ========================================================
        let isCompletedCelebrated = false;
        let titleSwapTimeout = null;

        function onGoalReached() {
            // 1. Victory spin-pop on coin badge
            const mascotImg = document.getElementById('heartmeImg');
            if (mascotImg) {
                mascotImg.classList.remove('victory-spin-pop');
                void mascotImg.offsetWidth;
                mascotImg.classList.add('victory-spin-pop');
                setTimeout(() => mascotImg.classList.remove('victory-spin-pop'), 1300);
            }

            // 2. Title swaps to "GOAL REACHED!" with bounce-in, returns after 5s
            const titleEl = document.getElementById('goalLabel');
            if (titleEl) {
                titleEl.classList.remove('anim-bounce-in');
                void titleEl.offsetWidth;
                titleEl.classList.add('anim-bounce-in');
                titleEl.textContent = 'GOAL REACHED!';
                if (titleSwapTimeout) clearTimeout(titleSwapTimeout);
                titleSwapTimeout = setTimeout(() => {
                    titleEl.classList.remove('anim-bounce-in');
                    titleEl.textContent = displayLabel.toUpperCase();
                    titleSwapTimeout = null;
                }, 5000);
            }

            // 3. Progress bar turns bright gold with pulsing glow
            const fillEl = document.getElementById('progressFill');
            if (fillEl) fillEl.classList.add('goal-gold-mode');

            // 4. Celebration banner & 3-second coin shower + radial burst
            const celebrationBanner = document.getElementById('goalCelebrationBanner');
            if (celebrationBanner) celebrationBanner.classList.add('show');

            if (!isCompletedCelebrated) {
                isCompletedCelebrated = true;
                playVictoryChime();
                startCelebrationConfetti(3000);
            }
        }

        // ========================================================
        // CENTRAL COINS UPDATE HANDLER: onCoinsUpdate(prev, next, amount)
        // ========================================================
        let displayedCount = currentVal;
        let counterAnimationRaf = null;

        function onCoinsUpdate(prevVal, nextVal, amountAdded) {
            if (prevVal === nextVal) return;

            const isIncrement = nextVal > prevVal;
            if (!isIncrement) {
                // Direct reset or decrease
                displayedCount = nextVal;
                document.getElementById('currentPoints').textContent = nextVal.toLocaleString();
                syncPercentage(nextVal);
                const pct = Math.min(100, Math.max(0, (nextVal / targetVal) * 100));
                document.getElementById('progressFill').style.width = pct + '%';
                updateTicks(0, pct);
                return;
            }

            const diff = amountAdded || (nextVal - prevVal);

            // 1. Milestones Check (25% / 50% / 75%)
            const oldPct = (prevVal / targetVal) * 100;
            const newPct = (nextVal / targetVal) * 100;
            [25, 50, 75].forEach(m => {
                if (oldPct < m && newPct >= m) {
                    triggerMilestoneEffect();
                }
            });

            // 2. Mascot Squish & Flash Glow
            if (isCoinGoal) {
                const coinSpin = document.getElementById('coinSpinDisc');
                if (coinSpin) {
                    coinSpin.classList.remove('coin-bounce-spin');
                    void coinSpin.offsetWidth;
                    coinSpin.classList.add('coin-bounce-spin');
                    setTimeout(() => coinSpin.classList.remove('coin-bounce-spin'), 750);
                }
            } else {
                const mascotImg = document.getElementById('heartmeImg');
                if (mascotImg) {
                    mascotImg.classList.remove('anim-squish');
                    void mascotImg.offsetWidth;
                    mascotImg.classList.add('anim-squish');
                    setTimeout(() => mascotImg.classList.remove('anim-squish'), 600);
                }
            }

            const glowEl = document.getElementById('mascotGlowAura');
            if (glowEl) {
                glowEl.classList.remove('flash-glow');
                void glowEl.offsetWidth;
                glowEl.classList.add('flash-glow');
                setTimeout(() => glowEl.classList.remove('flash-glow'), 600);
            }

            const ringEl = document.getElementById('mascotBadgeRing');
            if (ringEl) {
                ringEl.classList.remove('ring-flash');
                void ringEl.offsetWidth;
                ringEl.classList.add('ring-flash');
                setTimeout(() => ringEl.classList.remove('ring-flash'), 500);
            }

            // 3. Mini Coins / Followers / Hearts Particles Burst & Floating +Amount
            if (isCoinGoal) {
                emitMiniCoinsBurst(diff);
                showFloatingAmount(diff);
            } else if (isFollowerGoal) {
                emitFollowerParticles(Math.min(8, Math.max(5, diff * 3)));
                showFloatingAmount(diff);
            } else if (isHeartGoal) {
                emitHeartParticles(Math.min(8, Math.max(4, diff * 2)));
                showFloatingAmount(diff);
            }

            // 4. Counter: smooth count up (easeOutCubic, ~700ms) with pop & white-gold glow
            animateCounterRoll(displayedCount, nextVal, 700);

            // 5. Progress bar: fill animates to new width (0.8s) + spark tip + pill bounce
            const fillEl = document.getElementById('progressFill');
            if (fillEl) fillEl.style.width = newPct + '%';

            const pill = document.getElementById('pctBadge');
            if (pill) {
                pill.classList.remove('anim-pill-bounce');
                void pill.offsetWidth;
                pill.classList.add('anim-pill-bounce');
            }

            // 6. Segment ticks: flash newly reached tick
            updateTicks(oldPct, newPct);

            // 7. Goal Reached Celebration
            if (nextVal >= targetVal || newPct >= 100) {
                onGoalReached();
            } else {
                const fillEl = document.getElementById('progressFill');
                if (fillEl) fillEl.classList.remove('goal-gold-mode');
                const banner = document.getElementById('goalCelebrationBanner');
                if (banner) banner.classList.remove('show');
                isCompletedCelebrated = false;
            }
        }

        // Smooth Counter Roll (easeOutCubic, ~700ms) with commas
        function animateCounterRoll(startVal, endVal, duration = 700) {
            const numEl = document.getElementById('currentPoints');
            if (!numEl) return;

            numEl.classList.remove('anim-pts-pop');
            void numEl.offsetWidth;
            numEl.classList.add('anim-pts-pop');

            if (counterAnimationRaf) {
                cancelAnimationFrame(counterAnimationRaf);
                counterAnimationRaf = null;
            }

            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || startVal === endVal) {
                displayedCount = endVal;
                numEl.textContent = endVal.toLocaleString();
                syncPercentage(endVal);
                return;
            }

            const startTime = performance.now();
            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const ease = 1 - Math.pow(1 - progress, 3);
                const currentInterp = Math.round(startVal + (endVal - startVal) * ease);

                displayedCount = currentInterp;
                numEl.textContent = currentInterp.toLocaleString();
                syncPercentage(currentInterp);

                if (progress < 1) {
                    counterAnimationRaf = requestAnimationFrame(step);
                } else {
                    displayedCount = endVal;
                    numEl.textContent = endVal.toLocaleString();
                    syncPercentage(endVal);
                    counterAnimationRaf = null;
                }
            }
            counterAnimationRaf = requestAnimationFrame(step);
        }

        function syncPercentage(val) {
            const pct = Math.min(100, Math.max(0, (val / targetVal) * 100));
            const pctBadge = document.getElementById('pctBadge');
            if (pctBadge) {
                const formattedPct = pct >= 100 ? '100%' : (pct.toFixed(pct < 10 && pct > 0 ? 1 : 0) + '%');
                pctBadge.textContent = formattedPct;
            }
        }

        function updateTicks(oldPct, newPct) {
            const dots = document.querySelectorAll('.game-tick');
            const oldActive = Math.round((oldPct / 100) * dots.length);
            const newActive = Math.round((newPct / 100) * dots.length);

            dots.forEach((dot, idx) => {
                if (idx < newActive) {
                    if (!dot.classList.contains('active')) {
                        dot.classList.add('active');
                        dot.classList.remove('just-reached');
                        void dot.offsetWidth;
                        dot.classList.add('just-reached');
                    }
                } else {
                    dot.classList.remove('active', 'just-reached');
                }
            });
        }

        // Render Initial State
        document.getElementById('targetPoints').textContent = targetVal.toLocaleString();
        document.getElementById('currentPoints').textContent = currentVal.toLocaleString();
        const initialPct = Math.min(100, Math.max(0, (currentVal / targetVal) * 100));
        document.getElementById('progressFill').style.width = initialPct + '%';
        syncPercentage(currentVal);
        updateTicks(0, initialPct);

        // ========================================================
        // GLOBAL CONSOLE TEST HELPERS (window.testCoins)
        // ========================================================
        window.onCoinsUpdate = onCoinsUpdate;
        window.onGoalReached = onGoalReached;

        window.testCoins = function(amount = 100) {
            const prev = currentVal;
            currentVal += amount;
            sessionStorage.setItem('goal_current_' + goalType, currentVal);
            onCoinsUpdate(prev, currentVal, amount);
            console.log(`%c[TEST] Coins +${amount}! Total: ${currentVal.toLocaleString()} / ${targetVal.toLocaleString()}`, 'color: #FFB020; font-weight: bold;');
        };

        window.testGoalReached = function() {
            const prev = currentVal;
            const diff = targetVal - prev;
            currentVal = targetVal;
            sessionStorage.setItem('goal_current_' + goalType, currentVal);
            onCoinsUpdate(prev, currentVal, diff > 0 ? diff : 100);
            onGoalReached();
            console.log(`%c[TEST] Coin Goal Reached! (${currentVal.toLocaleString()}/${targetVal.toLocaleString()})`, 'color: #FFE27A; font-weight: bold;');
        };

        // Dedicated Follower & Heart test helpers
        window.testFollow = function(count = 1) {
            const prev = currentVal;
            currentVal += count;
            sessionStorage.setItem('goal_current_' + goalType, currentVal);
            onCoinsUpdate(prev, currentVal, count);
            console.log(`%c[TEST] Followers +${count}! Total: ${currentVal.toLocaleString()} / ${targetVal.toLocaleString()}`, 'color: #38bdf8; font-weight: bold;');
        };

        window.testHearts = function(count = 1) {
            const prev = currentVal;
            currentVal += count;
            sessionStorage.setItem('goal_current_' + goalType, currentVal);
            onCoinsUpdate(prev, currentVal, count);
            console.log(`%c[TEST] Hearts +${count}! Total: ${currentVal.toLocaleString()} / ${targetVal.toLocaleString()}`, 'color: #FF4D8D; font-weight: bold;');
        };

        // Auto-run test trigger if ?test=1 in query
        if (params.get('test') || params.get('testFollow')) {
            setTimeout(() => {
                if (isCoinGoal) window.testCoins(100);
                else if (isFollowerGoal) window.testFollow(1);
                else window.testHearts(1);
            }, 350);
        }

        // Central Event Dispatcher (Unifying WebSocket, BroadcastChannel & Polling)
        function handleIncomingEvent(ev) {
            if (!ev) return;
            if (ev.type === 'reset' || ev.type === 'goal_reset' || ev.action === 'reset') {
                handleGoalResetEvent();
                return;
            }
            if (ev.isTest || ev.noOverlayCount || ev.username === 'RENEarn' || ev.username === 'Tester') return;

            let added = 0;
            if (isCoinGoal && (ev.type === 'gift' || ev.type === 'jar_drop' || ev.event === 'gift')) {
                added = (ev.coins || ev.diamondCount || 1);
            } else if (isFollowerGoal && (ev.type === 'follow' || ev.event === 'follow')) {
                added = 1;
            } else if (isHeartGoal && (ev.type === 'gift' || ev.type === 'jar_drop' || ev.event === 'gift')) {
                const gName = (ev.giftName || '').toLowerCase();
                if (gName.includes('heart') || ev.giftId == 7934 || ev.diamondCount == 1) {
                    added = (ev.count || ev.repeatCount || 1);
                }
            } else if (goalType.includes('like') && (ev.type === 'like' || ev.event === 'like')) {
                added = (ev.likes || ev.count || 1);
            }

            if (added > 0) {
                const prev = currentVal;
                currentVal += added;
                sessionStorage.setItem('goal_current_' + goalType, currentVal);
                onCoinsUpdate(prev, currentVal, added);
            }
        }

        function handleGoalResetEvent() {
            const prev = currentVal;
            currentVal = 0;
            sessionStorage.setItem('goal_current_' + goalType, '0');
            onCoinsUpdate(prev, 0, 0);
        }

        // 1. HTTP Polling via /api/events
        let lastEventTimestamp = Date.now() - 5000;
        setInterval(async () => {
            try {
                const res = await fetch(`/api/events?since=${lastEventTimestamp}&t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.serverTime) lastEventTimestamp = data.serverTime;
                    if (data.events && Array.isArray(data.events)) {
                        for (const ev of data.events) {
                            handleIncomingEvent(ev);
                        }
                    }
                }
            } catch (e) {}
        }, 350);

        // 2. BroadcastChannel Listeners
        try {
            const bc = new BroadcastChannel('renearn_overlay_events');
            bc.onmessage = (e) => {
                if (e.data) handleIncomingEvent(e.data);
            };
        } catch (e) {}

        try {
            const bcLead = new BroadcastChannel('renearn_leaderboard_events');
            bcLead.onmessage = (e) => {
                if (e.data) handleIncomingEvent(e.data);
            };
        } catch (e) {}

        // 3. window message listener
        window.addEventListener('message', (e) => {
            if (e.data) handleIncomingEvent(e.data);
        });

        // 4. WebSocket Live Stream Bridge
        function initGoalWebSocket() {
            const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsHost = window.location.host || '127.0.0.1:8080';
            const wsUrl = params.get('ws') || `${wsProto}//${wsHost}/ws`;

            let ws = null;
            let reconnectTimer = null;

            function connect() {
                try {
                    ws = new WebSocket(wsUrl);
                    ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            handleIncomingEvent(data);
                        } catch (e) {}
                    };
                    ws.onclose = () => {
                        clearTimeout(reconnectTimer);
                        reconnectTimer = setTimeout(connect, 3000);
                    };
                    ws.onerror = () => {
                        try { ws.close(); } catch(e) {}
                    };
                } catch (e) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connect, 5000);
                }
            }
            connect();
        }
        initGoalWebSocket();
    </script>
