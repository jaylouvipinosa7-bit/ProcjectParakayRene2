<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvZ Fusion - Win Fraction & Trophy Overlay</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --win-scale: 1;
            --color-neg: #ff007f;
            --color-pos: #10b981;
            --color-zero: #38bdf8;
            --color-target: #ffffff;
            --color-divider: #ffffff;
            --trophy-opacity: 0.45;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* OBS TRANSPARENT BACKGROUND */
        html, body {
            background: transparent !important;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 24px;
        }

        #overlayContainer {
            transform: scale(var(--win-scale));
            transform-origin: top left;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        #floatingDeltaLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* ================= 1. WIN FRACTION TROPHY BOX (BASE) ================= */
        .trophy-fraction-card {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, box-shadow 0.25s;
        }

        .trophy-fraction-card.pop-anim {
            animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .trophy-bg-graphic {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 175px;
            height: 175px;
            pointer-events: none;
            opacity: var(--trophy-opacity);
            z-index: 1;
            transition: opacity 0.3s ease, filter 0.3s ease;
        }

        .trophy-bg-graphic img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .fraction-content-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .fraction-numerator {
            font-family: 'Outfit', sans-serif;
            font-size: 64px;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -1.5px;
            text-align: center;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .fraction-numerator.is-negative {
            color: var(--color-neg);
            text-shadow: 0 0 18px var(--color-neg), 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .fraction-numerator.is-positive {
            color: var(--color-pos);
            text-shadow: 0 0 18px var(--color-pos), 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .fraction-numerator.is-zero {
            color: var(--color-zero);
            text-shadow: 0 0 14px var(--color-zero), 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .fraction-divider-bar {
            width: 120px;
            height: 4.5px;
            background: var(--color-divider);
            border-radius: 4px;
            margin: 4px 0 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .fraction-denominator {
            font-family: 'Outfit', sans-serif;
            font-size: 64px;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -1.5px;
            color: var(--color-target);
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* ------------------ THEME 1: CYBER NEON GLASS (PHOTO 1 MATCH) ------------------ */
        .theme-cyber {
            background: rgba(13, 17, 24, 0.94);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85), inset 0 0 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .theme-cyber .trophy-bg-graphic {
            filter: drop-shadow(0 4px 14px rgba(245, 158, 11, 0.35));
        }

        /* ------------------ THEME 2: GOLDEN CHAMPION (ROYAL PRESTIGE) ------------------ */
        .theme-champion {
            background: linear-gradient(135deg, rgba(24, 18, 8, 0.96) 0%, rgba(12, 11, 14, 0.96) 100%);
            border: 2px solid #f59e0b;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(245, 158, 11, 0.35), inset 0 0 20px rgba(245, 158, 11, 0.18);
            backdrop-filter: blur(14px);
        }
        .theme-champion .trophy-bg-graphic {
            filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.6));
            opacity: 0.55;
        }
        .theme-champion .fraction-divider-bar {
            background: linear-gradient(90deg, #b45309, #fde047, #b45309);
            box-shadow: 0 0 12px #f59e0b;
            height: 5px;
        }
        .theme-champion .fraction-denominator {
            color: #fef3c7;
            text-shadow: 0 0 12px rgba(254, 240, 138, 0.6);
        }

        /* ------------------ THEME 3: EMERALD FUSION (PVZ PLANT ENERGY) ------------------ */
        .theme-emerald {
            background: linear-gradient(145deg, rgba(6, 32, 20, 0.96) 0%, rgba(3, 16, 10, 0.96) 100%);
            border: 2px solid #10b981;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(16, 185, 129, 0.4), inset 0 0 25px rgba(6, 78, 59, 0.45);
            backdrop-filter: blur(14px);
        }
        .theme-emerald .trophy-bg-graphic {
            filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.55));
            opacity: 0.5;
        }
        .theme-emerald .fraction-divider-bar {
            background: #6ee7b7;
            box-shadow: 0 0 14px #10b981;
            height: 5px;
        }
        .theme-emerald .fraction-denominator {
            color: #fbbf24;
            text-shadow: 0 0 14px rgba(251, 191, 36, 0.6);
        }

        /* ------------------ THEME 4: ESPORTS TECH HUD (HEX SCI-FI) ------------------ */
        .theme-esports {
            background: rgba(8, 14, 26, 0.96);
            border: 2px solid #06b6d4;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 35px rgba(6, 182, 212, 0.4), inset 0 0 20px rgba(6, 182, 212, 0.2);
            clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
            backdrop-filter: blur(14px);
        }
        .theme-esports .fraction-numerator, 
        .theme-esports .fraction-denominator {
            font-family: 'JetBrains Mono', 'Outfit', monospace;
            letter-spacing: -2px;
        }
        .theme-esports .trophy-bg-graphic {
            filter: drop-shadow(0 0 18px rgba(6, 182, 212, 0.6));
            opacity: 0.45;
        }
        .theme-esports .fraction-divider-bar {
            background: #22d3ee;
            box-shadow: 0 0 12px #06b6d4;
            width: 130px;
            height: 4px;
        }

        /* ------------------ THEME 5: RUBY BLOOD (CRIMSON INTENSE) ------------------ */
        .theme-ruby {
            background: linear-gradient(145deg, rgba(38, 6, 14, 0.96) 0%, rgba(18, 4, 8, 0.96) 100%);
            border: 2px solid #f43f5e;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(244, 63, 94, 0.45), inset 0 0 20px rgba(136, 19, 55, 0.4);
            backdrop-filter: blur(14px);
        }
        .theme-ruby .trophy-bg-graphic {
            filter: drop-shadow(0 0 18px rgba(244, 63, 94, 0.5));
            opacity: 0.5;
        }
        .theme-ruby .fraction-divider-bar {
            background: #fda4af;
            box-shadow: 0 0 12px #f43f5e;
            height: 4.5px;
        }

        /* ------------------ THEME 6: MINIMAL TRANSPARENT ------------------ */
        .theme-minimal {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
        }
        .theme-minimal .trophy-bg-graphic {
            opacity: 0.35;
        }

        /* SOLID BLACK BACKGROUND OVERRIDE */
        .bg-black {
            background: #080a0f !important;
            backdrop-filter: none !important;
        }

        /* FULLY TRANSPARENT BACKGROUND OVERRIDE */
        .bg-transparent {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
        }

        /* ================= 2. COMPACT BADGE PILL MODE (IMAGE 2) ================= */
        .win-badge-pill {
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(18, 21, 31, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.14);
            border-radius: 9999px;
            padding: 8px 22px 8px 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, box-shadow 0.25s;
            position: relative;
        }

        .win-badge-pill.pop-anim {
            animation: badgePop 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes badgePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.12); border-color: #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); }
            100% { transform: scale(1); }
        }

        .trophy-icon-badge {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 3px 6px rgba(245, 158, 11, 0.6));
            animation: trophyWiggle 3.5s ease-in-out infinite;
        }

        @keyframes trophyWiggle {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-8deg); }
            40% { transform: rotate(8deg); }
            60% { transform: rotate(-4deg); }
            80% { transform: rotate(4deg); }
        }

        .win-label-text {
            font-size: 20px;
            font-weight: 800;
            color: #f0f6fc;
            letter-spacing: -0.2px;
        }

        .score-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 36, 51, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 2px 14px;
            min-width: 44px;
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 900;
            transition: color 0.3s ease, transform 0.2s ease, text-shadow 0.3s ease;
        }

        .score-box.is-negative {
            color: var(--color-neg);
            text-shadow: 0 0 14px var(--color-neg);
            border-color: rgba(255, 0, 127, 0.3);
        }

        .score-box.is-positive {
            color: var(--color-pos);
            text-shadow: 0 0 14px var(--color-pos);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .score-box.is-zero {
            color: var(--color-zero);
            text-shadow: 0 0 10px var(--color-zero);
        }

        .divider-slash {
            font-size: 22px;
            font-weight: 800;
            color: #8b949e;
            margin: 0 -2px;
        }

        .target-goal {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        /* ================= 3. DUAL CARDS MODE ================= */
        .win-cards-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            background: rgba(13, 17, 23, 0.94);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85);
            max-width: 380px;
            backdrop-filter: blur(14px);
        }

        .cards-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 800;
            color: #f0f6fc;
        }

        .cards-header-trophy {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .cards-dual-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .win-card-box {
            border-radius: 12px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .win-card-box.pop-anim {
            animation: cardBoxPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardBoxPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .card-lose {
            background: linear-gradient(180deg, rgba(92, 18, 28, 0.45) 0%, rgba(20, 24, 33, 0.95) 100%);
            border: 1.5px solid var(--color-neg, #ff007f);
            box-shadow: 0 4px 18px rgba(255, 0, 127, 0.25);
        }

        .card-win {
            background: linear-gradient(180deg, rgba(16, 85, 48, 0.45) 0%, rgba(20, 24, 33, 0.95) 100%);
            border: 1.5px solid var(--color-pos, #10b981);
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.25);
        }

        .card-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .card-lose .card-tag { color: var(--color-neg, #ff007f); text-shadow: 0 0 10px var(--color-neg, #ff007f); }
        .card-win .card-tag { color: var(--color-pos, #10b981); text-shadow: 0 0 10px var(--color-pos, #10b981); }

        .card-big-number {
            font-family: 'Outfit', sans-serif;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            margin: 6px 0;
            letter-spacing: -1px;
        }

        .card-lose .card-big-number {
            color: var(--color-neg, #ff007f);
            text-shadow: 0 0 16px var(--color-neg, #ff007f);
        }

        .card-win .card-big-number {
            color: var(--color-pos, #10b981);
            text-shadow: 0 0 16px var(--color-pos, #10b981);
        }

        /* VIEW SWITCHING CLASSES */
        body.mode-fraction .trophy-fraction-card { display: flex; }
        body.mode-fraction .win-badge-pill { display: none; }
        body.mode-fraction .win-cards-container { display: none; }

        body.mode-badge .trophy-fraction-card { display: none; }
        body.mode-badge .win-badge-pill { display: inline-flex; }
        body.mode-badge .win-cards-container { display: none; }

        body.mode-cards .trophy-fraction-card { display: none; }
        body.mode-cards .win-badge-pill { display: none; }
        body.mode-cards .win-cards-container { display: flex; }

        /* FLOATING DELTA CHIPS */
        .delta-chip {
            position: absolute;
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 900;
            padding: 4px 14px;
            border-radius: 9999px;
            animation: floatUpFade 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: none;
            z-index: 1000;
        }

        .delta-chip.plus {
            color: #10b981;
            background: rgba(16, 185, 129, 0.25);
            border: 1.5px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .delta-chip.minus {
            color: #ff007f;
            background: rgba(255, 0, 127, 0.25);
            border: 1.5px solid #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }

        @keyframes floatUpFade {
            0% { transform: translateY(0) scale(0.85); opacity: 0; }
            20% { transform: translateY(-15px) scale(1.15); opacity: 1; }
            100% { transform: translateY(-75px) scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="mode-fraction">

    <div id="overlayContainer">
        <!-- 1. WIN FRACTION TROPHY BOX (PHOTO 1 MATCH) -->
        <div id="trophyFractionCard" class="trophy-fraction-card theme-cyber">
            <div id="trophyBgGraphic" class="trophy-bg-graphic">
                <img id="trophyMainImg" src="images/trophy_cup.svg" alt="Trophy" onerror="this.src='images/trophy_diamond.svg'">
            </div>
            <div class="fraction-content-wrap">
                <div id="fractionScore" class="fraction-numerator is-negative">-5240</div>
                <div class="fraction-divider-bar"></div>
                <div id="fractionTarget" class="fraction-denominator">5</div>
            </div>
        </div>

        <!-- 2. COMPACT WIN BADGE PILL (PHOTO 2 MATCH) -->
        <div id="winBadgePill" class="win-badge-pill">
            <img id="badgeTrophyImg" class="trophy-icon-badge" src="images/trophy_cup.svg" alt="Trophy">
            <span class="win-label-text" id="winLabelText">Win</span>
            <span class="score-box is-negative" id="scoreValue">-5240</span>
            <span class="divider-slash">/</span>
            <span class="target-goal" id="targetValue">5</span>
        </div>

        <!-- 3. DUAL CARDS VIEW -->
        <div id="winCardsContainer" class="win-cards-container">
            <div class="cards-header">
                <img id="cardsTrophyImg" class="cards-header-trophy" src="images/trophy_cup.svg" alt="Trophy">
                <span id="cardsTitle">Win Goal System</span>
            </div>
            <div class="cards-dual-row">
                <div class="win-card-box card-lose">
                    <div class="card-tag">🌿 LOSE 🌿</div>
                    <div class="card-big-number" id="cardLoseCount">5403</div>
                </div>
                <div class="win-card-box card-win">
                    <div class="card-tag">🌿 WIN 🌿</div>
                    <div class="card-big-number" id="cardWinCount">163</div>
                </div>
            </div>
        </div>
    </div>

    <div id="floatingDeltaLayer"></div>

    <script>
        let currentScore = -5240;
        let currentTarget = 5;
        let currentWins = 163;
        let currentLosses = 5403;
        let currentStyle = 'cyber';
        let currentTrophy = 'cup';
        let currentBg = 'glass';
        let lastServerTime = 0;

        // Parse query params for overrides
        const urlParams = new URLSearchParams(window.location.search);

        const trophyMap = {
            'cup': 'images/trophy_cup.svg',
            'gold': 'images/trophy_cup.svg',
            'silver': 'images/trophy_silver.svg',
            'bronze': 'images/trophy_bronze.svg',
            'diamond': 'images/trophy_diamond.svg',
            'crown': 'images/trophy_crown.svg',
            'laurel': 'images/trophy_laurel.svg',
            'fire': 'images/trophy_fire.svg',
            'emerald': 'images/trophy_emerald.svg',
            'pvz_sun': 'images/trophy_pvz_sun.svg',
            'star': 'images/trophy_star.svg',
            'skull': 'images/trophy_skull.svg',
            'stream_trophy': 'images/game-icons/stream/trophy.webp'
        };

        function applyTrophyIcon(trophy) {
            currentTrophy = trophy || 'cup';
            const bgGraphic = document.getElementById('trophyBgGraphic');
            const mainImg = document.getElementById('trophyMainImg');
            const badgeImg = document.getElementById('badgeTrophyImg');
            const cardsImg = document.getElementById('cardsTrophyImg');

            if (currentTrophy === 'none') {
                if (bgGraphic) bgGraphic.style.display = 'none';
                if (badgeImg) badgeImg.style.display = 'none';
                return;
            }

            if (bgGraphic) bgGraphic.style.display = 'block';
            if (badgeImg) badgeImg.style.display = 'block';

            const src = trophyMap[currentTrophy] || trophyMap['cup'];
            if (mainImg) mainImg.src = src;
            if (badgeImg) badgeImg.src = src;
            if (cardsImg) cardsImg.src = src;
        }

        function applyTheme(style, bgTheme) {
            const card = document.getElementById('trophyFractionCard');
            if (!card) return;

            // Remove previous theme classes
            card.classList.remove(
                'theme-cyber', 'theme-champion', 'theme-emerald', 
                'theme-esports', 'theme-ruby', 'theme-minimal',
                'bg-black', 'bg-transparent'
            );

            // Set mode vs style
            if (style === 'badge' || style === 'pill') {
                document.body.className = 'mode-badge';
            } else if (style === 'cards' || style === 'dual') {
                document.body.className = 'mode-cards';
            } else {
                document.body.className = 'mode-fraction';
                const validThemes = ['cyber', 'champion', 'emerald', 'esports', 'ruby', 'minimal'];
                const selected = validThemes.includes(style) ? style : 'cyber';
                card.classList.add(`theme-${selected}`);
            }

            // Apply background override
            if (bgTheme === 'black') {
                card.classList.add('bg-black');
            } else if (bgTheme === 'transparent') {
                card.classList.add('bg-transparent');
            }
        }

        function applyColors(colorNeg, colorPos, colorZero, scale) {
            const root = document.documentElement;
            if (colorNeg) root.style.setProperty('--color-neg', colorNeg);
            if (colorPos) root.style.setProperty('--color-pos', colorPos);
            if (colorZero) root.style.setProperty('--color-zero', colorZero);
            if (scale) root.style.setProperty('--win-scale', scale);
        }

        function updateUI(data, delta = null) {
            if (!data) return;

            currentScore = Number(data.score ?? currentScore);
            currentTarget = Number(data.target ?? currentTarget);
            currentWins = Number(data.wins ?? currentWins);
            currentLosses = Number(data.losses ?? currentLosses);

            // Style & Theme updates
            const activeStyle = data.style || currentStyle || urlParams.get('style') || urlParams.get('mode') || 'fraction';
            currentStyle = activeStyle;
            const activeTrophy = data.trophyIcon || urlParams.get('trophy') || currentTrophy;
            const activeBg = data.bgTheme || urlParams.get('bg') || currentBg;
            const activeScale = data.scale || urlParams.get('scale') || 1.0;

            applyTheme(activeStyle, activeBg);
            applyTrophyIcon(activeTrophy);
            applyColors(data.colorNegative, data.colorPositive, data.colorZero, activeScale);

            // Update fraction score & target
            const fScore = document.getElementById('fractionScore');
            const fTarget = document.getElementById('fractionTarget');
            if (fScore) {
                fScore.textContent = currentScore;
                fScore.className = 'fraction-numerator';
                if (currentScore < 0) fScore.classList.add('is-negative');
                else if (currentScore > 0) fScore.classList.add('is-positive');
                else fScore.classList.add('is-zero');
            }
            if (fTarget) fTarget.textContent = currentTarget;

            // Update badge pill elements
            const scoreEl = document.getElementById('scoreValue');
            const targetEl = document.getElementById('targetValue');
            const labelEl = document.getElementById('winLabelText');
            if (scoreEl) {
                scoreEl.textContent = currentScore;
                scoreEl.className = 'score-box';
                if (currentScore < 0) scoreEl.classList.add('is-negative');
                else if (currentScore > 0) scoreEl.classList.add('is-positive');
                else scoreEl.classList.add('is-zero');
            }
            if (targetEl) targetEl.textContent = currentTarget;
            if (labelEl && data.label) labelEl.textContent = data.label;

            // Update dual cards with pop animations
            const prevL = currentLosses;
            const prevW = currentWins;
            const loseEl = document.getElementById('cardLoseCount');
            const displayLose = (currentLosses && currentLosses !== 0) ? currentLosses : (currentScore < 0 ? Math.abs(currentScore) : 0);
            const displayWin = (currentWins && currentWins !== 0) ? currentWins : currentTarget;
            if (loseEl) loseEl.textContent = displayLose;
            if (winEl) winEl.textContent = displayWin;

            if (currentLosses > prevL) {
                const b = loseEl?.closest('.win-card-box');
                if (b) { b.classList.remove('pop-anim'); void b.offsetWidth; b.classList.add('pop-anim'); }
            }
            if (currentWins > prevW) {
                const b = winEl?.closest('.win-card-box');
                if (b) { b.classList.remove('pop-anim'); void b.offsetWidth; b.classList.add('pop-anim'); }
            }

            // Animate card pop
            const fCard = document.getElementById('trophyFractionCard');
            if (fCard) {
                fCard.classList.remove('pop-anim');
                void fCard.offsetWidth;
                fCard.classList.add('pop-anim');
            }

            // Spawn floating delta chip if score adjusted
            if (delta !== null && delta !== 0) {
                spawnDeltaChip(delta);
            }
        }

        function spawnDeltaChip(delta) {
            const layer = document.getElementById('floatingDeltaLayer');
            if (!layer) return;

            const chip = document.createElement('div');
            chip.className = `delta-chip ${delta > 0 ? 'plus' : 'minus'}`;
            chip.textContent = delta > 0 ? `+${delta}` : `${delta}`;

            chip.style.left = '70px';
            chip.style.top = '120px';

            layer.appendChild(chip);
            setTimeout(() => chip.remove(), 1600);
        }

        async function fetchInitialState() {
            try {
                const res = await fetch('/api/win-widget?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    updateUI(data);
                }
            } catch (err) {}
        }

        // Live BroadcastChannel for real-time instant cross-window sync
        try {
            const bc = new BroadcastChannel('renearn_overlay_events');
            bc.onmessage = (e) => {
                if (e.data && e.data.type === 'win_widget_update') {
                    updateUI(e.data, e.data.delta);
                }
            };
        } catch (e) {}

        // Live SSE / Polling for instant updates from dashboard and spinner spins
        function startEventStream() {
            setInterval(async () => {
                try {
                    const res = await fetch(`/api/events?since=${lastServerTime}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.serverTime) lastServerTime = data.serverTime;

                    if (Array.isArray(data.events)) {
                        for (const ev of data.events) {
                            if (ev.type === 'win_widget_update') {
                                updateUI(ev, ev.delta);
                            }
                        }
                    }
                } catch (err) {}
            }, 100);
        }

        // Hotkeys directly supported in overlay as well
        let lastOverlayHotkeyTime = 0;
        let lastOverlayHotkeyAction = '';

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const isMinus = e.code === 'Minus' || e.code === 'NumpadSubtract' || e.key === '-' || e.key === '_' || e.keyCode === 189 || e.keyCode === 109;
            const isEqualOrPlus = e.code === 'Equal' || e.code === 'NumpadAdd' || e.key === '=' || e.key === '+' || e.keyCode === 187 || e.keyCode === 107;
            const isBracketLeft = e.code === 'BracketLeft' || e.key === '[' || e.keyCode === 219;
            const isBracketRight = e.code === 'BracketRight' || e.key === ']' || e.keyCode === 221;

            const now = Date.now();

            if ((e.altKey && isMinus) || isBracketLeft) {
                e.preventDefault();
                e.stopPropagation();
                if (lastOverlayHotkeyAction === 'lose_plus' && (now - lastOverlayHotkeyTime) < 350) return;
                lastOverlayHotkeyTime = now;
                lastOverlayHotkeyAction = 'lose_plus';

                fetch('/api/win-widget/adjust', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'lose_plus' })
                });
            } else if ((e.altKey && isEqualOrPlus) || isBracketRight) {
                e.preventDefault();
                e.stopPropagation();
                if (lastOverlayHotkeyAction === 'win_plus' && (now - lastOverlayHotkeyTime) < 350) return;
                lastOverlayHotkeyTime = now;
                lastOverlayHotkeyAction = 'win_plus';

                fetch('/api/win-widget/adjust', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'win_plus' })
                });
            }
        }, true);

        window.addEventListener('keyup', (e) => {
            if (e.key === 'Alt') e.preventDefault();
        }, true);

        window.addEventListener('DOMContentLoaded', () => {
            // Apply URL query params immediately on initial load
            const initialStyle = urlParams.get('style') || urlParams.get('mode') || 'cyber';
            const initialTrophy = urlParams.get('trophy') || 'cup';
            const initialBg = urlParams.get('bg') || 'glass';
            const initialScale = urlParams.get('scale') || 1.0;
            applyTheme(initialStyle, initialBg);
            applyTrophyIcon(initialTrophy);
            applyColors(urlParams.get('colorNeg'), urlParams.get('colorPos'), urlParams.get('colorZero'), initialScale);

            fetchInitialState();
            startEventStream();
        });
    </script>
</body>
</html>
