<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvZ Fusion - Win Fraction & Trophy Overlay</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* OBS TRANSPARENT BACKGROUND */
        html, body {
            background: transparent !important;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 24px;
        }

        #floatingDeltaLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
        }

        /* ================= 1. WIN FRACTION TROPHY BOX (EXACT MATCH TO PHOTO) ================= */
        .trophy-fraction-card {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            background: rgba(13, 17, 24, 0.94);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85), inset 0 0 25px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, box-shadow 0.25s;
        }

        .trophy-fraction-card.pop-anim {
            animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.12); border-color: #ff007f; box-shadow: 0 0 35px rgba(255, 0, 127, 0.5); }
            100% { transform: scale(1); }
        }

        .trophy-bg-graphic {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 175px;
            height: 175px;
            pointer-events: none;
            opacity: 0.42;
            z-index: 1;
            filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.3));
        }

        .trophy-bg-graphic img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .fraction-content-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .fraction-numerator {
            font-family: 'Outfit', sans-serif;
            font-size: 64px;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -1.5px;
            text-align: center;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .fraction-numerator.is-negative {
            color: #ff007f; /* Exact vibrant pink from user photo */
            text-shadow: 0 0 18px rgba(255, 0, 127, 0.75), 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .fraction-numerator.is-positive {
            color: #10b981;
            text-shadow: 0 0 18px rgba(16, 185, 129, 0.75), 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .fraction-numerator.is-zero {
            color: #38bdf8;
            text-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
        }

        .fraction-divider-bar {
            width: 120px;
            height: 4.5px;
            background: #f1f5f9;
            border-radius: 4px;
            margin: 4px 0 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .fraction-denominator {
            font-family: 'Outfit', sans-serif;
            font-size: 64px;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -1.5px;
            color: #ffffff;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* ================= 2. COMPACT BADGE PILL MODE (IMAGE 2) ================= */
        .win-badge-pill {
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(18, 21, 31, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            padding: 8px 22px 8px 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), 0 0 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, box-shadow 0.25s;
            position: relative;
        }

        .win-badge-pill.pop-anim {
            animation: badgePop 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes badgePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.15); border-color: #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); }
            100% { transform: scale(1); }
        }

        .trophy-icon {
            font-size: 26px;
            line-height: 1;
            filter: drop-shadow(0 3px 6px rgba(245, 158, 11, 0.6));
            animation: trophyWiggle 3s ease-in-out infinite;
        }

        @keyframes trophyWiggle {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-8deg); }
            40% { transform: rotate(8deg); }
            60% { transform: rotate(-4deg); }
            80% { transform: rotate(4deg); }
        }

        .win-label-text {
            font-size: 20px;
            font-weight: 800;
            color: #f0f6fc;
            letter-spacing: -0.2px;
        }

        .score-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 36, 51, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 2px 14px;
            min-width: 44px;
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 900;
            transition: color 0.3s ease, transform 0.2s ease, text-shadow 0.3s ease;
        }

        .score-box.is-negative {
            color: #ff007f;
            text-shadow: 0 0 14px rgba(255, 0, 127, 0.6);
            border-color: rgba(255, 0, 127, 0.3);
        }

        .score-box.is-positive {
            color: #10b981;
            text-shadow: 0 0 14px rgba(16, 185, 129, 0.6);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .score-box.is-zero {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .divider-slash {
            font-size: 22px;
            font-weight: 800;
            color: #8b949e;
            margin: 0 -2px;
        }

        .target-goal {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        /* ================= 3. DUAL CARDS MODE (IMAGE 3) ================= */
        .win-cards-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            background: rgba(13, 17, 23, 0.94);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
            max-width: 380px;
        }

        .cards-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 800;
            color: #f0f6fc;
        }

        .cards-dual-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .win-card-box {
            border-radius: 12px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-lose {
            background: linear-gradient(180deg, rgba(92, 18, 28, 0.4) 0%, rgba(20, 24, 33, 0.9) 100%);
            border: 1.5px solid #671e27;
        }

        .card-win {
            background: linear-gradient(180deg, rgba(16, 85, 48, 0.4) 0%, rgba(20, 24, 33, 0.9) 100%);
            border: 1.5px solid #165b38;
        }

        .card-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .card-lose .card-tag { color: #ef4444; }
        .card-win .card-tag { color: #10b981; }

        .card-big-number {
            font-family: 'Outfit', sans-serif;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            margin: 6px 0;
            letter-spacing: -1px;
        }

        /* VIEW SWITCHING CLASSES */
        body.mode-fraction .trophy-fraction-card { display: flex; }
        body.mode-fraction .win-badge-pill { display: none; }
        body.mode-fraction .win-cards-container { display: none; }

        body.mode-badge .trophy-fraction-card { display: none; }
        body.mode-badge .win-badge-pill { display: inline-flex; }
        body.mode-badge .win-cards-container { display: none; }

        body.mode-cards .trophy-fraction-card { display: none; }
        body.mode-cards .win-badge-pill { display: none; }
        body.mode-cards .win-cards-container { display: flex; }

        /* FLOATING DELTA CHIPS */
        .delta-chip {
            position: absolute;
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 900;
            padding: 4px 14px;
            border-radius: 9999px;
            animation: floatUpFade 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: none;
            z-index: 100;
        }

        .delta-chip.plus {
            color: #10b981;
            background: rgba(16, 185, 129, 0.25);
            border: 1.5px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .delta-chip.minus {
            color: #ff007f;
            background: rgba(255, 0, 127, 0.25);
            border: 1.5px solid #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }

        @keyframes floatUpFade {
            0% { transform: translateY(0) scale(0.85); opacity: 0; }
            20% { transform: translateY(-15px) scale(1.15); opacity: 1; }
            100% { transform: translateY(-75px) scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="mode-fraction">

    <!-- 1. WIN FRACTION TROPHY BOX (EXACT MATCH TO PHOTO) -->
    <div id="trophyFractionCard" class="trophy-fraction-card">
        <div class="trophy-bg-graphic">
            <img src="images/trophy_cup.svg" alt="Trophy" onerror="this.src='images/func_2.png'">
        </div>
        <div class="fraction-content-wrap">
            <div id="fractionScore" class="fraction-numerator is-negative">-3</div>
            <div class="fraction-divider-bar"></div>
            <div id="fractionTarget" class="fraction-denominator">5</div>
        </div>
    </div>

    <!-- 2. COMPACT WIN BADGE PILL (IMAGE 2) -->
    <div id="winBadgePill" class="win-badge-pill">
        <span class="trophy-icon">🏆</span>
        <span class="win-label-text" id="winLabelText">Win</span>
        <span class="score-box is-negative" id="scoreValue">-3</span>
        <span class="divider-slash">/</span>
        <span class="target-goal" id="targetValue">5</span>
    </div>

    <!-- 3. DUAL CARDS VIEW (IMAGE 3) -->
    <div id="winCardsContainer" class="win-cards-container">
        <div class="cards-header">
            <span>🏆</span>
            <span id="cardsTitle">Win Widget</span>
        </div>
        <div class="cards-dual-row">
            <div class="win-card-box card-lose">
                <div class="card-tag">🌿 LOSE 🌿</div>
                <div class="card-big-number" id="cardLoseCount">6724</div>
            </div>
            <div class="win-card-box card-win">
                <div class="card-tag">🌿 WIN 🌿</div>
                <div class="card-big-number" id="cardWinCount">472</div>
            </div>
        </div>
    </div>

    <div id="floatingDeltaLayer"></div>

    <script>
        let currentScore = -3;
        let currentTarget = 5;
        let currentWins = 472;
        let currentLosses = 6724;
        let lastServerTime = 0;

        // Parse mode from URL query (?mode=classic / fraction / badge / cards)
        const urlParams = new URLSearchParams(window.location.search);
        const modeParam = urlParams.get('mode') || urlParams.get('style') || urlParams.get('view') || 'fraction';
        setMode(modeParam);

        function setMode(mode) {
            document.body.classList.remove('mode-fraction', 'mode-badge', 'mode-cards');
            if (mode === 'badge' || mode === 'pill') {
                document.body.classList.add('mode-badge');
            } else if (mode === 'cards' || mode === 'dual') {
                document.body.classList.add('mode-cards');
            } else {
                // Classic fraction default
                document.body.classList.add('mode-fraction');
            }
        }

        function updateUI(data, delta = null) {
            if (!data) return;

            currentScore = Number(data.score ?? currentScore);
            currentTarget = Number(data.target ?? currentTarget);
            currentWins = Number(data.wins ?? currentWins);
            currentLosses = Number(data.losses ?? currentLosses);

            // Update fraction numerator & denominator
            const fScore = document.getElementById('fractionScore');
            const fTarget = document.getElementById('fractionTarget');
            if (fScore) {
                fScore.textContent = currentScore;
                fScore.className = 'fraction-numerator';
                if (currentScore < 0) fScore.classList.add('is-negative');
                else if (currentScore > 0) fScore.classList.add('is-positive');
                else fScore.classList.add('is-zero');
            }
            if (fTarget) fTarget.textContent = currentTarget;

            // Update badge pill elements
            const scoreEl = document.getElementById('scoreValue');
            const targetEl = document.getElementById('targetValue');
            const labelEl = document.getElementById('winLabelText');
            if (scoreEl) {
                scoreEl.textContent = currentScore;
                scoreEl.className = 'score-box';
                if (currentScore < 0) scoreEl.classList.add('is-negative');
                else if (currentScore > 0) scoreEl.classList.add('is-positive');
                else scoreEl.classList.add('is-zero');
            }
            if (targetEl) targetEl.textContent = currentTarget;
            if (labelEl && data.label) labelEl.textContent = data.label;

            // Update dual cards
            const loseEl = document.getElementById('cardLoseCount');
            const winEl = document.getElementById('cardWinCount');
            if (loseEl) loseEl.textContent = currentLosses;
            if (winEl) winEl.textContent = currentWins;

            // Update mode if remote style is provided and URL didn't lock it
            if (data.style && !urlParams.get('mode')) {
                setMode(data.style);
            }

            // Animate card pop
            const fCard = document.getElementById('trophyFractionCard');
            if (fCard) {
                fCard.classList.remove('pop-anim');
                void fCard.offsetWidth;
                fCard.classList.add('pop-anim');
            }

            // Spawn floating delta chip if score adjusted
            if (delta !== null && delta !== 0) {
                spawnDeltaChip(delta);
            }
        }

        function spawnDeltaChip(delta) {
            const layer = document.getElementById('floatingDeltaLayer');
            if (!layer) return;

            const chip = document.createElement('div');
            chip.className = `delta-chip ${delta > 0 ? 'plus' : 'minus'}`;
            chip.textContent = delta > 0 ? `+${delta}` : `${delta}`;

            chip.style.left = '70px';
            chip.style.top = '120px';

            layer.appendChild(chip);
            setTimeout(() => chip.remove(), 1600);
        }

        async function fetchInitialState() {
            try {
                const res = await fetch('/api/win-widget?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    updateUI(data);
                }
            } catch (err) {}
        }

        // Live SSE / Polling for instant updates from dashboard and spinner spins
        function startEventStream() {
            setInterval(async () => {
                try {
                    const res = await fetch(`/api/events?since=${lastServerTime}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.serverTime) lastServerTime = data.serverTime;

                    if (Array.isArray(data.events)) {
                        for (const ev of data.events) {
                            if (ev.type === 'win_widget_update') {
                                updateUI(ev, ev.delta);
                            }
                        }
                    }
                } catch (err) {}
            }, 300);
        }

        // Hotkeys directly supported in overlay as well
        window.addEventListener('keydown', (e) => {
            const isMinus = e.code === 'Minus' || e.code === 'NumpadSubtract' || e.key === '-' || e.key === '_';
            const isEqualOrPlus = e.code === 'Equal' || e.code === 'NumpadAdd' || e.key === '=' || e.key === '+';

            if ((e.altKey && isMinus) || e.key === '[') {
                fetch('/api/win-widget/adjust', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'lose_plus' })
                });
            } else if ((e.altKey && isEqualOrPlus) || e.key === ']') {
                fetch('/api/win-widget/adjust', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'win_plus' })
                });
            }
        }, true);

        window.addEventListener('DOMContentLoaded', () => {
            fetchInitialState();
            startEventStream();
        });
    </script>
</body>
</html>
