<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Live Ranking Weekly Overlay</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Oxanium", sans-serif;
            user-select: none;
        }

        .rank-card-container {
            width: 100%;
            max-width: 480px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(28, 16, 32, 0.96), rgba(16, 10, 20, 0.98));
            border: 1.5px solid rgba(255, 60, 140, 0.45);
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), 0 0 24px rgba(255, 45, 120, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .rank-card-container.pulse-rank {
            animation: cardGlowPulse 0.6s cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        @keyframes cardGlowPulse {
            0% { transform: scale(1); border-color: rgba(255, 60, 140, 0.45); }
            50% { transform: scale(1.03); border-color: #ff3388; box-shadow: 0 0 35px rgba(255, 51, 136, 0.6); }
            100% { transform: scale(1); border-color: rgba(255, 60, 140, 0.45); }
        }

        /* Ambient background glow */
        .rank-card-container::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255, 45, 120, 0.28) 0%, transparent 70%);
            pointer-events: none;
            animation: ambientGlowBreathe 4s ease-in-out infinite alternate;
        }

        @keyframes ambientGlowBreathe {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        /* Top Row */
        .rank-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            width: 100%;
        }

        .rank-left-section {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            flex: 1;
        }

        /* Streamer Avatar with Shimmer Ring */
        .streamer-pfp-wrap {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: #1a1020;
            border: 2px solid rgba(255, 60, 140, 0.75);
            box-shadow: 0 0 14px rgba(255, 45, 120, 0.35);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: avatarBorderPulse 3s ease-in-out infinite alternate;
        }

        @keyframes avatarBorderPulse {
            0% { box-shadow: 0 0 12px rgba(255, 45, 120, 0.3); border-color: rgba(255, 60, 140, 0.7); }
            100% { box-shadow: 0 0 20px rgba(255, 45, 120, 0.7); border-color: #ff3388; }
        }

        .streamer-pfp-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .streamer-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .streamer-name {
            color: #ffffff;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.2px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* Category Pill */
        .category-pill {
            align-self: flex-start;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(255, 45, 120, 0.15);
            border: 1px solid rgba(255, 60, 140, 0.5);
            color: #ff4d8d;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            line-height: 1.3;
        }

        /* Large Rank Display: NO. 1 or TOP 1 */
        .rank-number-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            flex-shrink: 0;
            text-align: right;
        }

        .rank-sub-label {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #ff94b8;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: -2px;
        }

        .rank-big-num {
            font-size: 38px;
            font-weight: 900;
            color: #ffb8d2;
            line-height: 1;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 80, 150, 0.7);
            transition: transform 0.2s ease;
        }

        .anim-rank-num {
            animation: rankNumPunch 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        @keyframes rankNumPunch {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.26); text-shadow: 0 0 30px #ff2d78; }
            100% { transform: scale(1); }
        }

        /* Status Row */
        .rank-status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 13px;
            font-weight: 700;
            padding: 0 2px;
        }

        .rank-gap-text {
            color: #e5e5e5;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
            transition: color 0.2s ease;
        }

        .rank-countdown-box {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffaa44;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .flame-icon {
            display: inline-block;
            animation: flamePulse 1.8s ease-in-out infinite alternate;
        }

        @keyframes flamePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #ff8800); }
            100% { transform: scale(1.24); filter: drop-shadow(0 0 8px #ff4400); }
        }

        /* ─── Progress Bar Track & Laser Sweep ─── */
        .rank-bar-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .rank-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff2d78 0%, #ff529a 70%, #ff80b5 100%);
            box-shadow: 0 0 14px rgba(255, 45, 120, 0.85);
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        /* Moving Laser Beam Sweep */
        .rank-bar-fill::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 60px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
            animation: laserSweep 2.2s linear infinite;
        }

        @keyframes laserSweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(500%); }
        }
    </style>
</head>
<body>

    <div class="rank-card-container" id="live-rank-box">
        <!-- Top Row: Avatar, Username, Category & Big Rank Number -->
        <div class="rank-top-row">
            <div class="rank-left-section">
                <div class="streamer-pfp-wrap">
                    <img id="rank-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='58' height='58' viewBox='0 0 24 24' fill='none' stroke='%23ff4d8d' stroke-width='2'><path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/><circle cx='12' cy='7' r='4'/></svg>" alt="Streamer Avatar" class="streamer-pfp-img" />
                </div>
                <div class="streamer-info">
                    <div id="rank-username" class="streamer-name">Stream viewer</div>
                    <div id="rank-category" class="category-pill">LIVE GIFT RANK</div>
                </div>
            </div>

            <div class="rank-number-box">
                <div class="rank-sub-label" id="rank-sub-label">TOP</div>
                <div id="rank-number" class="rank-big-num">1</div>
            </div>
        </div>

        <!-- Status Row: Gap To Reach + Next Update Countdown -->
        <div class="rank-status-row">
            <div id="rank-gap-text" class="rank-gap-text">1 Diamonds</div>
            <div class="rank-countdown-box">
                <span class="flame-icon">🔥</span>
                <span id="rank-timer">LIVE</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="rank-bar-track">
            <div id="rank-bar-fill" class="rank-bar-fill" style="width: 15%;"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let goalTarget = parseInt(params.get('goal') || '1000', 10);
        let currentScore = 0;
        let topUser = params.get('user') || 'Stream viewer';
        let customCategory = params.get('title') || 'LIVE GIFT RANK';

        document.getElementById('rank-username').textContent = topUser;
        document.getElementById('rank-category').textContent = customCategory;

        function updateHUD(name, score, avatarUrl, rankNum = 1) {
            topUser = name || topUser;
            currentScore = score;
            document.getElementById('rank-username').textContent = topUser;
            
            const numEl = document.getElementById('rank-number');
            numEl.textContent = String(rankNum);
            numEl.classList.remove('anim-rank-num');
            void numEl.offsetWidth;
            numEl.classList.add('anim-rank-num');

            document.getElementById('rank-gap-text').textContent = `${currentScore.toLocaleString()} Diamonds`;

            if (avatarUrl) {
                const img = document.getElementById('rank-avatar');
                img.src = avatarUrl;
            }

            const pct = Math.min(100, Math.max(5, (currentScore / goalTarget) * 100));
            document.getElementById('rank-bar-fill').style.width = pct + '%';

            const card = document.getElementById('live-rank-box');
            card.classList.remove('pulse-rank');
            void card.offsetWidth;
            card.classList.add('pulse-rank');
        }

        // Fetch leaderboard & event sync
        let lastEventTimestamp = Date.now() - 5000;
        async function fetchSync() {
            try {
                const [lbRes, evRes] = await Promise.all([
                    fetch('/api/leaderboard?type=coins&count=1&t=' + Date.now()).catch(() => null),
                    fetch(`/api/events?since=${lastEventTimestamp}&t=${Date.now()}`).catch(() => null)
                ]);

                if (lbRes && lbRes.ok) {
                    const lbData = await lbRes.json();
                    if (lbData.coins && lbData.coins.length > 0) {
                        const top = lbData.coins[0];
                        if (top && top.username) {
                            const av = top.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(top.username)}&background=ff2d78&color=fff&bold=true`;
                            updateHUD(top.username, top.value || 1, av, 1);
                        }
                    }
                }

                if (evRes && evRes.ok) {
                    const evData = await evRes.json();
                    if (evData.serverTime) lastEventTimestamp = evData.serverTime;
                    if (evData.events && evData.events.length > 0) {
                        for (const ev of evData.events) {
                            if (ev.type === 'gift' || ev.type === 'jar_drop') {
                                const uname = ev.username || 'RENEarn';
                                const coins = ev.coins || (ev.amount || 1);
                                currentScore += coins;
                                updateHUD(uname, currentScore, ev.avatar || '');
                            }
                        }
                    }
                }
            } catch (e) {}
        }

        setInterval(fetchSync, 400);
        fetchSync();

        // BroadcastChannel for cross-tab events
        try {
            const bc = new BroadcastChannel('renearn_overlay_events');
            bc.onmessage = (e) => {
                if (e.data && (e.data.type === 'gift' || e.data.type === 'jar_drop')) {
                    updateHUD(e.data.username || 'RENEarn', (currentScore + (e.data.coins || 1)), e.data.avatar);
                }
            };
        } catch (e) {}
    </script>
</body>
</html>
