<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENEarn - OBS Live Stream Overlay</title>
    <link rel="icon" type="image/png" href="images/renearn_icon.png">
    <link rel="shortcut icon" href="images/renearn_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="wheel-engine.js"></script>
    <script src="renearn-command-engine.js"></script>
    <script src="stream-keepalive.js"></script>
    <style>
        :root {
            --pvz-green: #10b981;
            --pvz-gold: #f59e0b;
            --pvz-purple: #8b5cf6;
            --pvz-red: #ef4444;
            --text-white: #ffffff;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Card Container */
        .overlay-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 380px;
            pointer-events: none;
        }

        /* Glassmorphism Goal / Gift Card */
        .live-card, .s2e-card {
            background: linear-gradient(135deg, rgba(15, 20, 26, 0.88), rgba(26, 32, 44, 0.78));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-lg);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardSlideIn 0.35s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .live-card, .s2e-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--pvz-green);
            box-shadow: 0 0 10px var(--pvz-green);
        }

        .live-card, .s2e-card.zombie-side::before { background: var(--pvz-red); box-shadow: 0 0 10px var(--pvz-red); }
        .live-card, .s2e-card.plant-side::before { background: var(--pvz-green); box-shadow: 0 0 10px var(--pvz-green); }
        .live-card, .s2e-card.power-side::before { background: var(--pvz-gold); box-shadow: 0 0 10px var(--pvz-gold); }
        .live-card, .s2e-card.spinner-side::before { background: var(--pvz-purple); box-shadow: 0 0 10px var(--pvz-purple); }

        .live-card, .s2e-card.bump {
            animation: bumpAnimation 0.35s ease;
        }

        @keyframes bumpAnimation {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); filter: brightness(1.3); }
            100% { transform: scale(1); }
        }

        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Left: Gift / Trigger Icon */
        .card-trigger-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .trigger-icon-box {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            overflow: hidden;
        }

        .trigger-icon-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .trigger-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .trigger-title {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .trigger-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: var(--pvz-gold);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Center arrow separator */
        .card-arrow {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 900;
            font-size: 14px;
        }

        /* Right: In-Game Action Preview */
        .card-action-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .action-icon-box {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
        }

        .count-pill {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 999px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            min-width: 38px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Floating Alert Banner */
        .alert-toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 9999;
        }

        .alert-popup {
            background: linear-gradient(135deg, rgba(16, 24, 39, 0.96), rgba(30, 41, 59, 0.92));
            backdrop-filter: blur(16px);
            border: 2px solid var(--pvz-green);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(16, 185, 129, 0.35);
            border-radius: var(--radius-lg);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: alertSlideIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            min-width: 320px;
        }

        @keyframes alertSlideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .alert-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--pvz-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        .alert-text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .alert-username {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        .alert-action {
            font-size: 13px;
            font-weight: 700;
            color: var(--pvz-green);
        }

        /* Fullscreen Wheel Modal */
        #wheelOverlayModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #wheelOverlayModal.active {
            display: flex;
            opacity: 1;
        }

        .wheel-modal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .wheel-banner-title {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.8), 0 4px 8px rgba(0,0,0,0.8);
            letter-spacing: -0.5px;
        }

        .wheel-box {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #overlayWheelCanvas {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.95), 0 0 45px rgba(245, 158, 11, 0.45);
            transition: transform 4.5s cubic-bezier(0.12, 0.95, 0.22, 1);
        }

        .wheel-pointer-container {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            pointer-events: none;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.95));
        }

        /* LUXURY REEL THEMES IN OVERLAY */
        .s2e-reel-card.theme-casino_felt,
        .s2e-reel-track.theme-casino_felt .s2e-reel-card {
            background: radial-gradient(circle at 50% 18%, #2d0c15 0%, #17050a 65%, #090204 100%) !important;
            border: 2px solid #b45309 !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(254, 240, 138, 0.35), 0 0 12px rgba(245, 158, 11, 0.25) !important;
        }
        .s2e-reel-card.theme-casino_felt .rarity-tag,
        .s2e-reel-track.theme-casino_felt .s2e-reel-card .rarity-tag {
            background: linear-gradient(135deg, #78350f, #b45309) !important;
            color: #fef08a !important;
            border: 1px solid #fde047 !important;
        }
        /* 2. Groudon Neon Magma Theme in Overlay */
        .s2e-reel-card.theme-groudon_magma,
        .s2e-reel-track.theme-groudon_magma .s2e-reel-card,
        .s2e-reel-card.theme-neon_cyber,
        .s2e-reel-track.theme-neon_cyber .s2e-reel-card {
            background: linear-gradient(180deg, #180509 0%, #0a0204 100%) !important;
            border: 2px solid #ff2247 !important;
            box-shadow: 0 0 22px rgba(255, 34, 71, 0.65), 0 0 10px rgba(255, 107, 0, 0.4), inset 0 0 14px rgba(255, 34, 71, 0.25) !important;
        }
        .s2e-reel-card.theme-groudon_magma .rarity-tag,
        .s2e-reel-track.theme-groudon_magma .s2e-reel-card .rarity-tag,
        .s2e-reel-card.theme-neon_cyber .rarity-tag,
        .s2e-reel-track.theme-neon_cyber .s2e-reel-card .rarity-tag {
            background: rgba(255, 34, 71, 0.22) !important;
            color: #ff3b60 !important;
            border: 1px solid #ff2247 !important;
            text-shadow: 0 0 10px #ff2247 !important;
            box-shadow: 0 0 8px rgba(255, 34, 71, 0.45) !important;
        }

        .s2e-reel-track.theme-groudon_magma .s2e-reel-card.rarity-mythic,
        .s2e-reel-track.theme-neon_cyber .s2e-reel-card.rarity-mythic {
            border-color: #ff1744 !important;
            box-shadow: 0 0 24px rgba(255, 23, 68, 0.8), inset 0 0 14px rgba(255, 23, 68, 0.35) !important;
        }
        .s2e-reel-track.theme-groudon_magma .s2e-reel-card.rarity-legendary,
        .s2e-reel-track.theme-neon_cyber .s2e-reel-card.rarity-legendary {
            border-color: #ff9100 !important;
            box-shadow: 0 0 24px rgba(255, 145, 0, 0.8), inset 0 0 14px rgba(255, 145, 0, 0.35) !important;
        }
        .s2e-reel-track.theme-groudon_magma .s2e-reel-card.rarity-epic,
        .s2e-reel-track.theme-neon_cyber .s2e-reel-card.rarity-epic {
            border-color: #e11d48 !important;
            box-shadow: 0 0 22px rgba(225, 29, 72, 0.75), inset 0 0 12px rgba(225, 29, 72, 0.3) !important;
        }
        .s2e-reel-track.theme-groudon_magma .s2e-reel-card.rarity-rare,
        .s2e-reel-track.theme-neon_cyber .s2e-reel-card.rarity-rare {
            border-color: #ff5722 !important;
            box-shadow: 0 0 20px rgba(255, 87, 34, 0.7), inset 0 0 12px rgba(255, 87, 34, 0.3) !important;
        }
        .s2e-reel-card.theme-obsidian_luxury,
        .s2e-reel-track.theme-obsidian_luxury .s2e-reel-card {
            background: linear-gradient(180deg, #1c1917 0%, #0c0a09 100%) !important;
            border: 2px solid #eab308 !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.95), 0 0 14px rgba(234, 179, 8, 0.3) !important;
        }

        .winner-banner {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #10b981;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
            transform: scale(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .winner-banner.show {
            transform: scale(1);
        }

        /* Horizontal Reel Styles */
        .reel-outer, .s2e-reel-outer {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background: #090d14;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
        }

        .reel-track, .s2e-reel-track {
            display: flex;
            align-items: center;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            padding: 0 10px;
            will-change: transform;
        }

        .reel-card, .s2e-reel-card {
            width: 120px;
            height: 114px;
            margin: 0 6px;
            border-radius: 12px;
            background: rgba(15, 20, 28, 0.95);
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .reel-card, .s2e-reel-card .card-glow-bg {
            position: absolute;
            inset: 0;
            opacity: 0.12;
            background: currentColor;
            pointer-events: none;
        }

        .reel-card, .s2e-reel-card .rarity-tag {
            position: absolute;
            top: 4px;
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1px 5px;
            border-radius: 4px;
            z-index: 2;
        }

        .reel-card, .s2e-reel-card .card-img-wrap {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            z-index: 2;
        }

        .reel-card, .s2e-reel-card .card-img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
        }

        .reel-card, .s2e-reel-card .card-title {
            font-size: 10.5px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            line-height: 1.15;
            max-width: 92px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 2;
        }

        .reel-card, .s2e-reel-card .card-amount {
            font-size: 9px;
            font-weight: 700;
            color: #94a3b8;
            z-index: 2;
        }

        .rarity-mythic { border-color: #ef4444 !important; box-shadow: 0 0 18px rgba(239, 68, 68, 0.6) !important; color: #ef4444; }
        .rarity-mythic .rarity-tag { color: #fca5a5; background: rgba(239, 68, 68, 0.3); border: 1px solid rgba(239, 68, 68, 0.5); }

        .rarity-legendary { border-color: #f59e0b !important; box-shadow: 0 0 18px rgba(245, 158, 11, 0.6) !important; color: #f59e0b; }
        .rarity-legendary .rarity-tag { color: #fde68a; background: rgba(245, 158, 11, 0.3); border: 1px solid rgba(245, 158, 11, 0.5); }

        .rarity-epic { border-color: #a855f7 !important; box-shadow: 0 0 16px rgba(168, 85, 247, 0.55) !important; color: #a855f7; }
        .rarity-epic .rarity-tag { color: #e9d5ff; background: rgba(168, 85, 247, 0.3); border: 1px solid rgba(168, 85, 247, 0.5); }

        .rarity-rare { border-color: #3b82f6 !important; box-shadow: 0 0 14px rgba(59, 130, 246, 0.5) !important; color: #3b82f6; }
        .rarity-rare .rarity-tag { color: #bfdbfe; background: rgba(59, 130, 246, 0.3); border: 1px solid rgba(59, 130, 246, 0.5); }

        .rarity-normal { border-color: #94a3b8 !important; box-shadow: 0 0 10px rgba(148, 163, 184, 0.35) !important; color: #94a3b8; }
        .rarity-normal .rarity-tag { color: #e2e8f0; background: rgba(148, 163, 184, 0.25); border: 1px solid rgba(148, 163, 184, 0.4); }

        .reel-pointer, .s2e-reel-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .reel-pointer, .s2e-reel-pointer .pointer-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border: 2px solid #ffffff;
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .reel-pointer, .s2e-reel-pointer .pointer-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reel-pointer, .s2e-reel-pointer .pointer-triangle {
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 15px solid #f59e0b;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.85));
            margin-top: -3px;
        }

        .reel-fade-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 90px;
            height: 100%;
            background: linear-gradient(90deg, #090d14 0%, transparent 100%);
            pointer-events: none;
            z-index: 10;
        }

        .reel-fade-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 90px;
            height: 100%;
            background: linear-gradient(270deg, #090d14 0%, transparent 100%);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- LIVE CARDS DOCK (LEFT SIDE) -->
    <div id="cardsDock" class="overlay-container">
        <!-- Dynamically populated from config and counts -->
    </div>

    <!-- FLOATING ALERT POPUPS (TOP RIGHT) -->
    <div id="alertDock" class="alert-toast-container"></div>

    <!-- FULLSCREEN WHEEL / REEL POPUP -->
    <div id="wheelOverlayModal">
        <div class="wheel-modal-content">
            <div class="wheel-banner-title" id="wheelOverlayTitle">LUCKY ROULETTE</div>

            <!-- CLASSIC CANVAS WHEEL -->
            <div class="wheel-box" id="overlayCanvasWheelBox">
                <div class="wheel-pointer-container" id="overlayWheelPointer"></div>
                <canvas id="overlayWheelCanvas" width="800" height="800" style="width: 400px; height: 400px;"></canvas>
            </div>

            <!-- HORIZONTAL REEL ROULETTE -->
            <div id="overlayReelBox" style="display: none; position: relative; width: 680px; max-width: 94vw; background: rgba(9, 13, 20, 0.96); border: 2px solid rgba(255, 255, 255, 0.18); border-radius: 20px; padding: 24px 16px; box-shadow: 0 10px 50px rgba(0,0,0,0.9);">
                <div class="s2e-reel-outer" id="overlayReelOuter">
                    <div class="reel-fade-left"></div>
                    <div class="reel-fade-right"></div>
                    <div class="s2e-reel-pointer" id="overlayReelPointer">
                        <div class="pointer-badge" id="overlayPointerBadge">
                            <img id="overlayPointerImg" src="images/game-icons/pvz/spawn_ultimatecattail.webp" onerror="this.src='images/func_2.png'" alt="Marker">
                        </div>
                        <div class="pointer-triangle"></div>
                    </div>
                    <div class="s2e-reel-track" id="overlayReelTrack"></div>
                </div>
            </div>

            <div id="wheelWinnerBanner" class="winner-banner"></div>
        </div>
    </div>

    <script>
        let config = null;
        let counts = {};
        let lastEventTimestamp = 0;
        let isWheelActive = false;
        let wheelRotation = 0;

        // Web Audio Synthesizer (Zero-asset sound effects!)
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playAlert() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            },
            playTick() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            },
            playVictory() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + (idx * 0.12);
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                });
            }
        };

        // Real-Time Event Polling & BroadcastChannel (Instant 0ms synchronization)
        function startPolling() {
            // Instant local inter-window / browser source event synchronization
            try {
                const bc = new BroadcastChannel('renearn_overlay_events');
                bc.onmessage = (event) => {
                    if (event.data) {
                        handleLiveEvent(event.data);
                    }
                };
            } catch (e) {}

            let isPolling = false;
            let isSyncing = false;

            async function poll() {
                if (isPolling) return;
                isPolling = true;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                try {
                    const res = await fetch(`/api/events?since=${lastEventTimestamp}`, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.serverTime) lastEventTimestamp = data.serverTime;

                    if (data.events && data.events.length > 0) {
                        data.events.forEach(ev => {
                            handleLiveEvent(ev);
                        });
                    }
                } catch (e) {
                } finally {
                    clearTimeout(timeoutId);
                    isPolling = false;
                }
            }

            async function syncCounts() {
                if (isSyncing) return;
                isSyncing = true;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                try {
                    const res = await fetch('/api/counts', { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!res.ok) return;
                    const newCounts = await res.json();
                    for (const [id, count] of Object.entries(newCounts)) {
                        const pill = document.getElementById(`countPill_${id}`);
                        if (pill && pill.innerText !== String(count)) {
                            pill.innerText = count;
                            const card = document.getElementById(`overlayCard_${id}`);
                            if (card) {
                                card.classList.remove('bump');
                                void card.offsetWidth;
                                card.classList.add('bump');
                            }
                        }
                    }
                } catch (e) {
                } finally {
                    clearTimeout(timeoutId);
                    isSyncing = false;
                }
            }

            if (typeof window.createWorkerTicker === 'function') {
                window.createWorkerTicker(poll, 150);
                window.createWorkerTicker(syncCounts, 1000);
            } else {
                setInterval(poll, 200);
                setInterval(syncCounts, 1200);
            }
        }

        // Handle Event
        function handleLiveEvent(ev) {
            if (ev.type === 'config_updated' || ev.type === 'spinner_updated' || ev.type === 'cards_updated') {
                fetchConfig().then(renderCards);
                return;
            }

            if (ev.hideInOverlay === true) {
                return; // Silently execute without showing alert/popup on stream overlay
            }
            // Trigger Sound: Only play synth alert beep if sound alerts are enabled AND no custom audio is configured
            const isSoundAlertsEnabled = !config || !config.overlay || config.overlay.soundAlerts !== false;
            let hasAttachedAudio = false;
            if (config && config.gifts) {
                const cg = config.gifts.find(g => (ev.cardId && String(g.id) === String(ev.cardId)) || (ev.giftName && g.giftName && g.giftName.toLowerCase() === ev.giftName.toLowerCase()));
                if (cg && cg.audio && cg.audio.file) hasAttachedAudio = true;
            }
            if (isSoundAlertsEnabled && !hasAttachedAudio) {
                AudioEngine.playAlert();
            }

            // Trigger Alert Banner
            showAlertBanner(ev);

            // If wheel spin
            if (ev.type === 'spin_result' || ev.actionType === 'spinner') {
                triggerWheelAnimation(ev.slice, ev);
            }
        }

        function drawRealisticWheel(canvas, spinner) {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const R = Math.min(w, h) / 2 - 4;

            ctx.clearRect(0, 0, w, h);

            const sp = spinner || {};
            const slices = (sp.slices && sp.slices.length > 0) ? sp.slices : [
                { id: '1', label: '+500', rarity: 'Mythic', delta: 500 },
                { id: '2', label: '-100', rarity: 'Mythic', delta: -100 },
                { id: '3', label: '+100', rarity: 'Legendary', delta: 100 },
                { id: '4', label: '-50', rarity: 'Legendary', delta: -50 },
                { id: '5', label: '+50', rarity: 'Epic', delta: 50 },
                { id: '6', label: '-25', rarity: 'Rare', delta: -25 },
                { id: '7', label: '+20', rarity: 'Normal', delta: 20 },
                { id: '8', label: '-10', rarity: 'Normal', delta: -10 }
            ];

            const num = slices.length || 8;
            const arc = (2 * Math.PI) / num;

            const theme = sp.wheelTheme || 'casino_royale';
            const centerFinial = sp.centerFinial || 'turret_3d';
            const colorMode = sp.wheelRarityStyle || 'rarity_enamel';

            const rOuter = R;
            const rWoodIn = R * 0.84;
            const rBrassIn = R * 0.81;
            const rTrackIn = R * 0.72;
            const rPocketOut = R * 0.72;
            const rPocketIn = R * 0.44;
            const rConeIn = R * 0.22;
            const rTurretBase = R * 0.22;
            const rTurretMid = R * 0.15;
            const rTurretTop = R * 0.085;

            // 1. Outer Mahogany / Themed Rim
            ctx.save();
            let rimGrad;
            if (theme === 'pvz_gold') {
                rimGrad = ctx.createRadialGradient(cx, cy, rWoodIn, cx, cy, rOuter);
                rimGrad.addColorStop(0.0, '#78350f');
                rimGrad.addColorStop(0.3, '#d97706');
                rimGrad.addColorStop(0.7, '#fef08a');
                rimGrad.addColorStop(1.0, '#451a03');
            } else if (theme === 'cyberpunk_neon') {
                rimGrad = ctx.createRadialGradient(cx, cy, rWoodIn, cx, cy, rOuter);
                rimGrad.addColorStop(0.0, '#0b0f19');
                rimGrad.addColorStop(0.4, '#161e2e');
                rimGrad.addColorStop(0.8, '#0d131f');
                rimGrad.addColorStop(1.0, '#04060a');
            } else if (theme === 'obsidian_vip') {
                rimGrad = ctx.createRadialGradient(cx, cy, rWoodIn, cx, cy, rOuter);
                rimGrad.addColorStop(0.0, '#1c1917');
                rimGrad.addColorStop(0.4, '#292524');
                rimGrad.addColorStop(0.8, '#18181b');
                rimGrad.addColorStop(1.0, '#09090b');
            } else if (theme === 'emerald_montecarlo') {
                rimGrad = ctx.createRadialGradient(cx, cy, rWoodIn, cx, cy, rOuter);
                rimGrad.addColorStop(0.0, '#064e3b');
                rimGrad.addColorStop(0.35, '#047857');
                rimGrad.addColorStop(0.75, '#022c22');
                rimGrad.addColorStop(1.0, '#011c15');
            } else {
                rimGrad = ctx.createRadialGradient(cx, cy, rWoodIn, cx, cy, rOuter);
                rimGrad.addColorStop(0.00, '#2b0e04');
                rimGrad.addColorStop(0.25, '#4a1b0b');
                rimGrad.addColorStop(0.60, '#381206');
                rimGrad.addColorStop(0.85, '#220802');
                rimGrad.addColorStop(1.00, '#0f0301');
            }

            ctx.beginPath();
            ctx.arc(cx, cy, rOuter, 0, 2 * Math.PI);
            ctx.fillStyle = rimGrad;
            ctx.fill();

            const glossGrad = ctx.createLinearGradient(cx - rOuter, cy - rOuter, cx + rOuter, cy + rOuter);
            glossGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.18)');
            glossGrad.addColorStop(0.45, 'rgba(255, 255, 255, 0.02)');
            glossGrad.addColorStop(0.55, 'rgba(0, 0, 0, 0.22)');
            glossGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.12)');
            ctx.fillStyle = glossGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, rOuter, 0, 2 * Math.PI);
            ctx.strokeStyle = '#050100';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 2. Brass Rivets
            const rivetCount = Math.max(16, Math.min(32, num * 2));
            const rRivets = (rOuter + rWoodIn) / 2;
            for (let k = 0; k < rivetCount; k++) {
                const ra = (k / rivetCount) * 2 * Math.PI;
                const rx = cx + rRivets * Math.cos(ra);
                const ry = cy + rRivets * Math.sin(ra);

                const rSize = Math.max(2.5, R * 0.012);
                const rGrad = ctx.createRadialGradient(rx - 1, ry - 1, 0, rx, ry, rSize);
                if (theme === 'cyberpunk_neon') {
                    rGrad.addColorStop(0, '#ffffff');
                    rGrad.addColorStop(0.4, '#00f0ff');
                    rGrad.addColorStop(1, '#005577');
                } else if (theme === 'pvz_gold') {
                    rGrad.addColorStop(0, '#a7f3d0');
                    rGrad.addColorStop(0.5, '#10b981');
                    rGrad.addColorStop(1, '#064e3b');
                } else {
                    rGrad.addColorStop(0, '#fef08a');
                    rGrad.addColorStop(0.4, '#eab308');
                    rGrad.addColorStop(0.85, '#b45309');
                    rGrad.addColorStop(1, '#451a03');
                }

                ctx.beginPath();
                ctx.arc(rx, ry, rSize, 0, 2 * Math.PI);
                ctx.fillStyle = rGrad;
                ctx.shadowColor = 'rgba(0,0,0,0.85)';
                ctx.shadowBlur = 3;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(rx - 0.7, ry - 0.7, rSize * 0.35, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.fill();
            }
            ctx.restore();

            // 3. Brass Inlay Bezel
            ctx.save();
            const brassGrad = ctx.createRadialGradient(cx, cy, rBrassIn, cx, cy, rWoodIn);
            if (theme === 'cyberpunk_neon') {
                brassGrad.addColorStop(0.0, '#003344');
                brassGrad.addColorStop(0.5, '#00f0ff');
                brassGrad.addColorStop(1.0, '#001a24');
            } else {
                brassGrad.addColorStop(0.0, '#78350f');
                brassGrad.addColorStop(0.2, '#fde047');
                brassGrad.addColorStop(0.5, '#eab308');
                brassGrad.addColorStop(0.8, '#fef08a');
                brassGrad.addColorStop(1.0, '#451a03');
            }

            ctx.beginPath();
            ctx.arc(cx, cy, rWoodIn, 0, 2 * Math.PI);
            ctx.arc(cx, cy, rBrassIn, 0, 2 * Math.PI, true);
            ctx.fillStyle = brassGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, rWoodIn, 0, 2 * Math.PI);
            ctx.strokeStyle = '#270e02';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();

            // 4. Sunken Ball Track
            ctx.save();
            const trackGrad = ctx.createRadialGradient(cx, cy, rTrackIn, cx, cy, rBrassIn);
            trackGrad.addColorStop(0.00, '#100401');
            trackGrad.addColorStop(0.40, '#240b03');
            trackGrad.addColorStop(0.75, '#180702');
            trackGrad.addColorStop(1.00, '#060100');

            ctx.beginPath();
            ctx.arc(cx, cy, rBrassIn, 0, 2 * Math.PI);
            ctx.arc(cx, cy, rTrackIn, 0, 2 * Math.PI, true);
            ctx.fillStyle = trackGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, rTrackIn + 3, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(0,0,0,0.9)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, rPocketOut, 0, 2 * Math.PI);
            ctx.strokeStyle = (theme === 'cyberpunk_neon') ? '#00f0ff' : '#d97706';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.restore();

            // 5. Enamel Pockets & Metallic Frets
            ctx.save();
            for (let i = 0; i < num; i++) {
                const sAngle = i * arc;
                const eAngle = (i + 1) * arc;
                const mAngle = sAngle + arc / 2;
                const slice = slices[i] || { label: 'Prize ' + (i+1) };

                let col1 = '#881337', col2 = '#4c0519';
                const rText = (slice.rarity || 'Normal').toLowerCase();
                const isNumber = slice.delta !== undefined || /^([+-]?\d+)$/.test(slice.label || '');
                const delta = Number(slice.delta !== undefined ? slice.delta : parseInt(slice.label) || 0);

                if (colorMode === 'classic_roulette') {
                    if (delta === 0 || slice.label === '0' || slice.isZero) {
                        col1 = '#047857'; col2 = '#064e3b';
                    } else if (i % 2 === 0) {
                        col1 = '#9f1239'; col2 = '#4c0519';
                    } else {
                        col1 = '#18181b'; col2 = '#09090b';
                    }
                } else if (colorMode === 'slice_custom' && slice.color) {
                    col1 = slice.color;
                    col2 = '#09090b';
                } else {
                    switch (rText) {
                        case 'mythic': col1 = '#b91c1c'; col2 = '#450a0a'; break;
                        case 'legendary': col1 = '#d97706'; col2 = '#78350f'; break;
                        case 'epic': col1 = '#7e22ce'; col2 = '#3b0764'; break;
                        case 'rare': col1 = '#2563eb'; col2 = '#172554'; break;
                        default:
                            col1 = (isNumber && delta > 0) ? '#059669' : '#1f2937';
                            col2 = (isNumber && delta > 0) ? '#064e3b' : '#09090b';
                            break;
                    }
                }

                ctx.beginPath();
                ctx.arc(cx, cy, rPocketOut, sAngle, eAngle);
                ctx.arc(cx, cy, rPocketIn, eAngle, sAngle, true);
                ctx.closePath();

                const pocketGrad = ctx.createRadialGradient(cx, cy, rPocketIn, cx, cy, rPocketOut);
                pocketGrad.addColorStop(0.0, col1);
                pocketGrad.addColorStop(0.7, col2);
                pocketGrad.addColorStop(1.0, '#000000');
                ctx.fillStyle = pocketGrad;
                ctx.fill();

                ctx.save();
                ctx.clip();
                const sheenGrad = ctx.createLinearGradient(
                    cx + rPocketIn * Math.cos(mAngle), cy + rPocketIn * Math.sin(mAngle),
                    cx + rPocketOut * Math.cos(mAngle), cy + rPocketOut * Math.sin(mAngle)
                );
                sheenGrad.addColorStop(0, 'rgba(255,255,255,0.22)');
                sheenGrad.addColorStop(0.4, 'rgba(255,255,255,0.0)');
                sheenGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = sheenGrad;
                ctx.fill();
                ctx.restore();
            }

            // Metallic Frets
            for (let i = 0; i < num; i++) {
                const sAngle = i * arc;
                const cosA = Math.cos(sAngle);
                const sinA = Math.sin(sAngle);

                const x1 = cx + (rPocketIn - 4) * cosA;
                const y1 = cy + (rPocketIn - 4) * sinA;
                const x2 = cx + (rPocketOut + 1) * cosA;
                const y2 = cy + (rPocketOut + 1) * sinA;

                ctx.beginPath();
                ctx.moveTo(x1 - 1.2 * sinA, y1 + 1.2 * cosA);
                ctx.lineTo(x2 - 1.2 * sinA, y2 + 1.2 * cosA);
                ctx.strokeStyle = 'rgba(0,0,0,0.85)';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = (theme === 'cyberpunk_neon') ? '#00f0ff' : '#eab308';
                ctx.lineWidth = 1.8;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x1 + 0.6 * sinA, y1 - 0.6 * cosA);
                ctx.lineTo(x2 + 0.6 * sinA, y2 - 0.6 * cosA);
                ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                ctx.lineWidth = 0.8;
                ctx.stroke();
            }

            // Labels / Numbers (Radial Alignment)
            const fontPx = Math.max(11, Math.min(20, Math.floor((rPocketOut - rPocketIn) * 0.40 * (14 / Math.max(10, num)) + 4)));
            for (let i = 0; i < num; i++) {
                const mAngle = (i + 0.5) * arc;
                const slice = slices[i] || {};
                let label = slice.label || '';
                if (slice.delta !== undefined && slice.delta !== null) {
                    const d = Number(slice.delta);
                    label = d > 0 ? `+${d}` : `${d}`;
                }

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(mAngle);

                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.font = `900 ${fontPx}px 'Outfit', 'Plus Jakarta Sans', sans-serif`;

                ctx.shadowColor = 'rgba(0,0,0,0.95)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fillStyle = '#fef08a';
                ctx.fillText(label, rPocketOut - 14, 0);

                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, rPocketOut - 14, -0.6);

                ctx.restore();
            }
            ctx.restore();

            // 6. Inner Cone
            ctx.save();
            const coneGrad = ctx.createRadialGradient(cx, cy, rConeIn, cx, cy, rPocketIn);
            coneGrad.addColorStop(0.00, '#541e0a');
            coneGrad.addColorStop(0.35, '#3d1406');
            coneGrad.addColorStop(0.75, '#240a03');
            coneGrad.addColorStop(1.00, '#120401');

            ctx.beginPath();
            ctx.arc(cx, cy, rPocketIn, 0, 2 * Math.PI);
            ctx.arc(cx, cy, rConeIn, 0, 2 * Math.PI, true);
            ctx.fillStyle = coneGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, rPocketIn, 0, 2 * Math.PI);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, rConeIn, 0, 2 * Math.PI);
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            for (let i = 0; i < num; i++) {
                const sAngle = i * arc;
                const cosA = Math.cos(sAngle);
                const sinA = Math.sin(sAngle);

                ctx.beginPath();
                ctx.moveTo(cx + rConeIn * cosA, cy + rConeIn * sinA);
                ctx.lineTo(cx + rPocketIn * cosA, cy + rPocketIn * sinA);
                ctx.strokeStyle = 'rgba(234, 179, 8, 0.45)';
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }
            ctx.restore();

            // 7. Center Finial
            ctx.save();
            if (centerFinial === 'golden_crown') {
                const cGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rTurretBase);
                cGrad.addColorStop(0, '#fef08a');
                cGrad.addColorStop(0.5, '#eab308');
                cGrad.addColorStop(1, '#78350f');
                ctx.beginPath();
                ctx.arc(cx, cy, rTurretBase, 0, 2 * Math.PI);
                ctx.fillStyle = cGrad;
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 10;
                ctx.fill();

                for (let k = 0; k < 8; k++) {
                    const ca = (k / 8) * 2 * Math.PI;
                    ctx.beginPath();
                    ctx.arc(cx + rTurretMid * Math.cos(ca), cy + rTurretMid * Math.sin(ca), 3, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ef4444';
                    ctx.fill();
                }
            } else if (centerFinial === 'ruby_gem') {
                const rGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rTurretBase);
                rGrad.addColorStop(0, '#ff7185');
                rGrad.addColorStop(0.5, '#e11d48');
                rGrad.addColorStop(1, '#881337');
                ctx.beginPath();
                ctx.arc(cx, cy, rTurretBase, 0, 2 * Math.PI);
                ctx.fillStyle = rGrad;
                ctx.shadowColor = 'rgba(0,0,0,0.85)';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx, cy, rTurretBase, 0, 2 * Math.PI);
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                // 3D Lathe-Turned Turret (Picture 1)
                const tBaseGrad = ctx.createRadialGradient(cx, cy, rTurretMid, cx, cy, rTurretBase);
                tBaseGrad.addColorStop(0.0, '#78350f');
                tBaseGrad.addColorStop(0.25, '#fef08a');
                tBaseGrad.addColorStop(0.55, '#d97706');
                tBaseGrad.addColorStop(0.85, '#fde047');
                tBaseGrad.addColorStop(1.0, '#451a03');

                ctx.beginPath();
                ctx.arc(cx, cy, rTurretBase, 0, 2 * Math.PI);
                ctx.fillStyle = tBaseGrad;
                ctx.shadowColor = 'rgba(0,0,0,0.75)';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(cx, cy, rTurretBase, 0, 2 * Math.PI);
                ctx.strokeStyle = '#270e02';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const tMidGrad = ctx.createRadialGradient(cx - rTurretMid * 0.25, cy - rTurretMid * 0.25, 0, cx, cy, rTurretMid);
                tMidGrad.addColorStop(0.00, '#ffffff');
                tMidGrad.addColorStop(0.35, '#cbd5e1');
                tMidGrad.addColorStop(0.65, '#64748b');
                tMidGrad.addColorStop(0.90, '#334155');
                tMidGrad.addColorStop(1.00, '#0f172a');

                ctx.beginPath();
                ctx.arc(cx, cy, rTurretMid, 0, 2 * Math.PI);
                ctx.fillStyle = tMidGrad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, cy, rTurretMid, 0, 2 * Math.PI);
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const lx = cx - rTurretTop * 0.35;
                const ly = cy - rTurretTop * 0.35;
                const orbGrad = ctx.createRadialGradient(lx, ly, rTurretTop * 0.05, cx, cy, rTurretTop);
                orbGrad.addColorStop(0.00, '#ffffff');
                orbGrad.addColorStop(0.20, '#f8fafc');
                orbGrad.addColorStop(0.50, '#94a3b8');
                orbGrad.addColorStop(0.80, '#475569');
                orbGrad.addColorStop(1.00, '#0f172a');

                ctx.beginPath();
                ctx.arc(cx, cy, rTurretTop, 0, 2 * Math.PI);
                ctx.fillStyle = orbGrad;
                ctx.shadowColor = 'rgba(0,0,0,0.85)';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;

                const spotGrad = ctx.createRadialGradient(lx, ly, 0, lx, ly, rTurretTop * 0.45);
                spotGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.95)');
                spotGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.55)');
                spotGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');

                ctx.beginPath();
                ctx.arc(lx, ly, rTurretTop * 0.45, 0, 2 * Math.PI);
                ctx.fillStyle = spotGrad;
                ctx.fill();
            }
            ctx.restore();
        }

        function drawOverlayWheel(targetSp = null) {
            const canvas = document.getElementById('overlayWheelCanvas');
            if (!canvas) return;
            const sp = targetSp || (config && config.spinner) || {};
            const ptrContainer = document.getElementById('overlayWheelPointer');
            if (ptrContainer) {
                ptrContainer.innerHTML = getWheelPointerHTML(sp.pointerTheme || 'brass_chevron', sp.pointerIcon || '');
            }
            drawRealisticWheel(canvas, sp);
        }

        function triggerWheelAnimation(winnerSlice, ev = {}) {
            if (isWheelActive) return;
            isWheelActive = true;

            const modal = document.getElementById('wheelOverlayModal');
            const title = document.getElementById('wheelOverlayTitle');
            const canvasBox = document.getElementById('overlayCanvasWheelBox');
            const reelBox = document.getElementById('overlayReelBox');
            const banner = document.getElementById('wheelWinnerBanner');

            banner.className = 'winner-banner';
            banner.innerText = '';
            modal.classList.add('active');

            // Resolve target spinner configuration
            const allSpinners = (config && config.spinners && Array.isArray(config.spinners)) ? config.spinners : (config && config.spinner ? [config.spinner] : []);
            let targetSp = null;
            if (ev.spinnerId) {
                targetSp = allSpinners.find(s => s.id === ev.spinnerId);
            }
            if (!targetSp && ev.spinnerName) {
                targetSp = allSpinners.find(s => (s.name || '').toLowerCase() === ev.spinnerName.toLowerCase());
            }
            if (!targetSp) {
                targetSp = (config && config.spinner) || allSpinners[0] || {};
            }

            // Apply luxury theme parameters from event if provided
            if (ev.wheelTheme) targetSp.wheelTheme = ev.wheelTheme;
            if (ev.centerFinial) targetSp.centerFinial = ev.centerFinial;
            if (ev.pointerTheme) targetSp.pointerTheme = ev.pointerTheme;
            if (ev.wheelRarityStyle) targetSp.wheelRarityStyle = ev.wheelRarityStyle;
            if (ev.reelTheme) targetSp.reelTheme = ev.reelTheme;

            const mode = ev.mode || targetSp.mode || (config && config.spinner && config.spinner.mode) || 'wheel';
            const durationMs = ev.duration || targetSp.duration || (config && config.spinner && config.spinner.duration) || 4500;
            const spinnerTitle = ev.spinnerName || targetSp.name || (config && config.spinner && config.spinner.name) || 'LUCKY ROULETTE';

            if (mode === 'reel') {
                if (title) title.innerText = spinnerTitle.toUpperCase();
                if (canvasBox) canvasBox.style.display = 'none';
                if (reelBox) reelBox.style.display = 'block';

                const outer = document.getElementById('overlayReelOuter');
                const track = document.getElementById('overlayReelTrack');
                const ptrImg = document.getElementById('overlayPointerImg');
                const pointerSrc = ev.pointerIcon || targetSp.pointerIcon || (config && config.spinner && config.spinner.pointerIcon);
                if (ptrImg && pointerSrc) {
                    ptrImg.src = pointerSrc;
                }

                const rTheme = targetSp.reelTheme || 'casino_felt';
                track.className = 's2e-reel-track theme-' + rTheme;

                const slices = (ev.slices && ev.slices.length > 0) ? ev.slices : ((config && config.spinner && config.spinner.slices) ? config.spinner.slices : []);
                if (!slices || slices.length === 0) {
                    isWheelActive = false;
                    modal.classList.remove('active');
                    return;
                }

                const actualWinner = winnerSlice || slices[0];
                const targetIndex = 35;
                const cardList = [];
                for (let i = 0; i < 46; i++) {
                    if (i === targetIndex) {
                        cardList.push(actualWinner);
                    } else {
                        const randomSlice = slices[Math.floor(Math.random() * slices.length)];
                        cardList.push(randomSlice);
                    }
                }

                let trackHtml = '';
                cardList.forEach((slice, idx) => {
                    const rarity = slice.rarity || 'Normal';
                    const rarityClass = `rarity-${rarity.toLowerCase()}`;
                    const isNum = (slice.isNumber === true) || (slice.actionType === 'score') || (slice.delta !== undefined && slice.delta !== null && Number(slice.delta) !== 0) || /^[\+\-\u2212\u2013]?\s*\d+$/.test(String(slice.label || ''));
                    const isPlantZombie = (slice.actionType === 'plant' || slice.actionType === 'zombie' || slice.actionType === 'power');
                    const isScoreSlice = isNum && !isPlantZombie;

                    if (isScoreSlice) {
                        const cleanLabel = String(slice.label || '').replace(/[\u2212\u2013\u2014]/g, '-').trim();
                        let dVal = slice.delta !== undefined ? Number(slice.delta) : parseInt(cleanLabel, 10);
                        if (isNaN(dVal)) dVal = 0;
                        const col = slice.color || (dVal >= 0 ? '#10b981' : '#f43f5e');
                        const displayNum = (dVal > 0 ? `+${dVal}` : `${dVal}`);
                        const signText = dVal >= 0 ? 'WIN +' : 'LOSE -';

                        trackHtml += `
                            <div class="s2e-reel-card ${rarityClass}" id="overlayReelCard_${idx}" style="border-color:${col}; box-shadow:0 0 16px ${col}40;">
                                <div class="card-glow-bg" style="background:radial-gradient(circle, ${col}25 0%, transparent 70%);"></div>
                                <span class="rarity-tag" style="border-color:${col}; color:${col};">${rarity}</span>
                                <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px;">
                                    <div style="font-family:'Outfit', sans-serif; font-size:38px; font-weight:900; color:${col}; text-shadow:0 0 12px ${col}; line-height:1;">${displayNum}</div>
                                    <div style="font-size:10px; font-weight:800; color:${dVal >= 0 ? '#34d399' : '#f87171'}; margin-top:4px;">${signText}</div>
                                </div>
                            </div>
                        `;
                    } else {
                        const imgUrl = slice.unitIcon || slice.icon || 'images/func_2.png';
                        trackHtml += `
                            <div class="s2e-reel-card ${rarityClass}" id="overlayReelCard_${idx}">
                                <div class="card-glow-bg"></div>
                                <span class="rarity-tag">${rarity}</span>
                                <div class="card-img-wrap">
                                    <img src="${imgUrl}" onerror="this.src='images/func_2.png'" alt="${slice.label}">
                                </div>
                                <div class="card-title">${slice.label}</div>
                                <div class="card-amount">x${slice.amount || 1}</div>
                            </div>
                        `;
                    }
                });

                track.style.transition = 'none';
                track.style.transform = 'translateX(0px)';
                track.innerHTML = trackHtml;
                void track.offsetWidth; // Force reflow

                if (config && config.spinner && config.spinner.hideEventInOverlay) {
                    isWheelActive = false;
                    modal.classList.remove('active');
                    return;
                }

                // BULLETPROOF EXACT MEASUREMENT FROM DOM
                const targetCardEl = document.getElementById(`overlayReelCard_${targetIndex}`);
                const cardCenterInTrack = targetCardEl.offsetLeft + (targetCardEl.offsetWidth / 2);
                const outerCenter = outer.offsetWidth / 2;
                const stopOffset = cardCenterInTrack - outerCenter;

                track.style.transition = `transform ${durationMs}ms cubic-bezier(0.12, 0.95, 0.18, 1)`;
                track.style.transform = `translateX(-${stopOffset}px)`;

                // Dynamic ticking audio
                let tickCount = 0;
                const totalTicks = 32;
                let currentTickDelay = 70;
                function scheduleReelTick() {
                    if (!isWheelActive || tickCount >= totalTicks) return;
                    AudioEngine.playTick();
                    tickCount++;
                    currentTickDelay = 70 + Math.pow(tickCount / totalTicks, 3) * 360;
                    setTimeout(scheduleReelTick, currentTickDelay);
                }
                setTimeout(scheduleReelTick, 100);

                setTimeout(() => {
                    const winningCardEl = document.getElementById(`overlayReelCard_${targetIndex}`);
                    if (winningCardEl) {
                        winningCardEl.style.transform = 'scale(1.1)';
                        winningCardEl.style.boxShadow = '0 0 30px #ffffff, 0 0 50px var(--pvz-gold)';
                        winningCardEl.style.zIndex = '15';
                    }
                    AudioEngine.playVictory();
                    const isWinnerNum = (actualWinner.isNumber === true) || (actualWinner.actionType === 'score') || (actualWinner.delta !== undefined && actualWinner.delta !== null && Number(actualWinner.delta) !== 0) || /^[\+\-\u2212\u2013]?\s*\d+$/.test(String(actualWinner.label || ''));
                    const isWinnerPlantZombie = (actualWinner.actionType === 'plant' || actualWinner.actionType === 'zombie' || actualWinner.actionType === 'power');
                    if (isWinnerNum && !isWinnerPlantZombie) {
                        const cleanLabel = String(actualWinner.label || '').replace(/[\u2212\u2013\u2014]/g, '-').trim();
                        let dVal = actualWinner.delta !== undefined ? Number(actualWinner.delta) : parseInt(cleanLabel, 10);
                        if (isNaN(dVal)) dVal = 0;
                        const isPos = dVal >= 0;
                        banner.innerHTML = `<span style="color:#ffffff;">WON:</span> <span style="color:${isPos ? '#10b981' : '#f43f5e'}; font-weight:900;">${isPos ? '+' : ''}${dVal} ${isPos ? '(Score Added to WIN!)' : '(Score Deducted!)'}</span>`;
                    } else {
                        banner.innerHTML = `<span style="color:#ffffff;">WON:</span> <span style="color:${actualWinner.color || '#f59e0b'};">${actualWinner.label}</span> <span style="font-size:18px; color:#94a3b8;">(x${actualWinner.amount || 1})</span>`;
                    }
                    banner.classList.add('show');

                    setTimeout(() => {
                        modal.classList.remove('active');
                        isWheelActive = false;
                    }, 3500);
                }, durationMs + 100);

            } else {
                // Classic canvas wheel mode
                if (title) title.innerText = spinnerTitle.toUpperCase();
                if (canvasBox) canvasBox.style.display = 'block';
                if (reelBox) reelBox.style.display = 'none';

                const canvas = document.getElementById('overlayWheelCanvas');
                drawOverlayWheel(targetSp);

                const slices = (ev.slices && ev.slices.length > 0) ? ev.slices : ((targetSp && targetSp.slices) ? targetSp.slices : ((config && config.spinner && config.spinner.slices) ? config.spinner.slices : []));
                let winIdx = slices.findIndex(s => winnerSlice && s.id === winnerSlice.id);
                if (winIdx === -1) winIdx = 0;

                const sliceAngle = 360 / (slices.length || 8);
                // Winning slice center is at (winIdx + 0.5) * sliceAngle in canvas space (where 0 deg = 3 o'clock).
                // The pin indicator is at the top (12 o'clock = 270 deg).
                const targetNormalized = ((270 - (winIdx + 0.5) * sliceAngle) % 360 + 360) % 360;
                const currentMod = ((wheelRotation % 360) + 360) % 360;
                let delta = (targetNormalized - currentMod) % 360;
                if (delta <= 0) delta += 360;
                const totalRotation = wheelRotation + (360 * 5) + delta;
                wheelRotation = totalRotation;

                let ticks = 0;
                const tickInterval = setInterval(() => {
                    AudioEngine.playTick();
                    ticks++;
                    if (ticks > 25) clearInterval(tickInterval);
                }, 160);

                canvas.style.transform = `rotate(${totalRotation}deg)`;

                setTimeout(() => {
                    clearInterval(tickInterval);
                    AudioEngine.playVictory();
                    const prizeLabel = winnerSlice ? winnerSlice.label : 'Mystery Prize';
                    banner.innerText = `WON: ${prizeLabel}!`;
                    banner.classList.add('show');

                    setTimeout(() => {
                        modal.classList.remove('active');
                        isWheelActive = false;
                    }, 3500);
                }, durationMs);
            }
        }
    </script>
