<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Green Energy Sparkles -->
  <circle cx="35" cy="45" r="3" fill="#6ee7b7" opacity="0.9" />
  <circle cx="165" cy="50" r="3.5" fill="#a7f3d0" opacity="0.85" />
  <polygon points="160,35 162,42 168,44 162,46 160,52 158,46 152,44 158,42" fill="#d1fae5" opacity="0.9" />

  <!-- Side Leaves Wings -->
  <path d="M 65 55 C 20 60, 20 115, 68 115 C 55 95, 55 75, 65 55 Z" fill="url(#leafGrad)" stroke="#065f46" stroke-width="2" />
  <path d="M 135 55 C 180 60, 180 115, 132 115 C 145 95, 145 75, 135 55 Z" fill="url(#leafGrad)" stroke="#065f46" stroke-width="2" />

  <!-- Main Emerald Cup -->
  <path d="M 60 40 L 140 40 C 140 75, 130 120, 100 135 C 70 120, 60 75, 60 40 Z" fill="url(#emeraldGrad)" stroke="#064e3b" stroke-width="3" filter="url(#emeraldGlow)" />
  
  <!-- Rim -->
  <ellipse cx="100" cy="40" rx="40" ry="7" fill="#a7f3d0" stroke="#059669" stroke-width="2" />

  <!-- PvZ Sun Flower / Leaf Emblem in Center -->
  <circle cx="100" cy="85" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  <circle cx="100" cy="85" r="11" fill="#f59e0b" />
  <path d="M 97 80 Q 100 76 103 80 Q 105 85 100 87 Q 95 85 97 80 Z" fill="#fffbeb" opacity="0.8" />

  <!-- Stem & Root Base -->
  <path d="M 94 135 L 106 135 L 108 158 L 92 158 Z" fill="url(#emeraldGrad)" stroke="#064e3b" stroke-width="2" />
  <ellipse cx="100" cy="158" rx="16" ry="4" fill="#6ee7b7" />
  <path d="M 75 160 L 125 160 L 135 182 L 65 182 Z" fill="#064e3b" stroke="#047857" stroke-width="2" />
  <rect x="76" y="165" width="48" height="11" rx="2" fill="#059669" stroke="#6ee7b7" stroke-width="1" />
</svg>
