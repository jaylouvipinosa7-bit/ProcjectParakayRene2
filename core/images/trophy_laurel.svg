<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="laurelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="laurelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sparkles -->
  <polygon points="165,30 167,37 174,39 167,41 165,48 163,41 156,39 163,37" fill="#fef08a" opacity="0.9" />
  <polygon points="35,35 36.5,40 41.5,41.5 36.5,43 35,48 33.5,43 28.5,41.5 33.5,40" fill="#fde047" opacity="0.85" />

  <!-- Left Laurel Wreath -->
  <g fill="url(#laurelGold)" stroke="#b45309" stroke-width="1.5">
    <ellipse cx="45" cy="50" rx="9" ry="16" transform="rotate(-35 45 50)" />
    <ellipse cx="35" cy="75" rx="9" ry="16" transform="rotate(-15 35 75)" />
    <ellipse cx="35" cy="105" rx="9" ry="16" transform="rotate(10 35 105)" />
    <ellipse cx="45" cy="132" rx="9" ry="16" transform="rotate(35 45 132)" />
    <ellipse cx="65" cy="152" rx="9" ry="16" transform="rotate(60 65 152)" />
  </g>

  <!-- Right Laurel Wreath -->
  <g fill="url(#laurelGold)" stroke="#b45309" stroke-width="1.5">
    <ellipse cx="155" cy="50" rx="9" ry="16" transform="rotate(35 155 50)" />
    <ellipse cx="165" cy="75" rx="9" ry="16" transform="rotate(15 165 75)" />
    <ellipse cx="165" cy="105" rx="9" ry="16" transform="rotate(-10 165 105)" />
    <ellipse cx="155" cy="132" rx="9" ry="16" transform="rotate(-35 155 132)" />
    <ellipse cx="135" cy="152" rx="9" ry="16" transform="rotate(-60 135 152)" />
  </g>

  <!-- Center Victory Crest Shield -->
  <path d="M 68 45 L 132 45 Q 132 105 100 138 Q 68 105 68 45 Z" fill="url(#shieldGrad)" stroke="url(#laurelGold)" stroke-width="3.5" filter="url(#laurelGlow)" />

  <!-- Inner Gold Trim -->
  <path d="M 76 52 L 124 52 Q 124 98 100 124 Q 76 98 76 52 Z" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.8" />

  <!-- Center Big Star -->
  <polygon points="100,64 104,78 118,79 108,88 112,102 100,94 88,102 92,88 82,79 96,78" fill="url(#laurelGold)" stroke="#b45309" stroke-width="1.5" />

  <!-- Bottom Gold Ribbon Tie -->
  <path d="M 90 152 Q 100 160 110 152 Q 118 168 122 178 L 108 172 L 100 176 L 92 172 L 78 178 Q 82 168 90 152 Z" fill="url(#laurelGold)" stroke="#92400e" stroke-width="2" />
  <circle cx="100" cy="156" r="6" fill="#fef08a" stroke="#b45309" stroke-width="2" />
</svg>
