<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="zombBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#19022e"/>
    </radialGradient>
    <filter id="zombGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" fill="url(#zombBg)" stroke="#a855f7" stroke-width="3" filter="url(#zombGlow)"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <ellipse cx="50" cy="24" rx="22" ry="10" fill="rgba(255,255,255,0.18)"/>
  <!-- Stylized PvZ Zombie Head / Skull Icon -->
  <g transform="translate(50, 46) scale(0.95)">
    <!-- Zombie Cranium -->
    <path d="M -16,-12 C -16,-22 16,-22 16,-12 C 16,-4 14,8 11,14 L -11,14 C -14,8 -16,-4 -16,-12 Z" fill="#65a30d" stroke="#3f6212" stroke-width="2"/>
    <!-- Tie / Collar -->
    <polygon points="0,14 -4,22 0,26 4,22" fill="#dc2626"/>
    <!-- Yellow Undead Eyes -->
    <circle cx="-6" cy="-8" r="4.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="6" cy="-8" r="3.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="-6" cy="-8" r="1.5" fill="#000000"/>
    <circle cx="6" cy="-8" r="1.2" fill="#000000"/>
    <!-- Teeth / Grin -->
    <rect x="-8" y="2" width="4" height="5" fill="#ffffff" stroke="#3f6212" stroke-width="0.8"/>
    <rect x="-3" y="2" width="4" height="6" fill="#fef08a" stroke="#3f6212" stroke-width="0.8"/>
    <rect x="2" y="2" width="4" height="5" fill="#ffffff" stroke="#3f6212" stroke-width="0.8"/>
    <rect x="6" y="2" width="3" height="4" fill="#ffffff" stroke="#3f6212" stroke-width="0.8"/>
  </g>
  <text x="50" y="86" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" fill="#d8b4fe" text-anchor="middle" letter-spacing="1">ZOMBIE</text>
</svg>
