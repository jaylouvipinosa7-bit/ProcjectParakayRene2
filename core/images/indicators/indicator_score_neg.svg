<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="negBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="60%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0406"/>
    </radialGradient>
    <filter id="negGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.6"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" fill="url(#negBg)" stroke="#f43f5e" stroke-width="3" filter="url(#negGlow)"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <ellipse cx="50" cy="24" rx="22" ry="10" fill="rgba(255,255,255,0.18)"/>
  <!-- Negative Minus / Points Deduction Icon -->
  <rect x="26" y="44" width="48" height="12" rx="6" fill="#ffe4e6" stroke="#991b1b" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
  <text x="50" y="78" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#fca5a5" text-anchor="middle" letter-spacing="1">PTS -</text>
</svg>
