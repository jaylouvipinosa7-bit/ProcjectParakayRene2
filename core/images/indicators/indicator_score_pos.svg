<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="posBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011812"/>
    </radialGradient>
    <filter id="posGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" fill="url(#posBg)" stroke="#10b981" stroke-width="3" filter="url(#posGlow)"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <ellipse cx="50" cy="24" rx="22" ry="10" fill="rgba(255,255,255,0.18)"/>
  <!-- Positive Plus / Points Addition Icon -->
  <rect x="26" y="44" width="48" height="12" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
  <rect x="44" y="26" width="12" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
  <text x="50" y="82" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">PTS +</text>
</svg>
