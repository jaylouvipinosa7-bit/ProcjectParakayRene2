<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Top Streak Overlay</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --streak-rose: #f43f5e;
            --streak-light: #fb7185;
            --streak-glow: rgba(244, 63, 94, 0.7);
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Oxanium", sans-serif;
            user-select: none;
        }

        .streak-stage {
            position: relative;
            width: 320px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
        }

        .icon-stage {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        /* ─── Fiery Spinning Sunburst Rays ─── */
        .sunburst-bg {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            opacity: 0.9;
            animation: spinStreakRays 18s linear infinite;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.5) 0%, rgba(225, 29, 72, 0.22) 55%, transparent 72%),
                        repeating-conic-gradient(from 0deg, rgba(251, 113, 133, 0.52) 0deg 12deg, transparent 12deg 30deg);
            box-shadow: 0 0 50px rgba(244, 63, 94, 0.7);
        }

        @keyframes spinStreakRays {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Aura Breathe */
        .streak-aura {
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(244, 63, 94, 0.5), rgba(225, 29, 72, 0.15) 45%, transparent 70%);
            animation: streakAuraBreathe 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes streakAuraBreathe {
            0%, 100% { transform: scale(0.92); opacity: 0.7; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* Shockwave Ring Wave */
        .streak-ring-wave {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            border: 2.5px solid rgba(251, 113, 133, 0.9);
            box-shadow: 0 0 24px rgba(244, 63, 94, 0.75), inset 0 0 16px rgba(225, 29, 72, 0.45);
            animation: streakRingWave 4.8s ease-out infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes streakRingWave {
            0%, 60%, 100% { transform: scale(0.55); opacity: 0; }
            65% { opacity: 0.95; }
            82% { transform: scale(1.26); opacity: 0; }
        }

        .ray-ring {
            position: absolute;
            width: 176px;
            height: 176px;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
            border: 2.5px solid rgba(251, 113, 133, 0.85);
            box-shadow: 0 0 24px rgba(244, 63, 94, 0.85);
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            z-index: 4;
            pointer-events: none;
            animation: pulseSparkle 2s ease-in-out infinite alternate;
        }

        @keyframes pulseSparkle {
            0% { transform: scale(0.7) rotate(0deg); opacity: 0.5; }
            100% { transform: scale(1.2) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 8px #ffeb3b); }
        }

        /* ─── 3D Flipping Disc (Gift <-> Profile) ─── */
        .flip-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            z-index: 3;
            perspective: 1000px;
        }

        .flip-disc {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform-style: preserve-3d;
            transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .flip-disc.flipped {
            transform: rotateY(180deg);
        }

        .flip-face {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .face-front {
            transform: rotateY(0deg) translateZ(1px);
            background: rgba(28, 12, 20, 0.92);
            border: 2px solid rgba(251, 113, 133, 0.55);
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }

        .face-back {
            transform: rotateY(180deg) translateZ(1px);
            background: radial-gradient(circle, #4c0519 0%, #1f020a 100%);
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 24px rgba(244, 63, 94, 0.95);
        }

        .gift-img-center {
            width: 104px;
            height: 104px;
            object-fit: contain;
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.85));
            animation: streakGiftFloat 4s ease-in-out infinite;
        }

        @keyframes streakGiftFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-5%) rotate(-2deg) scale(1.03); }
            50% { transform: translateY(-1%) rotate(0deg) scale(1); }
            75% { transform: translateY(-5%) rotate(2deg) scale(1.03); }
        }

        /* Shine Sweep Beam */
        .gift-shine-sweep {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }

        .gift-shine-sweep::after {
            content: "";
            position: absolute;
            top: -40%;
            bottom: -40%;
            left: 0;
            width: 45%;
            background: linear-gradient(104deg, transparent 15%, rgba(255, 255, 255, 0.9) 50%, transparent 85%);
            transform: translateX(-180%) skewX(-14deg);
            animation: streakShineSweep 5s linear infinite;
        }

        @keyframes streakShineSweep {
            0%, 58% { transform: translateX(-180%) skewX(-14deg); opacity: 0; }
            62% { opacity: 1; }
            72% { transform: translateX(300%) skewX(-14deg); opacity: 0; }
            100% { transform: translateX(300%) skewX(-14deg); opacity: 0; }
        }

        .avatar-img-back {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ─── Streak Multiplier Floating Badge ─── */
        .streak-badge {
            position: absolute;
            bottom: 4px;
            right: 8px;
            z-index: 6;
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 50%, #e11d48 100%);
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            padding: 5px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 18px rgba(244, 63, 94, 0.75), inset 0 2px 4px rgba(255, 255, 255, 0.6);
            border: 2px solid #ffffff;
            animation: badgeBounce 1.5s ease-in-out infinite alternate;
            letter-spacing: -0.5px;
        }

        @keyframes badgeBounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        .anim-pop {
            animation: streakPunch 0.65s cubic-bezier(0.34, 1.4, 0.64, 1) !important;
        }

        @keyframes streakPunch {
            0% { transform: scale(0.8) rotate(-6deg); }
            50% { transform: scale(1.3) rotate(6deg); filter: brightness(1.4); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }

        /* ─── Bottom Info Pill & Shimmer ─── */
        .info-pill {
            z-index: 5;
            background: linear-gradient(135deg, rgba(32, 14, 22, 0.96), rgba(18, 8, 14, 0.98));
            border: 1.5px solid rgba(251, 113, 133, 0.55);
            border-radius: 16px;
            padding: 8px 22px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.8), 0 0 18px rgba(244, 63, 94, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: transform 0.2s ease;
        }

        .info-top-tag {
            font-size: 11px;
            font-weight: 900;
            color: #fb7185;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(251, 113, 133, 0.5);
        }

        .info-main-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.2px;
            background: linear-gradient(96deg, #ffffff, #ffe4e6 50%, #fb7185 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .info-sub-value {
            font-size: 13px;
            font-weight: 800;
            background: linear-gradient(96deg, #fb7185, #ffffff 40%, #f43f5e 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 260% 100%;
            animation: streakTextShift 6s linear infinite;
        }

        @keyframes streakTextShift {
            0% { background-position: 0 50%; }
            100% { background-position: 260% 50%; }
        }
    </style>
</head>
<body>

    <div class="streak-stage" id="streakStage">
        <div class="icon-stage">
            <div class="sunburst-bg"></div>
            <div class="streak-aura"></div>
            <div class="streak-ring-wave"></div>
            <div class="ray-ring"></div>

            <!-- Floating Sparkles -->
            <svg class="sparkle" style="top: 14px; left: 16px;" width="18" height="18" viewBox="0 0 24 24" fill="#ffeb3b">
                <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
            </svg>
            <svg class="sparkle" style="bottom: 18px; left: 20px; animation-delay: 1.2s;" width="16" height="16" viewBox="0 0 24 24" fill="#ffeb3b">
                <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
            </svg>

            <!-- 3D Flipping Disc (Center Gift & Gifter Avatar) -->
            <div class="flip-wrapper">
                <div class="flip-disc" id="flipDisc">
                    <div class="flip-face face-front">
                        <div class="gift-shine-sweep"></div>
                        <img id="streakGiftImg" src="images/tiktok-gifts/5655_rose.webp" alt="Streak Gift" class="gift-img-center" onerror="this.src='images/tiktok-gifts/7934_heart_me.webp'">
                    </div>
                    <div class="flip-face face-back">
                        <img id="streakAvatarImg" src="images/renearn_icon.png" alt="Streak Gifter Avatar" class="avatar-img-back" onerror="this.src='images/renearn_icon.png'">
                    </div>
                </div>
            </div>

            <!-- Bouncing Combo Multiplier Badge -->
            <div class="streak-badge" id="streakBadge">5x</div>
        </div>

        <div class="info-pill" id="infoPill">
            <span class="info-top-tag" id="topTag">TOP STREAK</span>
            <span class="info-main-title" id="giftNameText">Rose</span>
            <span class="info-sub-value" id="streakGifterSubText">Stream viewer • 5 Combo</span>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let currentGift = 'Rose';
        let currentGifter = 'Stream viewer';
        let highestCombo = 5;
        let isFlipped = false;

        function triggerStreakPunch() {
            const badge = document.getElementById('streakBadge');
            const pill = document.getElementById('infoPill');
            badge.classList.remove('anim-pop');
            void badge.offsetWidth;
            badge.classList.add('anim-pop');
            pill.style.transform = 'scale(1.08)';
            setTimeout(() => { pill.style.transform = 'scale(1)'; }, 350);
        }

        function updateTopStreak(name, giftName, icon, combo, avatar) {
            currentGifter = name || currentGifter;
            currentGift = giftName || currentGift;
            highestCombo = Math.max(highestCombo, Number(combo) || 1);

            document.getElementById('giftNameText').textContent = currentGift;
            document.getElementById('streakBadge').textContent = `${highestCombo}x`;
            document.getElementById('streakGifterSubText').textContent = `${currentGifter} • ${highestCombo} Combo`;

            if (icon) {
                document.getElementById('streakGiftImg').src = icon;
            }
            if (avatar) {
                document.getElementById('streakAvatarImg').src = avatar;
            }

            triggerStreakPunch();

            const disc = document.getElementById('flipDisc');
            disc.classList.add('flipped');
            setTimeout(() => { disc.classList.remove('flipped'); }, 2200);
        }

        // Auto-cycle disc flip every 6s
        setInterval(() => {
            const disc = document.getElementById('flipDisc');
            isFlipped = !isFlipped;
            if (isFlipped) {
                disc.classList.add('flipped');
            } else {
                disc.classList.remove('flipped');
            }
        }, 6000);

        // Real-time Event polling from local TikTok bridge
        let lastEventTimestamp = Date.now() - 5000;
        setInterval(async () => {
            try {
                const res = await fetch(`/api/events?since=${lastEventTimestamp}&t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.serverTime) lastEventTimestamp = data.serverTime;
                    if (data.events && Array.isArray(data.events)) {
                        for (const ev of data.events) {
                            if (ev.type === 'gift' || ev.type === 'jar_drop') {
                                const repeat = Number(ev.repeat_count) || Number(ev.count) || 1;
                                if (repeat >= highestCombo) {
                                    updateTopStreak(ev.username || 'RENEarn', ev.giftName || 'Gift', ev.icon || '', repeat, ev.avatar || '');
                                }
                            }
                        }
                    }
                }
            } catch (e) {}
        }, 350);
    </script>
</body>
</html>
