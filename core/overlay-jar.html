<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENEarn - Interactive Gift Jar Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script src="matter.min.js"></script>
    <style>
        :root {
            --accent-glow: rgba(56, 189, 248, 0.4);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: transparent;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SCREEN LAYOUT WRAPPER (FOR SIDE-BY-SIDE ON-SCREEN DOCK) */
        .overlay-screen-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .overlay-screen-wrap.dock-right {
            flex-direction: row-reverse;
        }

        .on-screen-ranking-dock {
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 45;
            transition: all 0.3s ease;
        }

        .on-screen-ranking-dock.active {
            display: flex;
        }

        .embedded-ranking-iframe {
            border: none;
            background: transparent;
            width: 330px;
            height: 640px;
            overflow: hidden;
        }

        .embedded-ranking-iframe.dual-card {
            width: 670px;
        }

        /* CONTAINER */
        .jar-overlay-container {
            position: relative;
            width: 480px;
            height: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 24px;
            pointer-events: auto;
        }

        /* TOP COUNTER & CAPACITY BAR */
        .jar-header-hud {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 50;
            pointer-events: none;
            width: 320px;
            transition: opacity 0.3s ease;
        }

        .hud-pill {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(56, 189, 248, 0.35);
            border-radius: 9999px;
            padding: 5px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(56, 189, 248, 0.2);
        }

        .hud-icon {
            font-size: 14px;
            animation: bounce-subtle 2s infinite;
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .hud-title {
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .hud-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 800;
            color: #38bdf8;
        }

        .hud-progress-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .hud-track {
            height: 7px;
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .hud-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #10b981, #facc15);
            border-radius: 9999px;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        /* JAR WRAPPER WITH CRYSTAL DEPTH HALO */
        .jar-stage {
            position: relative;
            width: 440px;
            height: 540px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center bottom;
        }

        .jar-stage::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 8%;
            width: 84%;
            height: 84%;
            background: radial-gradient(ellipse at 50% 62%, rgba(56, 189, 248, 0.08) 0%, rgba(15, 23, 42, 0.42) 50%, rgba(15, 23, 42, 0) 72%);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            filter: blur(8px);
        }

        /* PHYSICS CANVAS */
        #physicsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 440px;
            height: 540px;
            z-index: 20;
            pointer-events: none;
        }

        /* JAR GLASS SKINS (ULTRA-SHARP, HIGH-CONTRAST FOR ALL STREAM BACKGROUNDS) */
        .jar-glass-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 10;
            opacity: 1;
            filter: contrast(148%) brightness(115%) drop-shadow(0 0 18px rgba(56, 189, 248, 0.45)) drop-shadow(0 16px 32px rgba(0,0,0,0.92));
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .jar-glass-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 30;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.65;
            filter: contrast(135%) brightness(125%);
            transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
        }

        /* TRAPDOOR SLIDE DUMP HATCH */
        .jar-trapdoor-lid {
            position: absolute;
            bottom: 34px;
            left: 24%;
            width: 52%;
            height: 10px;
            background: linear-gradient(90deg, #1e293b, #475569, #1e293b);
            border-radius: 5px;
            border: 1px solid #94a3b8;
            box-shadow: 0 4px 14px rgba(0,0,0,0.8), 0 0 10px rgba(56, 189, 248, 0.4);
            transform-origin: left center;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
        }

        .jar-stage.trapdoor-open .jar-trapdoor-lid {
            opacity: 1;
            transform: rotate(82deg) translateY(4px);
        }

        /* VIBRATION & SHATTER ANIMATIONS */
        .jar-stage.shake {
            animation: jar-shake 0.35s infinite;
        }

        @keyframes jar-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 2px) rotate(-1.5deg); }
            40% { transform: translate(4px, -2px) rotate(1.5deg); }
            60% { transform: translate(-3px, -1px) rotate(-0.8deg); }
            80% { transform: translate(3px, 2px) rotate(0.8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .jar-stage.shattering .jar-glass-front,
        .jar-stage.shattering .jar-glass-back {
            filter: contrast(220%) brightness(160%);
            animation: glass-shatter-pulse 0.9s forwards;
        }

        @keyframes glass-shatter-pulse {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.08); opacity: 0.85; filter: hue-rotate(60deg); }
            100% { transform: scale(0.92) translateY(50px); opacity: 0; }
        }

        /* RECENT GIFTER FLOATING ALERT */
        .drop-alert-toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 1.5px solid #38bdf8;
            border-radius: 9999px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 20px rgba(56, 189, 248, 0.3);
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .drop-alert-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .drop-toast-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #38bdf8;
            object-fit: cover;
        }

        .drop-toast-text {
            font-size: 11.5px;
            font-weight: 800;
            color: #f8fafc;
        }

        .drop-toast-user {
            color: #fde047;
        }

        .drop-toast-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        /* FULL CELEBRATION OVERLAY */
        .full-banner {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(245, 158, 11, 0.95));
            border: 2px solid #fef08a;
            border-radius: 20px;
            padding: 12px 28px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8), 0 0 30px rgba(245, 158, 11, 0.6);
            z-index: 70;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .full-banner.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .full-banner-title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .full-banner-sub {
            font-size: 12px;
            font-weight: 800;
            color: #fef08a;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="overlay-screen-wrap" id="overlayScreenWrap">
        <!-- ON-SCREEN RANKING LEADERBOARD DOCK -->
        <div class="on-screen-ranking-dock" id="onScreenRankingDock">
            <iframe id="embeddedLeaderboardFrame" class="embedded-ranking-iframe" src="" allowtransparency="true"></iframe>
        </div>

        <div class="jar-overlay-container" id="jarContainer">
            <!-- TOP HUD -->
            <div class="jar-header-hud" id="jarHud">
                <div class="hud-pill">
                    <span class="hud-icon">🏺</span>
                    <span class="hud-title" id="txtJarTitle">TikTok Gift Jar</span>
                    <span class="hud-count" id="txtJarCount">0 / 80</span>
                </div>
                <div class="hud-progress-wrap">
                    <div class="hud-track">
                        <div class="hud-fill" id="jarFillBar"></div>
                    </div>
                </div>
            </div>

            <!-- JAR STAGE -->
            <div class="jar-stage" id="jarStage">
                <img id="imgJarBack" class="jar-glass-back" src="images/jars/jar_mason.png" alt="Jar Back">
                <canvas id="physicsCanvas" width="440" height="540"></canvas>
                <div class="jar-trapdoor-lid" id="jarTrapdoorLid"></div>
                <img id="imgJarFront" class="jar-glass-front" src="images/jars/jar_mason.png" alt="Jar Front">
            </div>

            <!-- RECENT DROP ALERT TOAST -->
            <div class="drop-alert-toast" id="dropAlertToast">
                <img src="images/default_avatar.svg" id="toastAvatar" class="drop-toast-avatar" alt="Gifter">
                <span class="drop-toast-text" id="toastText">
                    <span class="drop-toast-user" id="toastUser">@Viewer</span> dropped Rose x1
                </span>
                <img src="images/tiktok-gifts/5655_rose.webp" id="toastGiftIcon" class="drop-toast-icon" alt="Gift">
            </div>

            <!-- JAR FULL CELEBRATION BANNER -->
            <div class="full-banner" id="fullBanner">
                <div class="full-banner-title" id="fullBannerTitle">🎉 JAR FULL! 🎉</div>
                <div class="full-banner-sub" id="fullBannerSub">Mega Reward Unleashed!</div>
            </div>
        </div>
    </div>

    <script>
        // Module aliases from Matter.js
        const { Engine, World, Bodies, Body, Composite } = Matter;

        // Settings State
        let settings = {
            skin: 'mason',
            customSkinUrl: '',
            jarScale: 1.0,
            maxCapacity: 80,
            capacityMode: 'price',
            coinGoal: 500,
            gravity: 1.0,
            bounciness: 0.4,
            friction: 0.1,
            giftScale: 1.0,
            soundEnabled: true,
            soundVolume: 0.5,
            showGifterBadge: true,
            showCounterBar: true,
            showGiftBorder: false,
            resetBehavior: 'explosion',
            triggerGameEventOnFull: false,
            gameCommandOnFull: '',
            jarTitle: 'TikTok Gift Jar'
        };

        let currentCount = 0;
        let currentCoins = 0;
        let isResetting = false;
        let toastTimeout = null;
        let celebrationTimeout = null;
        let launchTimeout = null;

        // Available Skins Map
        const skinImageMap = {
            'mason': 'images/jars/jar_mason.png',
            'piggy': 'images/jars/jar_piggy.png',
            'fishbowl': 'images/jars/jar_fishbowl.png',
            'crate': 'images/jars/jar_crate.png',
            'decanter': 'images/jars/jar_decanter.png'
        };

        // Popular TikTok Gifts Catalog with Verified Local WebP Assets
        const POPULAR_TIKTOK_GIFTS = [
            { name: 'Rose', id: '5655', icon: 'images/tiktok-gifts/5655_rose.webp', coins: 1 },
            { name: 'Heart Me', id: '7934', icon: 'images/tiktok-gifts/7934_heart_me.webp', coins: 1 },
            { name: 'TikTok', id: '5269', icon: 'images/tiktok-gifts/5269_tiktok.webp', coins: 1 },
            { name: 'Ice Cream Cone', id: '5827', icon: 'images/tiktok-gifts/5827_ice_cream_cone.webp', coins: 1 },
            { name: 'Finger Heart', id: '5487', icon: 'images/tiktok-gifts/5487_finger_heart.webp', coins: 5 },
            { name: 'GG', id: '6064', icon: 'images/tiktok-gifts/6064_gg.webp', coins: 1 },
            { name: 'Cap', id: '6104', icon: 'images/tiktok-gifts/6104_cap.webp', coins: 99 },
            { name: 'Doughnut', id: '5879', icon: 'images/tiktok-gifts/5879_doughnut.webp', coins: 30 },
            { name: 'Panda', id: '5659', icon: 'images/tiktok-gifts/5659_panda.webp', coins: 5 },
            { name: 'Cake Slice', id: '6784', icon: 'images/tiktok-gifts/6784_cake_slice.webp', coins: 1 },
            { name: 'Hearts', id: '5586', icon: 'images/tiktok-gifts/5586_hearts.webp', coins: 199 },
            { name: 'Bibingka', id: '6027', icon: 'images/tiktok-gifts/6027_bibingka.webp', coins: 10 },
            { name: 'Rose Bear', id: '15862', icon: 'images/tiktok-gifts/15862_rose_bear.webp', coins: 1000 }
        ];
        let clickGiftIndex = 0;

        // Verified TikTok Gifts Catalog Map (Lookup for all 673+ live stream gifts)
        const verifiedGiftsMap = new Map();
        const verifiedGiftsByName = new Map();

        // Seed with popular gifts immediately so lookups work with 0ms delay
        POPULAR_TIKTOK_GIFTS.forEach(g => {
            verifiedGiftsMap.set(g.id, g);
            verifiedGiftsByName.set(g.name.toLowerCase(), g);
        });

        async function loadVerifiedGiftsCatalog() {
            try {
                const res = await fetch('/tiktok_gifts_verified.json?t=' + Date.now());
                if (res.ok) {
                    const list = await res.json();
                    if (Array.isArray(list)) {
                        list.forEach(g => {
                            if (g.id) verifiedGiftsMap.set(String(g.id).trim(), g);
                            if (g.name) verifiedGiftsByName.set(String(g.name).trim().toLowerCase(), g);
                        });
                    }
                }
            } catch (e) {}
        }

        // Preloaded Sprite Image Cache
        const imageCache = new Map();
        function getCachedImage(src) {
            if (!src) return null;
            if (imageCache.has(src)) return imageCache.get(src);
            const img = new Image();
            img.src = src;
            imageCache.set(src, img);
            return img;
        }

        // Immediately preload all popular gift art so images are complete right away
        POPULAR_TIKTOK_GIFTS.forEach(g => {
            getCachedImage(g.icon);
        });

        // Genuine Gift Asset Resolver (Maps gift name/id to real TikTok WebP art)
        function resolveGiftAsset(giftName, giftId, iconUrl) {
            let name = String(giftName || '').trim();
            let id = String(giftId || '').trim();
            let icon = String(iconUrl || '').trim();

            // 1. If explicit valid icon given (not default avatar or empty)
            if (icon && icon !== 'images/default_avatar.svg' && !icon.includes('default_avatar')) {
                return { name: name || 'Rose', icon: icon };
            }

            // 2. Exact or clean match by giftId in verified map
            if (id && verifiedGiftsMap.has(id)) {
                const vg = verifiedGiftsMap.get(id);
                return {
                    name: name || vg.name || 'Rose',
                    icon: vg.icon || vg.cdnIcon || 'images/tiktok-gifts/5655_rose.webp'
                };
            }

            // 3. Name lookup in verifiedGiftsByName
            const clean = name.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (clean) {
                if (verifiedGiftsByName.has(clean)) {
                    const vg = verifiedGiftsByName.get(clean);
                    return {
                        name: name || vg.name,
                        icon: vg.icon || vg.cdnIcon || 'images/tiktok-gifts/5655_rose.webp'
                    };
                }
                const foundPop = POPULAR_TIKTOK_GIFTS.find(p => {
                    const pClean = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                    return pClean === clean || pClean.includes(clean) || clean.includes(pClean);
                });
                if (foundPop) {
                    return { name: foundPop.name, icon: foundPop.icon };
                }
            }

            // 4. Default fallback: cycle through popular TikTok gifts (NEVER fallback to plain blue 🎁 ball)
            const fallback = POPULAR_TIKTOK_GIFTS[clickGiftIndex % POPULAR_TIKTOK_GIFTS.length];
            return {
                name: (name && name !== 'Gift') ? name : fallback.name,
                icon: fallback.icon
            };
        }

        // Web Audio Synthesizer
        let audioCtx = null;
        function playDropSound(pitchMultiplier = 1) {
            if (!settings.soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                const baseFreq = 2200 * pitchMultiplier + (Math.random() * 200 - 100);
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);

                const vol = Math.max(0.01, Math.min(1.0, settings.soundVolume || 0.5));
                gain.gain.setValueAtTime(vol * 0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } catch (e) {}
        }

        function playResetSound(type = 'explosion') {
            if (!settings.soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const vol = Math.max(0.01, Math.min(1.0, settings.soundVolume || 0.5));

                if (type === 'classic') {
                    // Soft gentle coin reset chime
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1318.51, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
                    gain.gain.setValueAtTime(vol * 0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'dump') {
                    // Mechanical hatch open / slide whoosh
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.4);
                    gain.gain.setValueAtTime(vol * 0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'shatter') {
                    // High-frequency glass crunch
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(3200, now);
                    osc.frequency.exponentialRampToValueAtTime(280, now + 0.3);
                    gain.gain.setValueAtTime(vol * 0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.38);
                } else {
                    // Explosive burst pop
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(70, now + 0.38);
                    gain.gain.setValueAtTime(vol * 0.45, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                }
            } catch (e) {}
        }

        // Setup Matter.js Physics Engine
        const engine = Engine.create({
            enableSleeping: false,
            positionIterations: 12,
            velocityIterations: 8
        });
        engine.gravity.y = 1.5;

        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');
        const stageW = 440;
        const stageH = 540;

        let jarWalls = [];
        let jarFloorBodies = [];
        let activeFxParticles = [];

        // Helper to construct precise static boundary walls
        function createWallSegment(x1, y1, x2, y2, thickness = 26, wallOpts = {}) {
            const cx = (x1 + x2) / 2;
            const cy = (y1 + y2) / 2;
            const len = Math.hypot(x2 - x1, y2 - y1) + thickness;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            return Bodies.rectangle(cx, cy, len, thickness, {
                isStatic: true,
                angle: angle,
                friction: 0.25,
                restitution: 0.1,
                render: { visible: false },
                ...wallOpts
            });
        }

        function createContourWalls(points, thickness = 26, wallOpts = {}) {
            const walls = [];
            for (let i = 0; i < points.length - 1; i++) {
                const seg = createWallSegment(points[i][0], points[i][1], points[i + 1][0], points[i + 1][1], thickness, wallOpts);
                // Tag bottom floor segments for trapdoor dumping
                if (Math.abs(points[i][1] - points[i + 1][1]) < 4 && points[i][1] > 420) {
                    seg.isFloor = true;
                    jarFloorBodies.push(seg);
                }
                walls.push(seg);
            }
            return walls;
        }

        // Apply visual skin
        function updateJarSkin(skinName, customUrl) {
            settings.skin = skinName || 'mason';
            const imgSrc = (customUrl && customUrl.trim()) ? customUrl.trim() : (skinImageMap[skinName] || skinImageMap.mason);

        // Dynamic particle burst generators
        function triggerConfettiBurst() {
            const colors = ['#f59e0b', '#ef4444', '#10b981', '#38bdf8', '#8b5cf6', '#ec4899', '#fde047'];
            for (let i = 0; i < 52; i++) {
                activeFxParticles.push({
                    type: 'confetti',
                    x: stageW / 2 + (Math.random() - 0.5) * 80,
                    y: stageH / 2 + 60,
                    vx: (Math.random() - 0.5) * 16,
                    vy: -11 - Math.random() * 12,
                    size: 6 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.35,

                });
            }
        }

        function triggerGlassShardBurst() {
            for (let i = 0; i < 28; i++) {
                activeFxParticles.push({
                    type: 'shard',
                    x: stageW / 2 + (Math.random() - 0.5) * 160,

        // Add gift physical body
        function dropGiftItem(giftName, iconUrl, coinVal = 1) {
            if (isResetting) return;

            // Always resolve authentic TikTok gift asset (Rose, Heart Me, Ice Cream, etc.)
            const resolved = resolveGiftAsset(giftName, null, iconUrl);
            const actualName = resolved.name;
            const actualIcon = resolved.icon;

            const isPriceMode = (settings.capacityMode === 'price');
            const scaleMultiplier = Math.max(0.4, Math.min(2.2, parseFloat(settings.giftScale || 1.0)));
            const baseR = 18 * scaleMultiplier * (coinVal > 50 ? 1.25 : (coinVal > 10 ? 1.1 : 1.0));
            const radius = Math.round(Math.min(42, Math.max(8, baseR)));
            const cx = stageW / 2;

            let spawnSpread = 20;
            let spawnY = 25;

            if (settings.skin === 'mason') {
                spawnSpread = 40;
                spawnY = 25;
            } else if (settings.skin === 'crate') {
                spawnSpread = 50;
                spawnY = 25;
            } else if (settings.skin === 'fishbowl') {
                spawnSpread = 30;
                spawnY = 20;
            } else if (settings.skin === 'decanter') {
                spawnSpread = 16;
                spawnY = 15;
            } else if (settings.skin === 'piggy') {
                spawnSpread = 20;
                spawnY = 35;
            }

            const spawnX = cx + (Math.random() - 0.5) * spawnSpread;
            const bounciness = (settings.bounciness !== undefined && settings.bounciness !== null) ? parseFloat(settings.bounciness) : 0.4;

            const giftBody = Bodies.circle(spawnX, spawnY, radius, {
                restitution: bounciness,
                friction: settings.friction || 0.1,
                frictionAir: 0.015,
                density: 0.0025,
                angle: (Math.random() - 0.5) * 0.5
            });

            Body.setVelocity(giftBody, {
                x: (Math.random() - 0.5) * 0.5,
                y: 3.5 + Math.random() * 1.5
            });
            Body.setAngularVelocity(giftBody, (Math.random() - 0.5) * 0.08);

            giftBody.customGift = {
                name: actualName,
                iconUrl: actualIcon,
                radius: radius,
                coins: coinVal,
                createdAt: Date.now()
            };

            if (actualIcon) {
                getCachedImage(actualIcon);
            }

            World.add(engine.world, giftBody);
            currentCount++;
            currentCoins += (coinVal || 1);
            updateHud();
            playDropSound(coinVal > 10 ? 1.2 : 1.0);

            // Capacity threshold check
            const targetLimit = isPriceMode ? (settings.coinGoal || 500) : (settings.maxCapacity || 80);
            const currentProgress = isPriceMode ? currentCoins : currentCount;

            if (!isResetting && currentProgress >= targetLimit) {
                triggerJarFullCelebration();
            }
        }

        // Multi-drop for combo packets
        function queueGiftDrops(giftName, iconUrl, count, coins) {
            const safeCount = Math.min(25, Math.max(1, count || 1));
            const unitCoins = Math.max(1, Math.round((coins || count || 1) / safeCount));

            for (let i = 0; i < safeCount; i++) {
                setTimeout(() => {
                    dropGiftItem(giftName, iconUrl, unitCoins);
                }, i * 85);
            }
        }

        // Toast Notification for gifters
        function showDropToast(username, giftName, count, iconUrl, avatarUrl) {
            if (!settings.showGifterBadge) return;
            const toast = document.getElementById('dropAlertToast');
            const uEl = document.getElementById('toastUser');
            const tEl = document.getElementById('toastText');
            const avEl = document.getElementById('toastAvatar');
            const icEl = document.getElementById('toastGiftIcon');

            uEl.innerText = username ? `@${username}` : '@Viewer';
            tEl.innerHTML = `<span class="drop-toast-user">@${username || 'Viewer'}</span> dropped ${count || 1}x ${giftName || 'Gift'}`;
            if (avatarUrl) avEl.src = avatarUrl;
            if (iconUrl) {
                icEl.src = iconUrl;
                icEl.style.display = 'block';
            } else {
                icEl.style.display = 'none';
            }

            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Update HUD Counter & Capacity Bar
        function updateHud() {
            const isPriceMode = (settings.capacityMode === 'price');
            const targetLimit = isPriceMode ? (settings.coinGoal || 500) : (settings.maxCapacity || 80);
            const currentProgress = isPriceMode ? currentCoins : currentCount;

            const countEl = document.getElementById('txtJarCount');
            const fillEl = document.getElementById('jarFillBar');
            const titleEl = document.getElementById('txtJarTitle');
            const hudEl = document.getElementById('jarHud');

            if (!settings.showCounterBar) {
                hudEl.style.opacity = '0';
                return;
            } else {
                hudEl.style.opacity = '1';
            }

            titleEl.innerText = settings.jarTitle || (isPriceMode ? '🪙 TikTok Coin Jar' : '🏺 TikTok Gift Jar');
            countEl.innerText = isPriceMode ? `🪙 ${currentCoins} / ${targetLimit}` : `🏺 ${currentCount} / ${targetLimit}`;
            const pct = Math.min(100, Math.round((currentProgress / targetLimit) * 100));
            fillEl.style.width = `${pct}%`;

            if (pct >= 85) {
                fillEl.style.background = 'linear-gradient(90deg, #f59e0b, #ef4444)';
            } else {
                fillEl.style.background = 'linear-gradient(90deg, #38bdf8, #10b981, #facc15)';
            }
        }

        // FULL JAR RESET CELEBRATIONS
        function triggerJarFullCelebration() {
            if (isResetting) return;
            isResetting = true;

            const stage = document.getElementById('jarStage');
            const banner = document.getElementById('fullBanner');
            const titleEl = document.getElementById('fullBannerTitle');
            const subEl = document.getElementById('fullBannerSub');
            const behavior = settings.resetBehavior || 'explosion';

            // 1. CLASSIC: Instant, clean reset without special effects
            if (behavior === 'classic') {
                playResetSound('classic');
                resetJarQuietly();
                fetch('/api/jar/reset', { method: 'POST' }).catch(() => {});
                return;
            }

            // 2. TRAPDOOR SLIDE DUMP: Open bottom hatch and plunge gifts down
            if (behavior === 'dump') {
                titleEl.innerText = '🚪 TRAPDOOR DUMP! 🚪';
                subEl.innerText = 'Emptying jar out the bottom hatch!';
                banner.classList.add('active');
                stage.classList.add('trapdoor-open');
                playResetSound('dump');

                // Remove floor collision walls so gifts fall through
                if (jarFloorBodies.length > 0) {
                    jarFloorBodies.forEach(fb => World.remove(engine.world, fb));
                }

                // Apply downward velocity plunge
                const allBodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
                allBodies.forEach(b => {
                    b.frictionAir = 0.005;
                    Body.setVelocity(b, {
                        x: (Math.random() - 0.5) * 2,
                        y: 9 + Math.random() * 5
                    });
                });

                if (celebrationTimeout) clearTimeout(celebrationTimeout);
                celebrationTimeout = setTimeout(() => {
                    resetJarQuietly();
                    fetch('/api/jar/reset', { method: 'POST' }).catch(() => {});
                }, 3000);
                return;
            }

            // 3. EXPLOSIVE BURST: Confetti burst & launch outward
            if (behavior === 'explosion') {
                titleEl.innerText = '🎉 EXPLOSIVE BURST! 🎉';
                subEl.innerText = 'Jar full celebration blast!';
                banner.classList.add('active');
                stage.classList.add('shake');
                playResetSound('explosion');
                triggerConfettiBurst();

                const allBodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
                allBodies.forEach(b => {
                    const forceX = (b.position.x - stageW / 2) * 0.003 + (Math.random() - 0.5) * 0.08;
                    const forceY = -0.18 - Math.random() * 0.14;
                    Body.applyForce(b, b.position, { x: forceX, y: forceY });
                    Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.35);
                });

                if (launchTimeout) clearTimeout(launchTimeout);
                launchTimeout = setTimeout(() => {
                    allBodies.forEach(b => { b.collisionFilter.mask = 0; });
                }, 350);

                if (celebrationTimeout) clearTimeout(celebrationTimeout);
                celebrationTimeout = setTimeout(() => {
                    resetJarQuietly();
                    fetch('/api/jar/reset', { method: 'POST' }).catch(() => {});
                }, 3000);
                return;
            }

            // 4. GLASS SHATTER: Fracture & crystal shard burst
            if (behavior === 'shatter') {
                titleEl.innerText = '✨ GLASS SHATTER! ✨';
                subEl.innerText = 'Jar fractured & bursting!';
                banner.classList.add('active');
                stage.classList.add('shake', 'shattering');
                playResetSound('shatter');
                triggerGlassShardBurst();

                const allBodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
                allBodies.forEach(b => {
                    const forceX = (b.position.x - stageW / 2) * 0.005 + (Math.random() - 0.5) * 0.12;
                    const forceY = -0.12 - Math.random() * 0.1;
                    Body.applyForce(b, b.position, { x: forceX, y: forceY });
                    b.collisionFilter.mask = 0;
                });

                if (celebrationTimeout) clearTimeout(celebrationTimeout);
                celebrationTimeout = setTimeout(() => {
                    resetJarQuietly();
                    fetch('/api/jar/reset', { method: 'POST' }).catch(() => {});
                }, 3000);
            }
        }

        // Clean quiet reset without looping or re-triggering celebration
        function resetJarQuietly() {
            if (launchTimeout) clearTimeout(launchTimeout);
            if (celebrationTimeout) clearTimeout(celebrationTimeout);

            const allBodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
            allBodies.forEach(b => World.remove(engine.world, b));
            currentCount = 0;
            currentCoins = 0;
            updateHud();

            const stage = document.getElementById('jarStage');
            const banner = document.getElementById('fullBanner');
            if (stage) stage.classList.remove('shake', 'shattering', 'trapdoor-open');
            if (banner) banner.classList.remove('active');

            activeFxParticles = [];
            buildJarBoundaries(settings.skin);
            isResetting = false;
        }

        // Custom Physics Render Loop
        function renderLoop() {
            Engine.update(engine, 1000 / 60);

            ctx.clearRect(0, 0, stageW, stageH);

            // 1. Render all gift bodies
            const allBodies = Composite.allBodies(engine.world);
            allBodies.forEach(body => {
                if (body.isStatic || !body.customGift) return;

                const { position, angle, customGift } = body;
                const r = customGift.radius;
                const img = customGift.iconUrl ? getCachedImage(customGift.iconUrl) : null;

                ctx.save();
                ctx.translate(position.x, position.y);
                ctx.rotate(angle);

                // Optional outlined border around gift (only drawn if user enabled setting)
                if (settings.showGiftBorder === true) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, r + 2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
                    ctx.fill();
                    ctx.lineWidth = 2.0;
                    ctx.strokeStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(56, 189, 248, 0.7)';
                    ctx.shadowBlur = 4;
                    ctx.stroke();
                    ctx.restore();
                }

                if (img && img.complete && img.naturalWidth > 0) {
                    const isRose = (customGift.name && customGift.name.toLowerCase().includes('rose')) ||
                                   (customGift.iconUrl && customGift.iconUrl.toLowerCase().includes('rose'));
                    if (isRose) {
                        const roseSize = r * 2.4;
                        ctx.drawImage(img, -roseSize / 2, -roseSize / 2, roseSize, roseSize);
                    } else {
                        const itemSize = r * 2.1;
                        ctx.drawImage(img, -itemSize / 2, -itemSize / 2, itemSize, itemSize);
                    }
                } else {
                    // Preload if not yet cached
                    if (customGift.iconUrl) getCachedImage(customGift.iconUrl);

                    // Stylized glowing authentic gift token
                    const isRose = (customGift.name && customGift.name.toLowerCase().includes('rose')) || (customGift.iconUrl && customGift.iconUrl.toLowerCase().includes('rose'));
                    const isHeart = (customGift.name && customGift.name.toLowerCase().includes('heart')) || (customGift.iconUrl && customGift.iconUrl.toLowerCase().includes('heart'));
                    const coinColor = isRose ? '#f43f5e' : (isHeart ? '#ec4899' : ((customGift.coins >= 100) ? '#a855f7' : (customGift.coins >= 10 ? '#f59e0b' : '#38bdf8')));
                    const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 1, 0, 0, r);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, coinColor);
                    grad.addColorStop(1, '#0f172a');

                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${Math.max(10, Math.round(r * 0.72))}px Outfit, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const labelText = isRose ? '🌹' : (isHeart ? '💖' : (customGift.coins > 1 ? `${customGift.coins}` : '🌹'));
                    ctx.fillText(labelText, 0, 1);
                }

                ctx.restore();
            });

            // 2. Render celebration particles (Confetti & Glass Shards)
            if (activeFxParticles.length > 0) {
                for (let i = activeFxParticles.length - 1; i >= 0; i--) {
                    const p = activeFxParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += (p.type === 'confetti' ? 0.35 : 0.28);
                    p.rot += p.vRot;
                    p.life -= 0.016;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;

                    if (p.type === 'confetti') {
                        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(0, -p.size / 2);
                        ctx.lineTo(p.size / 2, p.size / 2);
                        ctx.lineTo(-p.size / 3, p.size / 3);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                    ctx.restore();

                    if (p.life <= 0 || p.y > stageH + 60) {
                        activeFxParticles.splice(i, 1);
                    }
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // Sync Settings from Server
        async function loadJarSettings() {
            try {
                const res = await fetch('/api/jar/settings?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data) {
                        settings = { ...settings, ...data };
                        if (urlParams.get('skin')) settings.skin = urlParams.get('skin');
                        if (urlParams.get('cap')) settings.maxCapacity = parseInt(urlParams.get('cap'), 10);
                        if (urlParams.get('hideHud') === 'true') settings.showCounterBar = false;
                        applySettings();
                    }
                }
            } catch (e) {}
        }

        function applySettings() {
            // 1. Gravity Force
            engine.gravity.y = parseFloat(settings.gravity !== undefined ? settings.gravity : 1.0) * 1.5;

            // 2. Bounciness & Gift Scale updates on existing bodies
            const bounciness = parseFloat(settings.bounciness !== undefined ? settings.bounciness : 0.4);
            const scaleMultiplier = Math.max(0.4, Math.min(2.2, parseFloat(settings.giftScale || 1.0)));

            Composite.allBodies(engine.world).forEach(b => {
                if (!b.isStatic && b.customGift) {
                    b.restitution = bounciness;
                    const oldR = b.customGift.radius || 18;
                    const targetBase = 18 * scaleMultiplier * (b.customGift.coins > 50 ? 1.25 : (b.customGift.coins > 10 ? 1.1 : 1.0));
                    const targetR = Math.round(Math.min(42, Math.max(8, targetBase)));
                    if (targetR !== oldR && oldR > 0) {
                        const ratio = targetR / oldR;
                        Body.scale(b, ratio, ratio);
                        b.customGift.radius = targetR;
                    }
                }
            });

            // 3. Jar skin & boundaries
            updateJarSkin(settings.skin || 'mason', settings.customSkinUrl);

            // 4. HUD
            updateHud();
        }

        // Sync Initial State from Server
        async function loadJarState() {
            try {
                const res = await fetch('/api/jar/state?t=' + Date.now());
                if (res.ok) {
                    const st = await res.json();
                    if (st) {
                        currentCount = parseInt(st.currentCount || 0, 10);
                        currentCoins = parseInt(st.totalCoins || 0, 10);
                        updateHud();
                    }
                }
            } catch (e) {}
        }

        // Live Event Polling & Multi-channel Sync (TikTok LIVE Studio, OBS & Main App Preview)
        let lastEventTimestamp = Date.now() - 5000;
        let isPollingEvents = false;
        const processedEventIds = new Set();

        function processIncomingJarEvent(payload) {
            if (!payload) return;
            const eventKey = payload.id || (payload.type + '_' + (payload.timestamp || '') + '_' + (payload.giftName || payload.name || payload.label || '') + '_' + (payload.count || payload.repeatCount || ''));
            if (eventKey && processedEventIds.has(eventKey)) return;
            if (eventKey) {
                processedEventIds.add(eventKey);
                if (processedEventIds.size > 500) {
                    const first = processedEventIds.values().next().value;
                    processedEventIds.delete(first);
                }
            }

            if (payload.type === 'jar_drop' || payload.type === 'gift' || payload.type === 'unconfigured_gift' || payload.action === 'drop_gift') {
                const gName = String(payload.giftName || payload.name || payload.label || 'Rose').trim();
                const gId = String(payload.giftId || payload.id || '').trim();
                const rawIcon = payload.icon || payload.giftPictureUrl || '';

                const resolved = resolveGiftAsset(gName, gId, rawIcon);
                const finalName = resolved.name;
                const finalIcon = resolved.icon;

                const gCount = parseInt(payload.count || payload.repeatCount || payload.amount || 1, 10);
                const gCoins = parseInt(payload.coins || gCount || 1, 10);
                const uName = payload.username || 'Viewer';
                const uAvatar = payload.avatar || payload.profilePictureUrl || 'images/default_avatar.svg';

                queueGiftDrops(finalName, finalIcon, gCount, gCoins);
                showDropToast(uName, finalName, gCount, finalIcon, uAvatar);
            } else if (payload.type === 'jar_reset' || payload.action === 'reset_jar') {
                resetJarQuietly();
            } else if (payload.type === 'jar_settings_update' || payload.action === 'settings_update') {
                if (payload.settings) {
                    settings = { ...settings, ...payload.settings };
                    applySettings();
                } else {
                    loadJarSettings();
                }
            }
        }

        function startLiveEventPolling() {
            // 1. BroadcastChannel for instant local inter-tab communication (0ms latency)
            try {
                const bc = new BroadcastChannel('renearn_jar_events');
                bc.onmessage = function(e) {
                    if (!e.data) return;
                    if (e.data.type === 'jar_settings_update') {
                        if (e.data.settings) {
                            settings = { ...settings, ...e.data.settings };
                            applySettings();
                        } else {
                            loadJarSettings();
                        }
                    } else if (e.data.type === 'jar_reset') {
                        resetJarQuietly();
                    } else {
                        processIncomingJarEvent(e.data);
                    }
                };
            } catch (err) {}

            // 2. Storage event listener for cross-window sync
            window.addEventListener('storage', (e) => {
                if (e.key === 'renearn_jar_drop_event' && e.newValue) {
                    try {
                        const data = JSON.parse(e.newValue);
                        processIncomingJarEvent(data);
                    } catch (err) {}
                }
                if (e.key === 'renearn_jar_reset_event' && e.newValue) {
                    resetJarQuietly();
                }
                if (e.key === 'renearn_jar_settings_event' && e.newValue) {
                    try {
                        const data = JSON.parse(e.newValue);
                        if (data && data.settings) {
                            settings = { ...settings, ...data.settings };
                            applySettings();
                        } else {
                            loadJarSettings();
                        }
                    } catch (err) { loadJarSettings(); }
                }
            });

            // 3. Reliable HTTP Polling on /api/events
            setInterval(async () => {
                if (isPollingEvents) return;
                isPollingEvents = true;
                try {
                    const res = await fetch(`/api/events?since=${lastEventTimestamp}&t=${Date.now()}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.serverTime) {
                            lastEventTimestamp = data.serverTime;
                        }
                        if (data.events && Array.isArray(data.events) && data.events.length > 0) {
                            data.events.forEach(ev => {
                                processIncomingJarEvent(ev);
                            });
                        }
                    }
                } catch (e) {
                } finally {
                    isPollingEvents = false;
                }
            }, 250);
        }

        // URL Query Param Overrides
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('skin')) settings.skin = urlParams.get('skin');
        if (urlParams.get('cap')) settings.maxCapacity = parseInt(urlParams.get('cap'), 10);
        if (urlParams.get('hideHud') === 'true') settings.showCounterBar = false;

        // On-Screen Ranking Leaderboard Dock Setup
        const showLeaderboard = urlParams.get('leaderboard') === 'true' || urlParams.has('ranking');
        const rankingType = urlParams.get('ranking') || (urlParams.get('leaderboard') === 'true' ? 'both' : '');
        const dockPos = urlParams.get('dock') || 'left';

        if (showLeaderboard) {
            const dock = document.getElementById('onScreenRankingDock');
            const frame = document.getElementById('embeddedLeaderboardFrame');
            const wrap = document.getElementById('overlayScreenWrap');
            if (dock && frame && wrap) {
                dock.classList.add('active');
                if (dockPos === 'right') wrap.classList.add('dock-right');
                const isDual = (rankingType === 'both' || rankingType === 'all' || !rankingType);
                if (isDual) frame.classList.add('dual-card');
                const typeParam = isDual ? '' : `&type=${rankingType}`;
                frame.src = `/overlay-leaderboard.html?clean=true${typeParam}`;
            }
        }

        // Expose globally for parent iframe and OBS interaction
        window.dropGiftItem = dropGiftItem;
        window.queueGiftDrops = queueGiftDrops;
        window.showDropToast = showDropToast;
        window.updateJarSkin = updateJarSkin;
        window.loadJarSettings = loadJarSettings;
        window.applySettings = applySettings;
        window.triggerJarFullCelebration = triggerJarFullCelebration;
        window.resetJarQuietly = resetJarQuietly;

        // Parent iframe postMessage bridge (deduplicated through processIncomingJarEvent)
        window.addEventListener('message', (e) => {
            if (!e.data) return;
            const d = e.data;
            if (d.action === 'change_skin' || d.type === 'change_skin') {
                updateJarSkin(d.skin, d.customUrl);
            } else if (d.action === 'settings_update' || d.type === 'settings_update') {
                if (d.settings) {
                    settings = { ...settings, ...d.settings };
                    applySettings();
                } else {
                    loadJarSettings();
                }
            } else if (d.action === 'drop_gift' || d.type === 'drop_gift') {
                processIncomingJarEvent(d);
            } else if (d.action === 'reset_jar' || d.type === 'reset_jar') {
                resetJarQuietly();
            }
        });

        // Quick testing controls when viewing overlay-jar.html directly
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'r' || e.key === 'R') {
                dropGiftItem('Rose', 'images/tiktok-gifts/5655_rose.webp', 1);
                showDropToast('Tester', 'Rose', 1, 'images/tiktok-gifts/5655_rose.webp', 'images/renearn_icon.png');
            } else if (e.key === 'g' || e.key === 'G') {
                dropGiftItem('Heart Me', 'images/tiktok-gifts/7934_heart_me.webp', 1);
                showDropToast('Tester', 'Heart Me', 1, 'images/tiktok-gifts/7934_heart_me.webp', 'images/renearn_icon.png');
            }
        });
        document.querySelector('.jar-stage')?.addEventListener('click', () => {
            const gift = POPULAR_TIKTOK_GIFTS[clickGiftIndex % POPULAR_TIKTOK_GIFTS.length];
            clickGiftIndex++;
            dropGiftItem(gift.name, gift.icon, gift.coins || 1);
            showDropToast('Viewer', gift.name, 1, gift.icon, 'images/renearn_icon.png');
        });

        // Init
        loadVerifiedGiftsCatalog();
        loadJarState();
        loadJarSettings().then(() => {
            applySettings();
        });
        startLiveEventPolling();
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
