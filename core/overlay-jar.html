<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENEarn - Interactive Gift Jar Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script src="matter.min.js"></script>
    <script src="stream-keepalive.js"></script>
    <style>
        :root {
            --accent-glow: rgba(56, 189, 248, 0.4);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: transparent;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SCREEN LAYOUT WRAPPER (FOR SIDE-BY-SIDE ON-SCREEN DOCK) */
        .overlay-screen-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .overlay-screen-wrap.dock-right {
            flex-direction: row-reverse;
        }

        .on-screen-ranking-dock {
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 45;
            transition: all 0.3s ease;
        }

        .on-screen-ranking-dock.active {
            display: flex;
        }

        .embedded-ranking-iframe {
            border: none;
            background: transparent;
            width: 330px;
            height: 640px;
            overflow: hidden;
        }

        .embedded-ranking-iframe.dual-card {
            width: 670px;
        }

        /* CONTAINER */
        .jar-overlay-container {
            position: relative;
            width: 480px;
            height: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 24px;
            pointer-events: auto;
        }

        /* TOP COUNTER & CAPACITY BAR (Hidden by default - overlay displays pure jar only) */
        .jar-header-hud {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 50;
            pointer-events: none;
            width: 320px;
            transition: opacity 0.3s ease;
        }

        .hud-pill {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(56, 189, 248, 0.35);
            border-radius: 9999px;
            padding: 5px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(56, 189, 248, 0.2);
        }

        .hud-icon {
            font-size: 14px;
            animation: bounce-subtle 2s infinite;
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .hud-title {
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .hud-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 800;
            color: #38bdf8;
        }

        .hud-progress-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .hud-track {
            height: 7px;
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .hud-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #10b981, #facc15);
            border-radius: 9999px;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        /* JAR WRAPPER WITH CRYSTAL DEPTH HALO */
        .jar-stage {
            position: relative;
            width: 440px;
            height: 540px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center bottom;
        }

        .jar-stage::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 8%;
            width: 84%;
            height: 84%;
            background: radial-gradient(ellipse at 50% 62%, rgba(56, 189, 248, 0.08) 0%, rgba(15, 23, 42, 0.42) 50%, rgba(15, 23, 42, 0) 72%);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            filter: blur(8px);
        }

        /* PHYSICS CANVAS */
        #physicsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 440px;
            height: 540px;
            z-index: 20;
            pointer-events: none;
        }

        /* JAR GLASS SKINS (ULTRA-SHARP, HIGH-CONTRAST FOR ALL STREAM BACKGROUNDS) */
        .jar-glass-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 10;
            opacity: 1;
            filter: contrast(148%) brightness(115%) drop-shadow(0 0 18px rgba(56, 189, 248, 0.45)) drop-shadow(0 16px 32px rgba(0,0,0,0.92));
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .jar-glass-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 30;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.65;
            filter: contrast(135%) brightness(125%);
            transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
        }

        /* TRAPDOOR SLIDE DUMP HATCH */
        .jar-trapdoor-lid {
            position: absolute;
            bottom: 34px;
            left: 24%;
            width: 52%;
            height: 10px;
            background: linear-gradient(90deg, #1e293b, #475569, #1e293b);
            border-radius: 5px;
            border: 1px solid #94a3b8;
            box-shadow: 0 4px 14px rgba(0,0,0,0.8), 0 0 10px rgba(56, 189, 248, 0.4);
            transform-origin: left center;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
        }

        .jar-stage.trapdoor-open .jar-trapdoor-lid {
            opacity: 1;
            transform: rotate(82deg) translateY(4px);
        }

        /* VIBRATION & SHATTER ANIMATIONS */
        .jar-stage.shake {
            animation: jar-shake 0.35s infinite;
        }

        @keyframes jar-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 2px) rotate(-1.5deg); }
            40% { transform: translate(4px, -2px) rotate(1.5deg); }
            60% { transform: translate(-3px, -1px) rotate(-0.8deg); }
            80% { transform: translate(3px, 2px) rotate(0.8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .jar-stage.shattering .jar-glass-front,
        .jar-stage.shattering .jar-glass-back {
            filter: contrast(220%) brightness(160%);
            animation: glass-shatter-pulse 0.9s forwards;
        }

        @keyframes glass-shatter-pulse {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.08); opacity: 0.85; filter: hue-rotate(60deg); }
            100% { transform: scale(0.92) translateY(50px); opacity: 0; }
        }

        /* RECENT GIFTER FLOATING ALERT */
        .drop-alert-toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 1.5px solid #38bdf8;
            border-radius: 9999px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 20px rgba(56, 189, 248, 0.3);
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .drop-alert-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .drop-toast-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #38bdf8;
            object-fit: cover;
        }

        .drop-toast-text {
            font-size: 11.5px;
            font-weight: 800;
            color: #f8fafc;
        }

        .drop-toast-user {
            color: #fde047;
        }

        .drop-toast-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        /* FULL CELEBRATION OVERLAY */
        .full-banner {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(245, 158, 11, 0.95));
            border: 2px solid #fef08a;
            border-radius: 20px;
            padding: 12px 28px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8), 0 0 30px rgba(245, 158, 11, 0.6);
            z-index: 70;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .full-banner.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .full-banner-title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .full-banner-sub {
            font-size: 12px;
            font-weight: 800;
            color: #fef08a;
            margin-top: 2px;
        }

        /* HOT FLAME TAG (PIGGY BANK & POTION VIAL) */
        .jar-premium-tag {
            position: absolute;
            top: 24px;
            right: 28px;
            background: linear-gradient(135deg, #ff1e42 0%, #ff5722 50%, #f59e0b 100%);
            color: #ffffff;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 9999px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 16px rgba(255, 30, 66, 0.7);
            border: 1.5px solid #ff758f;
            z-index: 45;
            text-transform: uppercase;
            display: none;
            pointer-events: none;
            animation: hotFlameShimmer 2s infinite ease-in-out;
            font-family: 'Outfit', sans-serif;
        }

        @keyframes hotFlameShimmer {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 6px rgba(255, 30, 66, 0.6)); transform: scale(1); }
            50% { filter: brightness(1.22) drop-shadow(0 0 14px rgba(255, 87, 34, 0.95)); transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="overlay-screen-wrap" id="overlayScreenWrap">
        <!-- ON-SCREEN RANKING LEADERBOARD DOCK -->
        <div class="on-screen-ranking-dock" id="onScreenRankingDock">
            <iframe id="embeddedLeaderboardFrame" class="embedded-ranking-iframe" src="" allowtransparency="true"></iframe>
        </div>

        <div class="jar-overlay-container" id="jarContainer">
            <!-- TOP HUD -->
            <div class="jar-header-hud" id="jarHud">
                <div class="hud-pill">
                    <span class="hud-icon">🏺</span>
                    <span class="hud-title" id="txtJarTitle">TikTok Gift Jar</span>
                    <span class="hud-count" id="txtJarCount">0 / 80</span>
                </div>
                <div class="hud-progress-wrap">
                    <div class="hud-track">
                        <div class="hud-fill" id="jarFillBar"></div>
                    </div>
                </div>
            </div>

            <!-- JAR STAGE -->
            <div class="jar-stage" id="jarStage">
                <div class="jar-premium-tag" id="jarPremiumTag">HOT 🔥</div>
                <img id="imgJarBack" class="jar-glass-back" src="images/jars/jar_mason.png" alt="Jar Back">
                <canvas id="physicsCanvas" width="440" height="540"></canvas>
                <div class="jar-trapdoor-lid" id="jarTrapdoorLid"></div>
                <img id="imgJarFront" class="jar-glass-front" src="images/jars/jar_mason.png" alt="Jar Front">
            </div>

            <!-- RECENT DROP ALERT TOAST -->
            <div class="drop-alert-toast" id="dropAlertToast">
                <img src="images/default_avatar.svg" id="toastAvatar" class="drop-toast-avatar" alt="Gifter">
                <span class="drop-toast-text" id="toastText">
                    <span class="drop-toast-user" id="toastUser">@Viewer</span> dropped Rose x1
                </span>
                <img src="images/tiktok-gifts/5655_rose.webp" id="toastGiftIcon" class="drop-toast-icon" alt="Gift">
            </div>

            <!-- JAR FULL CELEBRATION BANNER -->
            <div class="full-banner" id="fullBanner">
                <div class="full-banner-title" id="fullBannerTitle">🎉 JAR FULL! 🎉</div>
                <div class="full-banner-sub" id="fullBannerSub">Mega Reward Unleashed!</div>
            </div>
        </div>
    </div>

    <script>
        // Module aliases from Matter.js
        const { Engine, World, Bodies, Body, Composite } = Matter;

        // Settings State
        let settings = {
            skin: 'mason',
            customSkinUrl: '',
            jarScale: 1.0,
            maxCapacity: 80,
            capacityMode: 'price',
            coinGoal: 500,
            gravity: 1.0,
            bounciness: 0.4,
            friction: 0.1,
            giftScale: 1.0,
            soundEnabled: true,
            soundVolume: 0.5,
            showGifterBadge: true,
            showCounterBar: false,
            showGiftBorder: false,
            resetBehavior: 'explosion',
            triggerGameEventOnFull: false,
            gameCommandOnFull: '',
            jarTitle: 'TikTok Gift Jar'
        };

        let currentCount = 0;
        let currentCoins = 0;
        let isResetting = false;
        let toastTimeout = null;
        let celebrationTimeout = null;
        let launchTimeout = null;

        // Available Skins Map
        const skinImageMap = {
            'mason': 'images/jars/jar_mason.png',
            'piggy': 'images/jars/jar_piggy.png',
            'fishbowl': 'images/jars/jar_fishbowl.png',
            'crate': 'images/jars/jar_crate.png',
            'decanter': 'images/jars/jar_decanter.png'
        };

        // Popular TikTok Gifts Catalog with Verified Local WebP Assets
        const POPULAR_TIKTOK_GIFTS = [
            { name: 'Rose', id: '5655', icon: 'images/tiktok-gifts/5655_rose.webp', coins: 1 },
            { name: 'Heart Me', id: '7934', icon: 'images/tiktok-gifts/7934_heart_me.webp', coins: 1 },
            { name: 'TikTok', id: '5269', icon: 'images/tiktok-gifts/5269_tiktok.webp', coins: 1 },
            { name: 'Ice Cream Cone', id: '5827', icon: 'images/tiktok-gifts/5827_ice_cream_cone.webp', coins: 1 },
            { name: 'Finger Heart', id: '5487', icon: 'images/tiktok-gifts/5487_finger_heart.webp', coins: 5 },
            { name: 'GG', id: '6064', icon: 'images/tiktok-gifts/6064_gg.webp', coins: 1 },
            { name: 'Fried Chicken', id: '15328', icon: 'images/tiktok-gifts/15328_fried_chicken.webp', coins: 1 },
            { name: 'Arcade Game', id: '5876', icon: 'images/tiktok-gifts/5876_arcade_game.webp', coins: 1 },
            { name: 'Cap', id: '6104', icon: 'images/tiktok-gifts/6104_cap.webp', coins: 99 },
            { name: 'Doughnut', id: '5879', icon: 'images/tiktok-gifts/5879_doughnut.webp', coins: 30 },
            { name: 'Panda', id: '5659', icon: 'images/tiktok-gifts/5659_panda.webp', coins: 5 },
            { name: 'Cake Slice', id: '6784', icon: 'images/tiktok-gifts/6784_cake_slice.webp', coins: 1 },
            { name: 'Hearts', id: '5586', icon: 'images/tiktok-gifts/5586_hearts.webp', coins: 199 },
            { name: 'Hand Heart', id: '5660', icon: 'images/tiktok-gifts/5660_hand_heart.webp', coins: 100 },
            { name: 'Bibingka', id: '6027', icon: 'images/tiktok-gifts/6027_bibingka.webp', coins: 10 },
            { name: 'Confetti', id: '7121', icon: 'images/tiktok-gifts/7121_marvelous_confetti.webp', coins: 100 },
            { name: 'Money Gun', id: '5881', icon: 'images/tiktok-gifts/5881_money_gun.webp', coins: 500 },
            { name: 'Fireworks', id: '6090', icon: 'images/tiktok-gifts/6090_fireworks.webp', coins: 1088 },
            { name: 'Whale Diving', id: '6820', icon: 'images/tiktok-gifts/6820_whale_diving.webp', coins: 2150 },
            { name: 'Swan', id: '5897', icon: 'images/tiktok-gifts/5897_swan.webp', coins: 699 },
            { name: 'Corgi', id: '6267', icon: 'images/tiktok-gifts/6267_corgi.webp', coins: 299 },
            { name: 'Thumbs Up', id: '6246', icon: 'images/tiktok-gifts/6246_thumbs_up.webp', coins: 1 },
            { name: 'Perfume', id: 'perfume', icon: 'images/tiktok-gifts/5658_perfume.webp', coins: 20 },
            { name: 'Boxing Gloves', id: '6007', icon: 'images/tiktok-gifts/6007_boxing_gloves.webp', coins: 1 },
            { name: 'Galaxy', id: '11046', icon: 'images/tiktok-gifts/11046_galaxy.webp', coins: 1000 },
            { name: "Galaxy's Bestest", id: '657072', icon: 'images/tiktok-gifts/657072_galaxy_s_bestest.webp', coins: 300 },
            { name: 'Lion', id: '5962', icon: 'images/tiktok-gifts/5962_lion.webp', coins: 29999 },
            { name: 'Universe', id: '6059', icon: 'images/tiktok-gifts/6059_tiktok_universe.webp', coins: 34999 },
            { name: 'Rose Bear', id: '15862', icon: 'images/tiktok-gifts/15862_rose_bear.webp', coins: 1000 }
        ];
        let clickGiftIndex = 0;

        // Verified TikTok Gifts Catalog Map (Lookup for all 673+ live stream gifts)
        const verifiedGiftsMap = new Map();
        const verifiedGiftsByName = new Map();

        // Seed with popular gifts immediately so lookups work with 0ms delay
        POPULAR_TIKTOK_GIFTS.forEach(g => {
            verifiedGiftsMap.set(String(g.id), g);
            const raw = g.name.toLowerCase().trim();
            const clean = raw.replace(/[^a-z0-9]/g, '');
            verifiedGiftsByName.set(raw, g);
            verifiedGiftsByName.set(clean, g);
        });

        async function loadVerifiedGiftsCatalog() {
            try {
                const res = await fetch('/tiktok_gifts_verified.json?t=' + Date.now());
                if (res.ok) {
                    const list = await res.json();
                    if (Array.isArray(list)) {
                        list.forEach(g => {
                            if (g.id) verifiedGiftsMap.set(String(g.id).trim(), g);
                            if (g.name) {
                                const raw = String(g.name).trim().toLowerCase();
                                const clean = raw.replace(/[^a-z0-9]/g, '');
                                verifiedGiftsByName.set(raw, g);
                                verifiedGiftsByName.set(clean, g);
                            }
                        });
                    }
                }
            } catch (e) {}
        }

        // Preloaded Sprite Image Cache
        const imageCache = new Map();
        function getCachedImage(src) {
            if (!src) return null;
            if (imageCache.has(src)) return imageCache.get(src);
            const img = new Image();
            img.src = src;
            imageCache.set(src, img);
            return img;
        }

        // Immediately preload all popular gift art and gold coin so images are complete right away
        getCachedImage('images/jars/gold_coin.png');
        POPULAR_TIKTOK_GIFTS.forEach(g => {
            getCachedImage(g.icon);
        });

        // Genuine Gift Asset Resolver (Maps gift name/id to real TikTok WebP art)
        function resolveGiftAsset(giftName, giftId, iconUrl, coins = 1) {
            let name = String(giftName || '').trim();
            let id = String(giftId || '').trim();
            let icon = String(iconUrl || '').trim();
            const coinVal = parseInt(coins, 10) || 1;

            // Reject non-gift dummy icons
            const isNonGiftIcon = !icon || 
                                  icon === 'images/default_avatar.svg' || 
                                  icon.includes('default_avatar') || 
                                  icon.includes('game-icons') || 
                                  icon.includes('numbers/');

            // 1. If explicit valid image URL/path given (local webp or TikTok CDN or web URL)
            if (icon && !isNonGiftIcon && (icon.startsWith('http://') || icon.startsWith('https://') || icon.startsWith('images/') || icon.includes('.webp') || icon.includes('.png') || icon.includes('tiktok'))) {
                return { name: name || 'Gift', icon: icon };
            }

            // 2. Exact match by giftId in verified map
            if (id && verifiedGiftsMap.has(id)) {
                const vg = verifiedGiftsMap.get(id);
                return {
                    name: name || vg.name || 'Gift',
                    icon: vg.icon || vg.cdnIcon || 'images/tiktok-gifts/5655_rose.webp'
                };
            }

            // 3. Name lookup in verifiedGiftsByName or fuzzy match
            const clean = name.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (clean) {
                if (verifiedGiftsByName.has(clean)) {
                    const vg = verifiedGiftsByName.get(clean);
                    return {
                        name: name || vg.name,
                        icon: vg.icon || vg.cdnIcon || 'images/tiktok-gifts/5655_rose.webp'
                    };
                }
                const foundPop = POPULAR_TIKTOK_GIFTS.find(p => {
                    const pClean = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                    return pClean === clean || pClean.includes(clean) || clean.includes(pClean);
                });
                if (foundPop) {
                    return { name: foundPop.name, icon: foundPop.icon };
                }

                // Substring search in verified catalog
                for (const vg of verifiedGiftsMap.values()) {
                    if (vg.name) {
                        const vgClean = vg.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                        if (vgClean.includes(clean) || clean.includes(vgClean)) {
                            return { name: name || vg.name, icon: vg.icon || vg.cdnIcon || 'images/tiktok-gifts/5655_rose.webp' };
                        }
                    }
                }
            }

            // 4. Common keywords fallback
            const lower = name.toLowerCase();
            if (lower.includes('chicken')) return { name: 'Fried Chicken', icon: 'images/tiktok-gifts/15328_fried_chicken.webp' };

        // Web Audio Synthesizer
        let audioCtx = null;
        function playDropSound(pitchMultiplier = 1) {
            if (!settings.soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                const baseFreq = 2200 * pitchMultiplier + (Math.random() * 200 - 100);
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);

                const vol = Math.max(0.01, Math.min(1.0, settings.soundVolume || 0.5));
                gain.gain.setValueAtTime(vol * 0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } catch (e) {}
        }

        function playResetSound(type = 'explosion') {
            if (!settings.soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const vol = Math.max(0.01, Math.min(1.0, settings.soundVolume || 0.5));

                if (type === 'classic') {
                    // Soft gentle coin reset chime
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1318.51, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
                    gain.gain.setValueAtTime(vol * 0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'dump') {
                    // Mechanical hatch open / slide whoosh
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.4);
                    gain.gain.setValueAtTime(vol * 0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'shatter') {
                    // High-frequency glass crunch
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(3200, now);
                    osc.frequency.exponentialRampToValueAtTime(280, now + 0.3);
                    gain.gain.setValueAtTime(vol * 0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.38);
                } else {
                    // Explosive burst pop

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                }
            } catch (e) {}
        }

        // Helper to construct precise static boundary walls
        function createWallSegment(x1, y1, x2, y2, thickness = 26, wallOpts = {}) {
            const cx = (x1 + x2) / 2;
            const cy = (y1 + y2) / 2;
            const len = Math.hypot(x2 - x1, y2 - y1) + thickness;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            return Bodies.rectangle(cx, cy, len, thickness, {
                isStatic: true,
                angle: angle,
                friction: 0.25,
                restitution: 0.1,
                render: { visible: false },
                ...wallOpts
            });
        }

        function createContourWalls(points, thickness = 26, wallOpts = {}) {
            const walls = [];
            for (let i = 0; i < points.length - 1; i++) {
                const seg = createWallSegment(points[i][0], points[i][1], points[i + 1][0], points[i + 1][1], thickness, wallOpts);
                // Tag bottom floor segments for trapdoor dumping
                if (Math.abs(points[i][1] - points[i + 1][1]) < 4 && points[i][1] > 420) {
                    seg.isFloor = true;
                    jarFloorBodies.push(seg);
                }
                walls.push(seg);
            }
            return walls;
        }

        // Authentic TikTok Gift coin-based sizing scale:
        // Rose (1 coin) drops cute and small (13px radius), higher coin gifts scale up progressively
        function calculateGiftRadius(coinVal, scaleMultiplier = 1.0) {
            const c = Math.max(1, parseInt(coinVal, 10) || 1);
            let baseR = 13;
            if (c >= 30000) {
                baseR = 44; // TikTok Universe / Lion (30k+ coins)
            } else if (c >= 10000) {
                baseR = 40; // Falcon / Phoenix (10k+ coins)
            } else if (c >= 2000) {
                baseR = 36; // Whale Diving / Castle (2k+ coins)
            } else if (c >= 1000) {
                baseR = 33; // Galaxy / Fireworks / Rose Bear (1k+ coins)
            } else if (c >= 500) {
                baseR = 29; // Money Gun / Swan (500 coins)
            } else if (c >= 200) {
                baseR = 26; // Corgi / Hearts / Galaxy's Bestest (200-300 coins)
            } else if (c >= 100) {
                baseR = 23; // Confetti / Hand Heart (100 coins)
            } else if (c >= 50) {
                baseR = 20; // Cap / Sunglasses (50-99 coins)
            } else if (c >= 20) {
                baseR = 18; // Perfume / Doughnut (20-30 coins)
            } else if (c >= 10) {
                baseR = 16; // Bibingka (10 coins)
            } else if (c >= 5) {
                baseR = 14.5; // Finger Heart (5 coins)
            } else {
                baseR = 13; // Rose, GG, Ice Cream Cone, Heart Me (1 coin - small)
            }
            const scaled = Math.round(baseR * scaleMultiplier);
            return Math.max(10, Math.min(52, scaled));
        }

        // Dedicated Piggy Bank Gold Coin sizing scale:
        // Gift-based: 1 coin = small coin (9.5px radius, 19px diameter)
        // High coins (e.g. Galaxy = 1000 coins) = big coin (21px radius, 42px diameter)
        // Calibrated so all coins smoothly slide through the coin slot and fit inside the piggy bank belly
        function calculatePiggyCoinRadius(coinVal, scaleMultiplier = 1.0) {
            const c = Math.max(1, parseInt(coinVal, 10) || 1);
            let baseR = 10;
            if (c >= 20000) {
                baseR = 25; // Universe / Lion (20k-35k coins)
            } else if (c >= 2000) {
                baseR = 23; // Whale Diving / Falcon (2k-10k coins)
            } else if (c >= 1000) {
                baseR = 21; // Galaxy / Fireworks / Rose Bear (1k coins) - big coin!
            } else if (c >= 500) {
                baseR = 18; // Money Gun / Swan (500 coins)
            } else if (c >= 200) {
                baseR = 16; // Corgi / Hearts / Galaxy's Bestest (200-300 coins)
            } else if (c >= 100) {
                baseR = 14; // Confetti / Hand Heart (100 coins)
            } else if (c >= 50) {
                baseR = 13; // Cap / Sunglasses (50-99 coins)
            } else if (c >= 20) {
                baseR = 12; // Perfume / Doughnut (20-30 coins)
            } else if (c >= 5) {
                baseR = 11; // Finger Heart (5 coins)
            } else {
                baseR = 9.5; // 1 Coin gifts: Rose, Heart Me, Ice Cream, GG (small coin!)
            }
            const scaled = Math.round(baseR * scaleMultiplier);
            return Math.max(8, Math.min(26, scaled));
        }

        function initPotionWavePoints() {
            potionWavePoints = [];
            for (let i = 0; i < POTION_MAX_POINTS; i++) {
                potionWavePoints.push({
                    x: 65 + (i / (POTION_MAX_POINTS - 1)) * 310,
                    h: 0,
                    vh: 0
                });
            }
        }
        initPotionWavePoints();

        function getSurfaceYAtX(x) {
            const curSurfaceY = 500 - potionFillLevel * (500 - 140);
            const sloshOffset = (x - 220) * Math.sin(potionSloshAngle);
            let waveH = 0;
            if (potionWavePoints.length > 0) {
                const ratio = Math.max(0, Math.min(1, (x - 65) / 310));
                const idx = Math.min(potionWavePoints.length - 1, Math.floor(ratio * (potionWavePoints.length - 1)));
                waveH = potionWavePoints[idx].h;
            }
            return curSurfaceY + waveH + sloshOffset;
        }

        function triggerLiquidSplash(impactX, strength = 1.0) {
            let bestIdx = 0;
            let minDist = 9999;
            for (let i = 0; i < potionWavePoints.length; i++) {
                const d = Math.abs(potionWavePoints[i].x - impactX);
                if (d < minDist) { minDist = d; bestIdx = i; }
            }
            
            const force = (14 + strength * 16);
            if (potionWavePoints[bestIdx]) {
                potionWavePoints[bestIdx].vh -= force;
                if (bestIdx > 0) potionWavePoints[bestIdx - 1].vh -= force * 0.7;
                if (bestIdx < potionWavePoints.length - 1) potionWavePoints[bestIdx + 1].vh -= force * 0.7;
            }

            // Angular sloshing impulse (causes water surface to swing left and right!)
            potionSloshVelocity += (Math.random() - 0.5) * 0.055 * strength;

            // Splash particles (fly up and fall back)
            const count = 5 + Math.floor(strength * 4);
            const curY = getSurfaceYAtX(impactX);
            for (let s = 0; s < count; s++) {
                potionSplashParticles.push({
                    x: impactX + (Math.random() - 0.5) * 18,
                    y: curY - 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: -4 - Math.random() * 5.5,
                    r: 2 + Math.random() * 2.5,
                    life: 1.0

            // Rising magical bubbles

                potionBubbles.push({
                    x: 220 + (Math.random() - 0.5) * 80,
                    y: Math.min(480, curY + 25 + Math.random() * 90),

            const targetLimit = isPriceMode ? (settings.coinGoal || 500) : (settings.maxCapacity || 80);
            const currentProgress = isPriceMode ? currentCoins : currentCount;

            const ratio = isInfinite
                ? Math.min(0.90, 0.06 + ((currentCoins % 1000) / 1000) * 0.84)
                : Math.min(0.90, 0.06 + Math.min(1.0, currentProgress / Math.max(1, targetLimit)) * 0.84);
            targetPotionFill = ratio;
        }

        function updatePotionSimulation() {
            // 1. Smoothly rise liquid level towards target
            potionFillLevel += (targetPotionFill - potionFillLevel) * 0.04;

            // 2. Angular slosh swing (pendulum harmonic motion with spring torque and damping)
            // Swings like real water in a decanter, then dampens and stops in ~1.5 - 2s
            potionSloshAngle += potionSloshVelocity;
            potionSloshVelocity += (-potionSloshAngle * 0.07); // Restoring gravity
            potionSloshVelocity *= 0.94; // Velocity damping
            potionSloshAngle *= 0.96; // Angle decay

            // 3. Wave column spring physics
            const tension = 0.028;
            const damping = 0.94;
            const spread = 0.22;

            for (let i = 0; i < potionWavePoints.length; i++) {
                const p = potionWavePoints[i];
                p.vh += -p.h * tension;
                p.h += p.vh;
                p.vh *= damping;
            }

            // Neighbor wave propagation
            for (let pass = 0; pass < 2; pass++) {
                for (let i = 0; i < potionWavePoints.length; i++) {
                    if (i > 0) {
                        const dL = potionWavePoints[i].h - potionWavePoints[i - 1].h;
                        potionWavePoints[i - 1].vh += dL * spread;
                    }
                    if (i < potionWavePoints.length - 1) {
                        const dR = potionWavePoints[i].h - potionWavePoints[i + 1].h;
                        potionWavePoints[i + 1].vh += dR * spread;
                    }
                }
            }

            // 4. Update falling pouring liquid streams/droplets
            for (let i = potionStreams.length - 1; i >= 0; i--) {
                const s = potionStreams[i];
                s.y += s.vy;
                s.vy += 0.5; // gravity
                const curSurface = getSurfaceYAtX(s.x);
                if (s.y >= curSurface) {
                    triggerLiquidSplash(s.x, s.strength);
                    potionStreams.splice(i, 1);
                }
            }

            // 5. Update splash droplets
            for (let i = potionSplashParticles.length - 1; i >= 0; i--) {
                const p = potionSplashParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.35;
                p.life -= 0.035;
                if (p.life <= 0 || p.y > getSurfaceYAtX(p.x) + 5) {
                    potionSplashParticles.splice(i, 1);
                }
            }

            // 6. Update rising bubbles
            for (let i = potionBubbles.length - 1; i >= 0; i--) {
                const b = potionBubbles[i];
                b.y += b.vy;
                b.wobble += 0.08;
                b.x += Math.sin(b.wobble) * 0.45;
                if (b.y <= getSurfaceYAtX(b.x) || b.y < 120) {
                    potionBubbles.splice(i, 1);
                }
            }
        }

        function renderDecanterLiquid(targetCtx) {
            targetCtx.save();

            // 1. Clip to Decanter Inner Cavity
            targetCtx.beginPath();
            targetCtx.moveTo(DECANTER_INNER_CAVITY[0][0], DECANTER_INNER_CAVITY[0][1]);
            for (let i = 1; i < DECANTER_INNER_CAVITY.length; i++) {
                targetCtx.lineTo(DECANTER_INNER_CAVITY[i][0], DECANTER_INNER_CAVITY[i][1]);
            }
            targetCtx.closePath();
            targetCtx.clip();

            const curSurfaceY = 500 - potionFillLevel * (500 - 140);

            // 2. Liquid Body Polygon
            targetCtx.beginPath();
            targetCtx.moveTo(400, 520);
            targetCtx.lineTo(40, 520);
            targetCtx.lineTo(40, curSurfaceY);

            for (let i = 0; i < potionWavePoints.length; i++) {
                const wp = potionWavePoints[i];
                const sloshOffset = (wp.x - 220) * Math.sin(potionSloshAngle);
                const py = curSurfaceY + wp.h + sloshOffset;
                targetCtx.lineTo(wp.x, py);
            }
            targetCtx.lineTo(400, curSurfaceY);
            targetCtx.closePath();

            // Rich Red Health Potion Gradient
            const liquidGrad = targetCtx.createLinearGradient(0, 505, 0, Math.max(30, curSurfaceY - 30));
            liquidGrad.addColorStop(0.0, '#7f1d1d'); // deep ruby base
            liquidGrad.addColorStop(0.35, '#991b1b');
            liquidGrad.addColorStop(0.70, '#dc2626');
            liquidGrad.addColorStop(1.0, '#ef4444'); // glowing surface
            targetCtx.fillStyle = liquidGrad;
            targetCtx.fill();

            // Inner volumetric ambient glow
            const radialGlow = targetCtx.createRadialGradient(220, 385, 20, 220, 385, 140);
            radialGlow.addColorStop(0.0, 'rgba(254, 202, 202, 0.45)');
            radialGlow.addColorStop(0.5, 'rgba(239, 68, 68, 0.25)');
            radialGlow.addColorStop(1.0, 'rgba(153, 27, 27, 0)');
            targetCtx.fillStyle = radialGlow;
            targetCtx.fill();

            // 3. Glowing Surface Wave Line & Specular Foam
            targetCtx.beginPath();
            for (let i = 0; i < potionWavePoints.length; i++) {
                const wp = potionWavePoints[i];
                const sloshOffset = (wp.x - 220) * Math.sin(potionSloshAngle);
                const py = curSurfaceY + wp.h + sloshOffset;
                if (i === 0) targetCtx.moveTo(wp.x, py);
                else targetCtx.lineTo(wp.x, py);
            }
            targetCtx.lineWidth = 3.5;
            targetCtx.strokeStyle = 'rgba(254, 226, 226, 0.9)';
            targetCtx.shadowColor = '#f87171';
            targetCtx.shadowBlur = 10;
            targetCtx.stroke();

            // 4. Rising Magical Bubbles
            targetCtx.shadowBlur = 5;
            targetCtx.shadowColor = '#fecaca';
            for (const b of potionBubbles) {
                targetCtx.beginPath();
                targetCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                targetCtx.fillStyle = `rgba(254, 202, 202, ${b.alpha})`;
                targetCtx.fill();
                targetCtx.beginPath();
                targetCtx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.35, 0, Math.PI * 2);
                targetCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                targetCtx.fill();
            }

            // 5. Falling Liquid Stream & Splash Droplets
            for (const s of potionStreams) {
                targetCtx.beginPath();
                targetCtx.ellipse(s.x, s.y, s.r * 0.7, s.r * 1.6, 0, 0, Math.PI * 2);
                targetCtx.fillStyle = '#ef4444';
                targetCtx.shadowColor = '#f87171';
                targetCtx.shadowBlur = 12;
                targetCtx.fill();
                targetCtx.beginPath();
                targetCtx.moveTo(s.x - s.r * 0.5, s.y);
                targetCtx.lineTo(s.x, s.y - 28);
                targetCtx.lineTo(s.x + s.r * 0.5, s.y);
                targetCtx.fillStyle = 'rgba(239, 68, 68, 0.65)';
                targetCtx.fill();
            }

            for (const p of potionSplashParticles) {
                targetCtx.beginPath();
                targetCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                targetCtx.fillStyle = `rgba(254, 202, 202, ${p.life})`;
                targetCtx.fill();
            }

            targetCtx.restore();
        }

        // Add gift physical body
        function dropGiftItem(giftName, iconUrl, coinVal = 1) {
            if (isResetting) return;

            // Decanter Potion Vial ONLY: Pours a glowing red fluid stream that swings the liquid!
            if (settings.skin === 'decanter') {
                const strength = Math.min(2.8, Math.max(0.8, Math.log10(coinVal + 1)));
                const count = Math.min(5, Math.max(1, Math.round(coinVal > 50 ? 3 : 1)));
                for (let k = 0; k < count; k++) {
                    setTimeout(() => {
                        potionStreams.push({
                            x: 220 + (Math.random() - 0.5) * 8,
                            y: 35,
                            vy: 7.5 + Math.random() * 2.5,
                            r: 5 + strength * 2.2,
                            strength: strength
                        });
                    }, k * 110);
                }
                currentCount++;
                currentCoins += (coinVal || 1);
                updateHud();
                updatePotionFillTarget();
                playDropSound(coinVal > 10 ? 1.2 : 1.0);

                const isInf = (settings.capacityMode === 'infinite' || settings.isInfiniteGoal === true || settings.coinGoal === 'infinite' || settings.coinGoal === 0);
                const targetLimit = (settings.capacityMode === 'price') ? (settings.coinGoal || 500) : (settings.maxCapacity || 80);
                const cur = (settings.capacityMode === 'price') ? currentCoins : currentCount;
                if (!isInf && !isResetting && cur >= targetLimit) {
                    setTimeout(triggerJarFullCelebration, 700);
                }
                return;
            }

            const isPiggySkin = (settings.skin === 'piggy');

            // Always resolve authentic TikTok gift asset (Rose, Heart Me, Finger Heart, etc.)
            const resolved = resolveGiftAsset(giftName, null, iconUrl, coinVal);
            
            // Piggy Bank ONLY: Every gift drops a gold coin whose size is based on the gift!
            // Other jars retain their original authentic TikTok gift icons.
            const actualName = isPiggySkin ? (resolved.name ? `${resolved.name} (Coin)` : 'Gold Coin') : resolved.name;
            const actualIcon = isPiggySkin ? 'images/jars/gold_coin.png' : resolved.icon;

            const isPriceMode = (settings.capacityMode === 'price');
            const scaleMultiplier = Math.max(0.7, Math.min(2.5, parseFloat(settings.giftScale || 1.0)));
            const radius = isPiggySkin
                ? calculatePiggyCoinRadius(coinVal, scaleMultiplier)
                : calculateGiftRadius(coinVal, scaleMultiplier);
            const cx = stageW / 2;

            let spawnSpread = 20;
            let spawnY = 25;

            if (settings.skin === 'mason') {
                spawnSpread = 40;
                spawnY = 25;
            } else if (settings.skin === 'crate') {
                spawnSpread = 50;
                spawnY = 25;
            } else if (settings.skin === 'fishbowl') {
                spawnSpread = 30;
                spawnY = 20;
            } else if (settings.skin === 'decanter') {
                spawnSpread = 16;
                spawnY = 15;
            } else if (settings.skin === 'piggy') {
                spawnSpread = 6;
                spawnY = 55;
            }

            const spawnX = cx + (Math.random() - 0.5) * spawnSpread;
            const bounciness = (settings.bounciness !== undefined && settings.bounciness !== null) ? parseFloat(settings.bounciness) : 0.4;

            const giftBody = Bodies.circle(spawnX, spawnY, radius, {
                restitution: isPiggySkin ? 0.15 : bounciness,
                friction: isPiggySkin ? 0.35 : (settings.friction || 0.1),
                frictionAir: isPiggySkin ? 0.02 : 0.015,
                density: 0.003,
                angle: (Math.random() - 0.5) * 0.3
            });

            const velX = isPiggySkin ? (Math.random() - 0.5) * 0.1 : ((Math.random() - 0.5) * 0.5);
            const velY = isPiggySkin ? (5.0 + Math.random() * 1.5) : (3.5 + Math.random() * 1.5);
            Body.setVelocity(giftBody, {
                x: velX,
                y: velY
            });
            Body.setAngularVelocity(giftBody, (Math.random() - 0.5) * 0.05);

            giftBody.customGift = {
                name: actualName,
                originalName: resolved.name,
                iconUrl: actualIcon,
                isCoin: isPiggySkin,
                radius: radius,
                coins: coinVal,
                createdAt: Date.now()
            };

            if (actualIcon) {
                getCachedImage(actualIcon);
            }

            World.add(engine.world, giftBody);
            currentCount++;
            currentCoins += (coinVal || 1);
            updateHud();
            playDropSound(coinVal > 10 ? 1.2 : 1.0);

            // Capacity threshold check
            const isInfinite = (settings.capacityMode === 'infinite' || settings.isInfiniteGoal === true || settings.coinGoal === 'infinite' || settings.coinGoal === 0);
            const targetLimit = isPriceMode ? (settings.coinGoal || 500) : (settings.maxCapacity || 80);
            const currentProgress = isPriceMode ? currentCoins : currentCount;

            if (!isInfinite && !isResetting && currentProgress >= targetLimit) {
                triggerJarFullCelebration();
            }

            // In infinite or high volume sessions, maintain silky 60fps by recycling oldest settled gifts when body count exceeds 180
            const allDynamic = Composite.allBodies(engine.world).filter(b => !b.isStatic && b.customGift);
            if (allDynamic.length > 180) {
                const oldest = allDynamic.sort((a, b) => (a.customGift?.createdAt || 0) - (b.customGift?.createdAt || 0))[0];
                if (oldest) {
                    World.remove(engine.world, oldest);
                }
            }
        }

        // Strictly 1 icon drop per gift item sent (1 any gift = 1 icon drop)
        function queueGiftDrops(giftName, iconUrl, count, coins) {
            // Exactly 1 icon per gift!
            // If someone sent 1 Galaxy -> count is 1 -> exactly 1 drop!
            // If someone sent a streak/combo of N gifts -> N drops!
            const dropTotal = Math.min(40, Math.max(1, parseInt(count, 10) || 1));
            const unitCoins = Math.max(1, Math.round((coins || dropTotal || 1) / dropTotal));

            for (let i = 0; i < dropTotal; i++) {
                setTimeout(() => {
                    dropGiftItem(giftName, iconUrl, unitCoins);
                }, i * 90);
            }
        }

            const uEl = document.getElementById('toastUser');
