        // Update HUD Counter & Capacity Bar
        function updateHud() {
            const isInfinite = (settings.capacityMode === 'infinite' || settings.isInfiniteGoal === true || settings.coinGoal === 'infinite' || settings.coinGoal === 0);
            const isPriceMode = (settings.capacityMode === 'price') || isInfinite;
            const targetLimit = isInfinite ? '♾️' : (isPriceMode ? (settings.coinGoal || 500) : (settings.maxCapacity || 80));
            const currentProgress = isPriceMode ? currentCoins : currentCount;

            const countEl = document.getElementById('txtJarCount');
            const fillEl = document.getElementById('jarFillBar');
            const titleEl = document.getElementById('txtJarTitle');
            const hudEl = document.getElementById('jarHud');

            if (!settings.showCounterBar && urlParams.get('hud') !== 'true') {
                if (hudEl) {
                    hudEl.style.display = 'none';
                    hudEl.style.opacity = '0';
                }
                return;
            } else {
                if (hudEl) {
                    hudEl.style.display = 'flex';
                    hudEl.style.opacity = '1';
                }
            }

            if (isInfinite) {
                titleEl.innerText = settings.jarTitle || '🪙 TikTok Coin Jar (Infinite)';
                countEl.innerText = `🪙 ${currentCoins.toLocaleString()} Coins (♾️ Infinite)`;
                fillEl.style.width = '100%';
                fillEl.style.background = 'linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #f472b6, #fbbf24)';
            } else {
                titleEl.innerText = settings.jarTitle || (isPriceMode ? '🪙 TikTok Coin Jar' : '🏺 TikTok Gift Jar');
                countEl.innerText = isPriceMode ? `🪙 ${currentCoins.toLocaleString()} / ${targetLimit}` : `🏺 ${currentCount} / ${targetLimit}`;
                const pct = Math.min(100, Math.round((currentProgress / targetLimit) * 100));
                fillEl.style.width = `${pct}%`;

                if (pct >= 85) {
                    fillEl.style.background = 'linear-gradient(90deg, #f59e0b, #ef4444)';
                } else {
                    fillEl.style.background = 'linear-gradient(90deg, #38bdf8, #10b981, #facc15)';
                }
            }

            if (settings.skin === 'decanter') {
                if (typeof updatePotionFillTarget === 'function') updatePotionFillTarget();
                if (!settings.jarTitle) {
                    titleEl.innerText = isInfinite ? '🧪 Health Potion Vial (Infinite)' : '🧪 Health Potion Decanter';
                }
                fillEl.style.background = 'linear-gradient(90deg, #991b1b, #dc2626, #ef4444, #f87171)';
            }
        }

        // FULL JAR RESET CELEBRATIONS
        function triggerJarFullCelebration() {
            if (isResetting) return;
            isResetting = true;

            const stage = document.getElementById('jarStage');
            const banner = document.getElementById('fullBanner');
            const titleEl = document.getElementById('fullBannerTitle');
            const subEl = document.getElementById('fullBannerSub');
            const behavior = settings.resetBehavior || 'explosion';

            // 1. CLASSIC: Instant, clean reset without special effects
            if (behavior === 'classic') {
                playResetSound('classic');
                resetJarQuietly();
                fetch('/api/jar/reset', { method: 'POST' }).catch(() => {});
                return;
            }

            // 2. TRAPDOOR SLIDE DUMP: Open bottom hatch and plunge gifts down
            if (behavior === 'dump') {
                titleEl.innerText = '🚪 TRAPDOOR DUMP! 🚪';
                subEl.innerText = 'Emptying jar out the bottom hatch!';
                banner.classList.add('active');
                stage.classList.add('trapdoor-open');
                playResetSound('dump');

                // Remove floor collision walls so gifts fall through
                if (jarFloorBodies.length > 0) {
                    jarFloorBodies.forEach(fb => World.remove(engine.world, fb));
                }

                // Apply downward velocity plunge
                const allBodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
                allBodies.forEach(b => {
                    b.frictionAir = 0.005;
                    Body.setVelocity(b, {
                        x: (Math.random() - 0.5) * 2,
                        y: 9 + Math.random() * 5
                    });
                });

                if (celebrationTimeout) clearTimeout(celebrationTimeout);
                celebrationTimeout = setTimeout(() => {
                    resetJarQuietly();
                    fetch('/api/jar/reset', { method: 'POST' }).catch(() => {});
                }, 3000);
                return;
            }

            // 3. EXPLOSIVE BURST: Confetti burst & launch outward
            if (behavior === 'explosion') {
                titleEl.innerText = '🎉 EXPLOSIVE BURST! 🎉';
                subEl.innerText = 'Jar full celebration blast!';
                banner.classList.add('active');
                stage.classList.add('shake');
                playResetSound('explosion');
                triggerConfettiBurst();

                const allBodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
                allBodies.forEach(b => {
                    const forceX = (b.position.x - stageW / 2) * 0.003 + (Math.random() - 0.5) * 0.08;
                    const forceY = -0.18 - Math.random() * 0.14;
                    Body.applyForce(b, b.position, { x: forceX, y: forceY });
                    Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.35);
                });

                if (launchTimeout) clearTimeout(launchTimeout);
                launchTimeout = setTimeout(() => {
                    allBodies.forEach(b => { b.collisionFilter.mask = 0; });
                }, 350);

                if (celebrationTimeout) clearTimeout(celebrationTimeout);
                celebrationTimeout = setTimeout(() => {
                    resetJarQuietly();
                    fetch('/api/jar/reset', { method: 'POST' }).catch(() => {});
                }, 3000);
                return;
            }

            // 4. GLASS SHATTER: Fracture & crystal shard burst
            if (behavior === 'shatter') {
                titleEl.innerText = '✨ GLASS SHATTER! ✨';
                subEl.innerText = 'Jar fractured & bursting!';
                banner.classList.add('active');
                stage.classList.add('shake', 'shattering');
                playResetSound('shatter');
                triggerGlassShardBurst();

                const allBodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
                allBodies.forEach(b => {
                    const forceX = (b.position.x - stageW / 2) * 0.005 + (Math.random() - 0.5) * 0.12;
                    const forceY = -0.12 - Math.random() * 0.1;
                    Body.applyForce(b, b.position, { x: forceX, y: forceY });
                    b.collisionFilter.mask = 0;
                });

                if (celebrationTimeout) clearTimeout(celebrationTimeout);
                celebrationTimeout = setTimeout(() => {
                    resetJarQuietly();
                    fetch('/api/jar/reset', { method: 'POST' }).catch(() => {});
                }, 3000);
            }
        }

        // Clean quiet reset without looping or re-triggering celebration
        function resetJarQuietly() {
            if (launchTimeout) clearTimeout(launchTimeout);
            if (celebrationTimeout) clearTimeout(celebrationTimeout);

            const allBodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
            allBodies.forEach(b => World.remove(engine.world, b));
            currentCount = 0;
            currentCoins = 0;
            updateHud();

            // Reset potion liquid level
            targetPotionFill = 0.06;
            potionFillLevel = 0.06;
            potionStreams = [];
            potionSplashParticles = [];
            potionBubbles = [];
            if (typeof initPotionWavePoints === 'function') initPotionWavePoints();

            const stage = document.getElementById('jarStage');
            const banner = document.getElementById('fullBanner');
            if (stage) stage.classList.remove('shake', 'shattering', 'trapdoor-open');
            if (banner) banner.classList.remove('active');

            activeFxParticles = [];
            buildJarBoundaries(settings.skin);
            isResetting = false;
        }

        // Custom Physics Render Loop
        function renderLoop() {
            Engine.update(engine, 1000 / 60);

            ctx.clearRect(0, 0, stageW, stageH);

            // 1. If Decanter skin is active, simulate and render animated red health potion
            if (settings.skin === 'decanter') {
                updatePotionSimulation();
                renderDecanterLiquid(ctx);
            }

            // 2. Render all gift bodies (for Mason, Piggy, Fishbowl, Crate)
            const allBodies = Composite.allBodies(engine.world);
            allBodies.forEach(body => {
                if (body.isStatic || !body.customGift) return;

                const { position, angle, customGift } = body;
                const r = customGift.radius;
                const img = customGift.iconUrl ? getCachedImage(customGift.iconUrl) : null;

                ctx.save();
                ctx.translate(position.x, position.y);
                ctx.rotate(angle);

                // Optional outlined border around gift (only drawn if user explicitly enabled setting)
                if (settings.showGiftBorder === true) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, r + 2, 0, Math.PI * 2);
                    ctx.lineWidth = 2.0;
                    ctx.strokeStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(56, 189, 248, 0.7)';
                    ctx.shadowBlur = 4;
                    ctx.stroke();
                    ctx.restore();
                }

                const isCoinItem = customGift.isCoin || (settings.skin === 'piggy');
                let renderImg = isCoinItem ? getCachedImage('images/jars/gold_coin.png') : ((img && img.complete && img.naturalWidth > 0) ? img : null);
                if (!renderImg) {
                    // Guaranteed instant preloaded legitimate TikTok gift image fallback (never draw numbered balls)
                    const c = customGift.coins || 1;
                    const nm = (customGift.name || '').toLowerCase();
                    let fallbackSrc = 'images/tiktok-gifts/5655_rose.webp';
                    if (c >= 1000 || nm.includes('galaxy') || nm.includes('universe') || nm.includes('lion')) {
                        fallbackSrc = 'images/tiktok-gifts/11046_galaxy.webp';
                    } else if (c >= 199 || nm.includes('hearts')) {
                        fallbackSrc = 'images/tiktok-gifts/5586_hearts.webp';
                    } else if (c >= 99 || nm.includes('cap') || nm.includes('hat')) {
                        fallbackSrc = 'images/tiktok-gifts/6104_cap.webp';
                    } else if (c >= 30 || nm.includes('doughnut') || nm.includes('donut')) {
                        fallbackSrc = 'images/tiktok-gifts/5879_doughnut.webp';
                    } else if (c >= 10 || nm.includes('bibingka')) {
                        fallbackSrc = 'images/tiktok-gifts/6027_bibingka.webp';
                    } else if (c >= 5 || nm.includes('finger') || nm.includes('panda')) {
                        fallbackSrc = 'images/tiktok-gifts/5487_finger_heart.webp';
                    } else if (nm.includes('heart')) {
                        fallbackSrc = 'images/tiktok-gifts/7934_heart_me.webp';
                    } else if (nm.includes('ice')) {
                        fallbackSrc = 'images/tiktok-gifts/5827_ice_cream_cone.webp';
                    }
                    renderImg = getCachedImage(fallbackSrc);
                }

                if (renderImg && renderImg.complete && renderImg.naturalWidth > 0) {
                    const isRose = !isCoinItem && ((customGift.name && customGift.name.toLowerCase().includes('rose')) ||
                                   (customGift.iconUrl && customGift.iconUrl.toLowerCase().includes('rose')));
                    const itemSize = r * (isCoinItem ? 2.05 : (isRose ? 2.4 : 2.25));
                    ctx.drawImage(renderImg, -itemSize / 2, -itemSize / 2, itemSize, itemSize);
                }

                ctx.restore();
            });

            // 2. Render celebration particles (Confetti & Glass Shards)
            if (activeFxParticles.length > 0) {
                for (let i = activeFxParticles.length - 1; i >= 0; i--) {
                    const p = activeFxParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += (p.type === 'confetti' ? 0.35 : 0.28);
                    p.rot += p.vRot;
                    p.life -= 0.016;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;

                    if (p.type === 'confetti') {
                        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(0, -p.size / 2);
                        ctx.lineTo(p.size / 2, p.size / 2);
                        ctx.lineTo(-p.size / 3, p.size / 3);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                    ctx.restore();

                    if (p.life <= 0 || p.y > stageH + 60) {
                        activeFxParticles.splice(i, 1);
                    }
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // Sync Settings from Server
        async function loadJarSettings() {
            try {
                const res = await fetch('/api/jar/settings?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data) {
                        settings = { ...settings, ...data };
                        if (urlParams.get('skin')) settings.skin = urlParams.get('skin');
                        if (urlParams.get('cap')) settings.maxCapacity = parseInt(urlParams.get('cap'), 10);
                        if (urlParams.get('hideHud') === 'true') settings.showCounterBar = false;
                        applySettings();
                    }
                }
            } catch (e) {}
        }

        function applySettings() {
            // 1. Gravity Force
            engine.gravity.y = parseFloat(settings.gravity !== undefined ? settings.gravity : 1.0) * 1.5;

            // 2. Bounciness & Gift Scale updates on existing bodies
            const bounciness = parseFloat(settings.bounciness !== undefined ? settings.bounciness : 0.4);
            const scaleMultiplier = Math.max(0.7, Math.min(2.5, parseFloat(settings.giftScale || 1.0)));

            Composite.allBodies(engine.world).forEach(b => {
                if (!b.isStatic && b.customGift) {
                    b.restitution = bounciness;
                    const oldR = b.customGift.radius || 24;
                    const cCoins = b.customGift.coins || 1;
                    const isCoinItem = b.customGift.isCoin || (settings.skin === 'piggy');
                    const targetR = isCoinItem
                        ? calculatePiggyCoinRadius(cCoins, scaleMultiplier)
                        : calculateGiftRadius(cCoins, scaleMultiplier);
                    if (targetR !== oldR && oldR > 0) {
                        const ratio = targetR / oldR;
                        Body.scale(b, ratio, ratio);
                        b.customGift.radius = targetR;
                    }
                }
            });

            // 3. Jar skin & boundaries
            updateJarSkin(settings.skin || 'mason', settings.customSkinUrl);

            // 4. HUD
            updateHud();
        }

        // Sync Initial State from Server
        async function loadJarState() {
            try {
                const res = await fetch('/api/jar/state?t=' + Date.now());
                if (res.ok) {
                    const st = await res.json();
                    if (st) {
                        currentCount = parseInt(st.currentCount || 0, 10);
                        currentCoins = parseInt(st.totalCoins || 0, 10);
                        updateHud();
                    }
                }
            } catch (e) {}
        }

        // Live Event Polling & Multi-channel Sync (TikTok LIVE Studio, OBS & Main App Preview)
        let lastEventTimestamp = Date.now() - 5000;
        let isPollingEvents = false;
        const processedEventIds = new Set();

        function processIncomingJarEvent(payload) {
            if (!payload) return;

            // Handle resets & settings updates
            if (payload.type === 'jar_reset' || payload.action === 'reset_jar' || payload.type === 'counts_reset') {
                resetJarQuietly();
                return;
            }
            if (payload.type === 'jar_settings_update' || payload.action === 'settings_update') {
                if (payload.settings) {
                    settings = { ...settings, ...payload.settings };
                    applySettings();
                } else {
                    loadJarSettings();
                }
                return;
            }

            // Accept any genuine gift event:
            // 1. Dedicated jar_drop events
            // 2. Live TikTok stream gift events (type === 'gift' or action === 'drop_gift' or event === 'gift')
            // 3. Any payload with giftName / giftId
            const isGiftEvent = payload.type === 'jar_drop' || 
                                payload.type === 'gift' || 
                                payload.action === 'drop_gift' || 
                                payload.event === 'gift' || 
                                Boolean(payload.giftName || payload.giftId);

            if (!isGiftEvent) return;

            const gName = String(payload.giftName || payload.name || payload.label || 'Rose').trim();
            const gId = String(payload.giftId || payload.id || '').trim();
            const rawIcon = payload.icon || payload.giftPictureUrl || payload.giftIcon || '';
            const gCount = Math.max(1, parseInt(payload.count || payload.repeatCount || payload.amount || 1, 10));
            const gCoins = Math.max(1, parseInt(payload.coins || payload.diamondCount || gCount || 1, 10));
            const uName = payload.username || payload.nickname || 'Viewer';
            const uAvatar = payload.avatar || payload.profilePictureUrl || 'images/default_avatar.svg';

            // Multi-channel deduplication key (BroadcastChannel + Storage + Polling window)
            const normUser = uName.toLowerCase().trim();
            const normGift = gName.toLowerCase().trim();
            const timeWindow = Math.floor((payload.timestamp || Date.now()) / 2000);
            const dedupKey = payload.id ? `id_${payload.id}` : `${normUser}_${normGift}_${gCount}_${timeWindow}`;

            if (processedEventIds.has(dedupKey)) return;
            processedEventIds.add(dedupKey);
            if (processedEventIds.size > 500) {
                const first = processedEventIds.values().next().value;
                processedEventIds.delete(first);
            }

            const resolved = resolveGiftAsset(gName, gId, rawIcon, gCoins);
            const finalName = resolved.name;
            const finalIcon = resolved.icon;

            queueGiftDrops(finalName, finalIcon, gCount, gCoins);
            showDropToast(uName, finalName, gCount, finalIcon, uAvatar);
        }

        function startLiveEventPolling() {
            // 1. Primary BroadcastChannel for dedicated jar events (0ms latency)
            try {
                const bc = new BroadcastChannel('renearn_jar_events');
                bc.onmessage = function(e) {
                    if (!e.data) return;
                    processIncomingJarEvent(e.data);
                };
            } catch (err) {}

            // 2. Secondary BroadcastChannel for TikTok live stream overlay events (catches every live gift)
            try {
                const bcOverlay = new BroadcastChannel('renearn_overlay_events');
                bcOverlay.onmessage = function(e) {
                    if (!e.data) return;
                    if (e.data.type === 'gift' || e.data.type === 'jar_drop' || e.data.giftName || e.data.type === 'jar_reset') {
                        processIncomingJarEvent(e.data);
                    }
                };
            } catch (err) {}

            // 2. Storage event listener for cross-window sync
            window.addEventListener('storage', (e) => {
                if (e.key === 'renearn_jar_drop_event' && e.newValue) {
                    try {
                        const data = JSON.parse(e.newValue);
                        processIncomingJarEvent(data);
                    } catch (err) {}
                }
                if (e.key === 'renearn_jar_reset_event' && e.newValue) {
                    resetJarQuietly();
                }
                if (e.key === 'renearn_jar_settings_event' && e.newValue) {
                    try {
                        const data = JSON.parse(e.newValue);
                        if (data && data.settings) {
                            settings = { ...settings, ...data.settings };
                            applySettings();
                        } else {
                            loadJarSettings();
                        }
                    } catch (err) { loadJarSettings(); }
                }
            });

            // 3. Reliable HTTP Polling on /api/events (Unthrottled WorkerTicker)
            async function pollJarEvents() {
                if (isPollingEvents) return;
                isPollingEvents = true;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                try {
                    const res = await fetch(`/api/events?since=${lastEventTimestamp}&t=${Date.now()}`, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.serverTime) {
                            lastEventTimestamp = data.serverTime;
                        }
                        if (data.events && Array.isArray(data.events) && data.events.length > 0) {
                            data.events.forEach(ev => {
                                processIncomingJarEvent(ev);
                            });
                        }
                    }
                } catch (e) {
                } finally {
                    clearTimeout(timeoutId);
                    isPollingEvents = false;
                }
            }

            if (typeof window.createWorkerTicker === 'function') {
                window.createWorkerTicker(pollJarEvents, 150);
            } else {
                setInterval(pollJarEvents, 250);
            }
        }

        // URL Query Param Overrides
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('skin')) settings.skin = urlParams.get('skin');
        if (urlParams.get('cap')) settings.maxCapacity = parseInt(urlParams.get('cap'), 10);
        if (urlParams.get('hideHud') === 'true') settings.showCounterBar = false;

        // On-Screen Ranking Leaderboard Dock Setup
        const showLeaderboard = urlParams.get('leaderboard') === 'true' || urlParams.has('ranking');
        const rankingType = urlParams.get('ranking') || (urlParams.get('leaderboard') === 'true' ? 'both' : '');
        const dockPos = urlParams.get('dock') || 'left';

        if (showLeaderboard) {
            const dock = document.getElementById('onScreenRankingDock');
            const frame = document.getElementById('embeddedLeaderboardFrame');
            const wrap = document.getElementById('overlayScreenWrap');
            if (dock && frame && wrap) {
                dock.classList.add('active');
                if (dockPos === 'right') wrap.classList.add('dock-right');
                const isDual = (rankingType === 'both' || rankingType === 'all' || !rankingType);
                if (isDual) frame.classList.add('dual-card');
                const typeParam = isDual ? '' : `&type=${rankingType}`;
                frame.src = `/overlay-leaderboard.html?clean=true${typeParam}`;
            }
        }

        // Expose globally for parent iframe and OBS interaction
        window.dropGiftItem = dropGiftItem;
        window.queueGiftDrops = queueGiftDrops;
        window.showDropToast = showDropToast;
        window.updateJarSkin = updateJarSkin;
        window.loadJarSettings = loadJarSettings;
        window.applySettings = applySettings;
        window.triggerJarFullCelebration = triggerJarFullCelebration;
        window.resetJarQuietly = resetJarQuietly;

        // Parent iframe postMessage bridge (deduplicated through processIncomingJarEvent)
        window.addEventListener('message', (e) => {
            if (!e.data) return;
            const d = e.data;
            if (d.action === 'change_skin' || d.type === 'change_skin') {
                updateJarSkin(d.skin, d.customUrl);
            } else if (d.action === 'settings_update' || d.type === 'settings_update') {
                if (d.settings) {
                    settings = { ...settings, ...d.settings };
                    applySettings();
                } else {
                    loadJarSettings();
                }
            } else if (d.action === 'drop_gift' || d.type === 'drop_gift') {
                processIncomingJarEvent(d);
            } else if (d.action === 'reset_jar' || d.type === 'reset_jar') {
                resetJarQuietly();
            }
        });

        // Quick testing controls when viewing overlay-jar.html directly
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'r' || e.key === 'R') {
                dropGiftItem('Rose', 'images/tiktok-gifts/5655_rose.webp', 1);
                showDropToast('Tester', 'Rose', 1, 'images/tiktok-gifts/5655_rose.webp', 'images/renearn_icon.png');
            } else if (e.key === 'g' || e.key === 'G') {
                dropGiftItem('Galaxy', 'images/tiktok-gifts/11046_galaxy.webp', 1000);
                showDropToast('Tester', 'Galaxy', 1, 'images/tiktok-gifts/11046_galaxy.webp', 'images/renearn_icon.png');
            }
        });
        document.querySelector('.jar-stage')?.addEventListener('click', () => {
            const gift = POPULAR_TIKTOK_GIFTS[clickGiftIndex % POPULAR_TIKTOK_GIFTS.length];
            clickGiftIndex++;
            dropGiftItem(gift.name, gift.icon, gift.coins || 1);
            showDropToast('Viewer', gift.name, 1, gift.icon, 'images/renearn_icon.png');
        });

        function renderJarLockedOverlay() {
            const wrap = document.createElement('div');
            wrap.id = 'jarLockedOverlay';
            wrap.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,0.92);backdrop-filter:blur(12px);color:#fff;font-family:\'Outfit\',sans-serif;z-index:999999;text-align:center;padding:24px;';
            wrap.innerHTML = `
                <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#38bdf8,#a855f7);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 30px rgba(56,189,248,0.4);margin-bottom:16px;">🫙</div>
                <h2 style="font-size:22px;font-weight:800;color:#f8fafc;margin-bottom:8px;">Interactive Gift Jar is a Premium Feature</h2>
                <p style="font-size:13.5px;color:#94a3b8;max-width:400px;line-height:1.5;margin-bottom:20px;">
                    Free accounts have access to 10 commands and standard stream overlays. Upgrade to <b>Streamer Premium (₱999)</b> for 60 commands or <b>Expert (₱3,999)</b> for 150 commands to unlock the Interactive Matter.js Physics Gift Jar!
                </p>
                <a href="/app.html" target="_blank" style="padding:10px 22px;background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;font-weight:800;font-size:13px;border-radius:10px;text-decoration:none;box-shadow:0 4px 15px rgba(56,189,248,0.4);">
                    👑 Open Manage Subscription
                </a>
            `;
            document.body.appendChild(wrap);
        }

        // Init
        (async function initJarSystem() {
            try {
                const subRes = await fetch('/api/subscription/status' + (window.location.search || ''));
                if (subRes.ok) {
                    const subData = await subRes.json();
                    if (subData && subData.hasJar === false) {
                        renderJarLockedOverlay();
                        return;
                    }
                }
            } catch (err) {}

            loadVerifiedGiftsCatalog();
            loadJarState();
            loadJarSettings().then(() => {
                applySettings();
            });
            startLiveEventPolling();
            requestAnimationFrame(renderLoop);
        })();
    </script>
